# 4000 영역별 확인 항목과 기준서 근거
#
# areas.<영역 번호>.steps.<번호> = {id, title, what, assertions, points, refs}
#   points  그 절차에서 볼 항목 이름(name). 엔진은 이것으로 판정하지 않는다. rows 명령이 실어 보내고 Claude 가 볼 항목 이름으로 쓴다
#   refs    기준서 인용(cite)과 요지(about). 원문을 확인한 것만 넣는다. 확인한 날과 출처는 refs_checked
# 새 영역은 기준서 문단을 원문으로 확인하고 회계사 검토를 받은 뒤 넣는다. 추정한 값을 넣지 않는다

format_version: 1
areas:
  4000C:
    name: 매출채권(장단기)
    note: 매출채권 조서에서 꼭 다룰 실증절차의 주제를 줄여 적은 목록이다. 경영진 주장은 참고로 적었고 검사는 주장을 보지 않는다.
    refs_checked:
      date: '2026-11-12'
      source: 회계위키(accountingwiki.co.kr) 기준서 목록과 문단 조회
      note: 설명은 사무소 말로 줄인 것이다. 문구를 인용하려면 원문을 확인한다
    steps:
      1:
        id: C-1
        title: 총괄표
        what: 당기말 잔액을 총계정원장(시산표)과, 전기말 잔액을 전기 감사보고서와 대조하고 큰 변동의 원인을 밝힌다
        assertions:
        - E
        - C
        - CL
        points:
        - name: 원장(시산표) 대조
          any:
          - 전기
        - name: 변동 원인
        refs:
        - cite: 감사기준서 330 문단 20
          about: 재무제표의 정보가 기초 회계기록과 일치하는지 확인하거나 차이를 조정한다
        - cite: 감사기준서 520
          about: 분석적절차
      2:
        id: C-2
        title: 거래처별 명세서
        what: 거래처별 명세서의 합계를 검산해 장부와 대조하고, 유의적이거나 비경상적인 항목을 훑어본다
        assertions:
        - C
        - V
        points:
        - name: 합계 검산과 장부 대조
          any:
          - 비경상
          - 유의
          - 이상
          - 대변잔액
          - 대변 잔액
          - 음수
          - 신규
        refs:
        - cite: 감사기준서 330 문단 18
          about: 중요한 계정잔액에는 위험 평가와 관계없이 실증절차를 설계해 수행한다
        - cite: 감사기준서 500
          about: 감사증거
      3:
        id: C-3
        title: 외부조회
        what: 조회 대상을 고르고, 회신을 장부 잔액과 대사하고, 회신이 없는 곳은 대체 절차를 한다(조회 대장은 3320)
        assertions:
        - E
        - RO
        - V
        points:
        - name: 조회 대상 선정
          any:
          - 회신
        - name: 미회신 대체 절차
        refs:
        - cite: 감사기준서 505 문단 7
          about: 조회할 정보와 조회 대상자를 정하고 발송을 통제한다
        - cite: 감사기준서 505 문단 12
          about: 회신이 없는 건마다 대체적 감사절차를 수행한다
        - cite: 감사기준서 330 문단 19
          about: 실증절차로 외부조회를 할지 고려한다
        - cite: 감사기준서 530
          about: 표본감사
      4:
        id: C-4
        title: 계정 분류와 장단기 구분
        what: 일반 상거래가 아닌 채권이 섞였는지 보고 재분류 여부를 정하고, 장단기 구분이 맞는지 본다
        assertions:
        - V
        - CL
        points:
        - name: 상거래 외 채권과 재분류
          any:
          - 장단기
          - 장기
          - 유동성
          - 1년
        refs:
        - cite: 일반기업회계기준 제2장 문단 2.20 · 2.21
          about: 유동자산 분류. 정상 영업주기 안에 회수되는 매출채권은 유동자산으로 두고 1년 안에 실현되지 않을 금액을 주석에 적는다
      5:
        id: C-5
        title: 회수가능성과 대손충당금
        what: 연령분석, 회전율과 회수기일 분석, 회수가 의심되는 채권의 개별 검토(경영진 질문 · 담보), 설정 기준과 전기 비율 비교로 대손충당금이 맞는지 본다
        assertions:
        - V
        - A
        points:
        - name: 연령분석
          any:
          - 회전율
          - 회수기일
          - 회수기간
          - 회수 기일
          - 회수 기간
        - name: 회수 의문 채권 개별 검토
          any:
          - 설정률
          - 설정 기준
          - 적립율
          - 적립률
          - 대손율
          - 경험률
          - 경험율
          - 전기
        refs:
        - cite: 일반기업회계기준 제6장 문단 6.17의2
          about: 회수가 불확실한 금융자산은 합리적이고 객관적인 기준으로 산출한 대손추산액을 대손충당금으로 설정한다
        - cite: 감사기준서 540
          about: 회계추정치와 관련 공시에 대한 감사
      6:
        id: C-6
        title: 기간귀속
        what: 결산일 전후의 제품 인도와 용역 제공이 맞는 기간에 기록됐는지 본다
        assertions:
        - RO
        - V
        points:
        - name: 결산일 전후 거래 검사
        refs:
        - cite: 일반기업회계기준 제16장
          about: 수익
        - cite: 감사기준서 330 문단 18
          about: 중요한 거래유형에는 실증절차를 설계해 수행한다
      7:
        id: C-7
        title: 외화환산
        what: 외화 매출채권의 결산일 환산을 다시 계산해 본다
        assertions:
        - V
        - A
        points:
        - name: 결산일 환율 환산
        refs:
        - cite: 일반기업회계기준 제23장 문단 23.9
          about: 화폐성 외화항목은 보고기간말 마감환율로 환산한다
      8:
        id: C-8
        title: 특수관계자 채권
        what: 명세서에서 특수관계자 채권과 거래를 가려내 금액을 확정하고 3500 특수관계자 조서와 주석으로 잇는다
        assertions:
        - E
        - CL
        points:
        - name: 특수관계자 채권 가려내기
          any:
          - '3500'
          - 주석
          - 공시
        refs:
        - cite: 감사기준서 550
          about: 특수관계자
        - cite: 일반기업회계기준 제25장
          about: 특수관계자 공시. 공시 요구는 문단 25.5 ~ 25.11
      9:
        id: C-9
        title: 공시
        what: 확정 금액을 주석과 대사하고 공시사항(담보 제공, 특수관계자, 대손충당금 변동 등)을 검토한다
        assertions:
        - C
        - CL
        - P
        points:
        - name: 주석 대사와 공시 검토
        refs:
        - cite: 일반기업회계기준 제2장 문단 2.82 · 2.83
          about: 주석에 넣을 사항
        - cite: 감사기준서 330 문단 24
          about: 재무제표의 전반적인 표시가 재무보고체계를 따랐는지 평가한다
