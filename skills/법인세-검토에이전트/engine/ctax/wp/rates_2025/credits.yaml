    grade: "★★★"

# r6(2026-10-11): 감면 소득 구분계산(공통 익금 · 공통 손금 안분). 원문은 법인세법 시행규칙 MST 279435(2025-10-31 시행),
# 조세특례제한법 MST 279739, 조세특례제한법 시행령 MST 279959, 법인세법 시행령 MST 279963. 별지 제48호서식(2021. 10. 28. 개정)은
# 법제처 서식 본문(법인세법 시행규칙 별표 004800, https://www.law.go.kr/LSW/flDownload.do?flSeq=168517837)의 작성방법이다.
income_split:
  scope:
    value: "법률로 법인세가 감면되는 사업과 그 밖의 사업을 함께 하면 구분경리, 나눌 수 없는 공통 익금 · 공통 손금은 안분"
    basis: "조세특례제한법 제143조 제1항 · 시행령 제136조 제1항 (법인세법 제113조 준용) · 법인세법 시행규칙 제75조 제1항 · 제2항 (제76조 제6항 · 제7항 준용)"
    grade: "★★★"
  common_income:
    value: "공통 익금은 감면 사업과 그 밖의 사업의 수입금액 또는 매출액에 비례해 안분"
    basis: "법인세법 시행규칙 제76조 제6항 제1호, 별지 제48호서식 작성방법 3"
    grade: "★★★"
  common_expense_same:
    value: "업종이 같으면 공통 손금은 수입금액 또는 매출액에 비례해 안분"
    basis: "법인세법 시행규칙 제76조 제6항 제2호, 별지 제48호서식 작성방법 4"
    grade: "★★★"
  common_expense_diff:
    value: "업종이 다르면 공통 손금은 개별 손금액(공통 손금이 아닌 손금의 합계액)에 비례해 안분"
    basis: "법인세법 시행규칙 제76조 제6항 제3호 · 같은 항 단서 괄호, 별지 제48호서식 작성방법 4"
    grade: "★★★"
  industry:
    value: "업종 구분은 한국표준산업분류 소분류(소분류에 없으면 중분류)"
    basis: "법인세법 시행규칙 제75조 제2항 후단"
    grade: "★★★"
  loss_offset:
    value: "구분경리한 사업 중 결손이 난 사업이 있으면 그 결손금을 소득이 난 사업의 소득금액에 비례해 나눠 뺀 금액이 감면 사업 소득"
    basis: "조세특례제한법 제143조 제3항"
    grade: "★★★"
  deduction_split:
    value: "이월결손금 · 비과세소득 · 소득공제액이 감면 사업에서 생겼는지 분명하지 않으면 소득금액에 비례해 안분"
    basis: "법인세법 제59조 제2항 · 시행령 제96조 제2호"
    grade: "★★★"

