# fx3(2026-10-10): 감면 소득 범위와 고용증대 · 통합고용 2 · 3차 연도. 원문은 조세특례제한법 MST 279739(2025-11-11 시행),
# 법인세법 MST 276111 · 시행령 MST 279963. 국세청 해석은 질의회신 문서번호로 남긴다(원문 대조는 세법 그래프 MCP 검색 요지).
reduced_income:
  excluded:
    value: "영업외수익 중 이자 · 배당 · 임대료 · 처분이익에서 처분손실을 뺀 순액을 감면 소득에서 뺌"
    basis: "조세특례제한법 제7조 제1항 (해당 사업장에서 발생한 소득) · 법인세법 제59조 제2항 (산출세액 × 감면 소득 / 과세표준) · 시행령 제96조 제2호 (이월결손금 등은 소득금액에 비례해 안분). 수입이자 · 유가증권 처분손익 · 고정자산 처분손익은 감면 업종 소득에 가감하지 않음(국세청 법인46012-1560, 2000.7.13, 서면2팀-707, 2004.4.6)"
    grade: "★★☆"
employment_credit:
  followup:
    value: "2024년이 속하는 과세연도까지 상시근로자가 늘어 받은 고용증대 공제는 중소 · 중견기업이면 그 뒤 2년(대기업 1년) 같은 금액, 인원이 줄면 그해부터 끊김"
