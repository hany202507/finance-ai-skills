# 3 미수수익 조서가 쓰는 기준. 원문 확인: korean-law MCP get_law_text, 2025-12-31 시점 시행본(2026-10-09).
# 등급: ★★★ 원문 확인 / ★★☆ 요지만 / ☆ 확인 불가.

accrued_income:
  accrual_rule:
    value: "원천징수 대상 이자는 기간경과분을 계상해도 익금 아님"
    basis: "법인세법 시행령 제70조 제1항 제1호 단서 괄호: 결산 때 이미 경과한 기간의 이자를 수익으로 계상하면 계상한 사업연도 익금이나, 법 제73조 · 제73조의2 로 원천징수되는 이자는 빼고 수입시기(소득세법 시행령 제45조)에 익금 (대통령령 제35879호, 2025-11-28 시행본)"
    grade: "★★★"
  withholding_rate:
    value: 0.14
    basis: "법인세법 제73조 제1항 본문 (내국법인에 지급하는 이자소득 100분의 14, 법률 제21065호 2025-10-01 시행본)"
    grade: "★★★"
  nonbusiness_loan_rate:
    value: 0.25
    basis: "법인세법 제73조 제1항 단서 (비영업대금의 이익 100분의 25)"
    grade: "★★★"
  financial_exception:
    value: "금융회사 등이 받는 이자"
    basis: "법인세법 제73조 제1항 괄호 · 시행령 제111조 제1항 (금융회사 등에 지급하는 이자는 원천징수하지 않으므로 기간경과분을 계상하면 그 사업연도 익금)"
    grade: "★★★"
