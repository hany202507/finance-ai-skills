# 0 법인세비용 조서(corporate_tax)와 3호 기납부세액(summary.prepaid_rows)이 쓰는 근거. 2026-10-10 fx3.
# 원문 확인: korean-law MCP get_law_text, 2025-12-31 시점 시행 판(법인세법 MST 276111 2025-10-01 시행, 지방세법 MST 276349).
# 묶음 이름은 rates_2025.yaml 의 corporate_tax 와 겹치지 않게 prepaid_tax 로 둔다.

prepaid_tax:
  interim_months:
    value: "개시일부터 6개월이 지난 날부터 2개월 이내 납부, 1천만원 초과분은 1개월(중소기업 2개월) 더 분납(12월 결산이면 7 ~ 10월)"
    basis: "법인세법 제63조 제2항 · 제3항 (중간예납기간이 지난 날부터 2개월 이내 납부) · 제4항 (1천만원 초과 분납), 제64조 제2항 (분납 1개월, 중소기업 2개월). 적요에 중간예납이 없는 선납세금 줄을 이 달에 낸 것으로 중간예납을 추정한다"
    grade: "★★★"
  withholding_split:
    value: "이자의 15.4% 한 줄은 법인세 14%(10원 미만 버림)와 지방소득세(법인세의 10%)로 나눔"
    basis: "법인세법 제73조 제1항 (이자소득 100분의 14, 비영업대금의 이익 100분의 25) · 지방세법 제103조의29 제1항 (원천징수 법인세의 100분의 10 특별징수)"
    grade: "★★★"
  net_interest:
    value: "이자를 원천세 뺀 순액으로 적었으면 원천세만큼 수익이 빠졌다. 익금산입(기타사외유출)과 기납부세액 공제는 회계 판단(기본 넣지 않음)"
    basis: "법인세법 제15조 제1항 (순자산을 증가시키는 수익은 익금) · 제64조 제1항 제4호 (원천징수된 세액은 납부할 세액에서 뺌) · 제73조 제1항. 순액 계상을 원천세 익금산입으로 고치는 것은 원문을 적용한 해석"
    grade: "★★☆"
