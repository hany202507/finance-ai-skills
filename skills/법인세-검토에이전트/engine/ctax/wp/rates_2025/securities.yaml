# 12 유가증권 조서. 원문 확인: korean-law MCP get_law_text, 2025-12-31 시점 시행 버전(2026-10-09).
securities:
  valuation_disallowed:
    value: "평가 전 가액"
    basis: "법인세법 제42조 제1항 (자산 · 부채의 장부가액을 증액 · 감액해도 세법상 장부가액은 평가 전 가액. 유가증권은 시행령 제73조 제2호 · 제75조 원가법만)"
    grade: "★★★"
  default_method:
    value: "총평균법"
    basis: "법인세법 시행령 제75조 제1항 · 제2항 (개별법(채권) · 총평균법 · 이동평균법 중 신고, 제74조 제4항 준용으로 무신고면 총평균법). 처분 추인 기본값의 비율 근거"
    grade: "★★★"
  oci_both_sides:
    value: "익금산입(기타) · 익금불산입(유보)"
    basis: "법인세법 제15조 제1항 · 제42조 제1항 (기타포괄손익 증감은 순자산 증감이라 익금산입(기타)하고, 평가라 장부가액 증감분을 익금불산입(유보)한다). 짝 꼴은 신고본 관례"
    grade: "★★☆"
  equity_method:
    value: "익금불산입 · 손금불산입(유보)"
    basis: "법인세법 제42조 제1항 (지분법 평가로 늘거나 준 장부가액은 인정하지 않는다). 지분법 주식 배당금은 법인세법 제15조 제1항 익금"
    grade: "★★☆"
