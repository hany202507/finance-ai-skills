# 2 미지급비용 조서가 쓰는 기준. 원문 확인: korean-law MCP get_law_text · search_rulings(2026-10-09).
# 등급: ★★★ 원문 확인 / ★★☆ 요지만 / ☆ 확인 불가.

accrued_expense:
  fixed_rule:
    value: "손금은 확정된 날이 속하는 사업연도"
    basis: "법인세법 제40조 제1항 (내국법인의 익금과 손금의 귀속사업연도는 그 익금과 손금이 확정된 날이 속하는 사업연도, 법률 제21065호 2025-10-01 시행본)"
    grade: "★★★"
  leave_pay:
    value: "지급 의무가 확정되지 않은 연차수당 계상액은 손금불산입"
    basis: "법인세법 제40조 제1항 적용. 국세청 법인46012-686(1994-03-09) 「유급휴가에 갈음하여 지급하는 연차수당의 손금귀속사업연도」 는 질의만 확인했고 회신 본문은 열지 못했다. 평가세트 신고본 네 곳이 연차 미지급 계상액을 손금불산입(유보)하고 다음 해 전액 추인했다"
    grade: "☆"
