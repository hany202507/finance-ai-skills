  kind: item
- text: (2) 전산기 가동중단에 대한 안전대책이 마련되어 있는가?
  kind: item
- text: (3) Program 및 Data File의 Back-up절차가 마련되어 있는가?
  kind: item
- text: (4) Operating Manual의 작성유지에 대한 책임이 명확히 부여되고 지속적으로 검토되는가?
  kind: item
- text: (5) System개발단계에서의 개발단계별 통제절차가 마련되어 있는가?
