- text: (3) 시스템개발 및 변경을 위한 다음의 문서가 작성되고 유지관리 되고 있는가?
  kind: item
- text: '- 분야별 시스템 설명서와 Flowchart'
  kind: item
- text: '- DFD(Data Flow Diagram)'
  kind: item
