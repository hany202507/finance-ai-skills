- text: 2. 처리통제
  kind: group
- text: (1) 입력된 거래의 처리누락 또는 중복처리에 대한 방지절차가 존재하는가?
  kind: item
- text: (2) 부당한 Data File을 사용하거나 갱신을 방지하기 위한 절차가 존재하는가?
  kind: item
- text: (3) 비논리적, 비합리적인 입력자료에 대한 통제절차가 존재하는가?
  kind: item
- text: (4) 처리과정중 자료의 상실이나 부당변경을 방지하는 절차가 존재하는가?
  kind: item
- text: (5) 모든 보조저장장치(Tape, Disk)에는 Label이 부착되고 File No 및 보존기한이 기록되어 있는가?
  kind: item
- text: 3. 출력통제
  kind: group
- text: (1) 출력된 자료의 정확성을 검증할 수 있는 절차가 존재하는가?
  kind: item
- text: (2) 원시증빙과 출력문서를 대조하는 절차가 존재하는가?
  kind: item
- text: (3) 출력물의 출력시기와 배부 등을 통제하는 절차가 마련되어 있는가?
  kind: item
