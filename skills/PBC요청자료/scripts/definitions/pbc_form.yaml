- text: (4) 시스템 Testing후 경영자와 이용자부서의 최종승인 절차가 있는가?
  kind: item
- text: (5) 기존 File 또는 Database의 전환에 따르는 경우 정확성을 보장하는 통제절차가 있는가?
  kind: item
- text: (6) 시스템 가동 이후 모든 Program의 변경에 대한 검토, 승인, 문서화 절차가 마련되어 있는가?
  kind: item
- text: (7) 시스템 개발에 따른 모든 문서의 정확한 작성, 유지, 개정, 보관을 위한 절차가 마련되어 있는가?
  kind: item
- text: (8) 시스템 Testing을 위한 표준절차가 마련되어 있는가?
  kind: item
- text: 4. 하드웨어와 시스템 소프트웨어 통제
  kind: group
- text: (1) H/W 및 S/W에 대한 운용 및 기능오류 탐지를 위한 통제가 마련되어 있는가?
  kind: item
- text: (2) H/W 및 S/W 오류를 관리하기 위한 오류일지가 작성, 유지되고 있는가?
  kind: item
- text: (3) H/W 및 S/W 운용시 자동적인 LOG File이 작성되고 이를 주기적으로 출력하여 정당한 사용여부를 검토하는가?
  kind: item
- text: (4) System S/W의 변경에 대한 검토, 승인절차가 마련되고 이를 적정히 준수하고 있는가?
  kind: item
- text: 5. 접근통제
  kind: group
- text: (1) System 개발문서에 대한 접근제한 절차가 마련되어 있는가?
  kind: item
- text: (2) Data File 및 Program에 대한 접근 제한 절차가 있는가?
  kind: item
- text: (3) H/W에 대한 접근 제한 절차가 마련되어 있는가?
  kind: item
- text: 6. 자료 및 절차통제
  kind: group
- text: (1) H/W의 물리적 안전대책을 위한 절차가 마련되어 있는가?
  kind: item
- text: '- 물리적 파손에 대한 보험가입여부?'
  kind: item
- text: '- 전산요원에 대한 재정보증'
