# 요청자료(PBC) 양식 (2026-10-13)
#
# 실제 초도감사 요청자료 목록(Drive 샘플문서 「PBC_초도감사_중간감사_요청자료_20260913.xlsx」)의 구조와 항목을 일반화했다.
# 회사 이름 · 연도는 지우고 {fy} {py} {ny}(결산 연도 · 전년 · 다음 해, 네 자리)와 {fy2} {py2} {ny2}(두 자리)로 바꿨다.
# audit/pbcform.py 가 읽어 PBC 조서(1000 감사계약/PBC_요청자료목록.xlsx)의 네 시트를 쓴다.
#
#   cat               구분. 초도감사(1차) · 감사계획 · 중간감사 · 기말감사
#   name · detail     요청자료명 · 요청세부내역(detail 이 비면 name 만)
#   form              요청형태(Excel file · PDF file …)
#   engine            pbc_match.yaml row 번호. 이 줄이 그 자료의 받음 · 빠짐 판정을 따른다(같은 번호 첫 줄이 빠진 자료 문구가 된다)
#   first_year_only   계속감사에서는 뺀다(초도감사에서만 점검하는 결산 인프라 · 통제 설명 자료)
#   half_only         감사건에 반기 기준일(half_year_end)이 있을 때만 낸다. 원 양식은 다음 해 6월에 하는 초도감사 기준이라
#                     다음 해 반기 · 6월 · 2분기 · 6개월을 묻는 줄이 있다. 반기 기준일이 없는 기말감사에서는 빼거나 fy_detail 로 바꾼다(2026-10-18)
#   fy_detail         반기 기준일이 없을 때 쓰는 결산 연도 기준 문구(12월말 · 연간 · 결산일 후 감사보고서일까지)
#   area              4000 영역(accounts.yaml areas). 시산표 · 재무제표에 그 영역 잔액이 당기 · 전기 모두 없으면
#                     pbc_match.yaml no_balance.drop 영역은 줄을 빼고, 나머지는 엔진 판정 칸에 「해당 없음 후보」 를 적는다
#   글자 자리          {fy} {py} {ny} {fy2} {py2} {ny2}, {fs_k}(사업연도 시작일 「2024년 1월 1일」), {fem}(결산 월),
#                     {after1}(결산일 다음 달 「2025년 1월」). 반기 기준일이 있으면 {ny} {ny2} 는 그 기준일의 연도다
#   it_questionnaire  3. 전산환경 질의서 문항(major=Ⅰ · Ⅱ, group=번호 제목, item=문항)
#
# 문구 규칙: 줄표를 쓰지 않는다. 물음표로 끝내지 않는다는 규칙은 이 양식에 적용하지 않는다(회사에 보내는 질의서 원문이다).
version: 1
sheet_names:
  first_year: 1. 초도감사및중간감사
  continuing: 1. 감사계획및중간감사
