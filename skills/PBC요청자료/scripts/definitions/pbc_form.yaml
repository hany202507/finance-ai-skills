- text: Ⅱ. 응용통제
  kind: major
- text: 1. 입력통제
  kind: group
- text: (1) 입력자료의 타당성 통제
  kind: item
- text: '- 입력자료는 승인과정이 존재하는가?'
  kind: item
- text: '- 입력된 자료의 완전성을 확인할 수 있는 통제장치가 있는가?'
  kind: item
- text: '- 입력자료 접수과정에서 누락을 확인할 수 있는 절차가 있는가?'
  kind: item
- text: (2) 사용되는 중요코드를 검증하는 절차
  kind: item
- text: '- 중요코드의 입력오류를 Check할 수 있는 기능이 있는가?'
  kind: item
- text: (3) 자료전환과정에서의 통제절차가 존재하는가?
  kind: item
- text: (4) 자료이동과정(처리단계간 또는 부서간)에 관한 통제절차가 존재하는가?
  kind: item
- text: (5) 입력오류의 수정절차에 대한 통제절차가 있는가?
  kind: item
