# 요청자료(PBC) 항목과 이슈 대응 조서가 요구하는 자료를 받은자료 종류에 대는 표 (R1 T3, 2026-10-05)
#
# 지휘(audit/director.py)가 읽는다. 받은자료 종류 이름은 folder_standard.yaml 의 kinds 와 영구조서 items 이름 그대로 쓴다.
# 표에 없는 종류 이름을 쓰면 지휘가 DefinitionError 로 멈춘다.
#
# 자료 하나를 판정하는 형식(요청 항목과 이슈 필요 자료가 같이 쓴다)
#   kinds:     받은자료 종류 목록. 비우면 종류를 가리지 않는다
#   keywords:  하나라도 파일 경로 · 종류 · 사실 문장에 들어 있어야 한다. 비우면 보지 않는다
#   need:      any(기본) 종류 하나만 있으면 받음 / all 종류마다 하나씩 있어야 받음
#   any_of:    위 형식 여럿 가운데 하나만 맞으면 받음
#   read_as:   엔진 판독 사실이 이 글로 시작하는 파일만 센다(재무제표 파일 하나로 시산표 요청을 받음으로 세지 않게, 2026-10-18).
#              엔진 사실이 없는 파일(PDF · 판독 전)은 unread_name 낱말이 파일 이름에 있을 때만 센다
#   period:    받은 자료가 덮어야 하는 기간(2026-10-18). 글자 하나면 모든 종류에, {종류: 기간} 이면 그 종류에만 건다
#                annual   사업연도 처음부터 결산일까지(월 · 분기 자료). 마지막 자료가 9월분이면 「10~12월분」 이 빠진 것이다
#                fy_end   결산일 기준(잔액 · 명부). 기준일이 결산일 전이면 「12월말 기준」 이 빠진 것이다
#                events   열린 날이 기간인 자료(의사록). 사업연도 마지막 3개월 안에 하나도 없으면 「10~12월분」 처럼 묻는다
#                after_end 결산일 뒤까지(결산일 후 분개장). 결산일 뒤를 덮는 자료가 없으면 「결산일 후분」 이 빠진 것이다
#   period_words: 기간을 볼 파일을 이 낱말이 파일 이름 · 사실에 있는 것으로 좁힌다(그런 파일이 하나도 없으면 전부 본다)
#              덮는 기간은 문서목록 period(엔진 · AI 판독), 그다음 파일 이름의 연월(2410 · 2024.3Q · 9월귀속 · 240930)로 정한다.
#              기간을 알 수 없는 파일이 하나라도 있으면 받음으로 본다(엔진이 추측하지 않는다)
#   dated_in_year: 날짜(문서목록 period 앞쪽 · 파일 이름 날짜)가 사업연도 안인 파일만 센다. 날짜를 모르면 세지 않는다
#   issue_parties: 이슈 대응 자료에서 이슈를 낳은 거래의 상대방 이름(분석.json)이 있으면 그 이름이 든 파일만 센다
#   area:      4000 영역(accounts.yaml areas). 시산표 · 재무제표에 그 영역 계정 잔액이 당기 · 전기 모두 0 이면 빠진 자료로 세지 않는다.
#              아래 no_balance 의 drop 영역은 요청 줄도 내지 않고, 나머지 영역은 요청 줄에 「해당 없음 후보」 로 적는다
#
# 받았다고 보는 파일: 받은자료와 영구조서 가운데 종류가 정해진 것(director_rules.yaml 의 counted_bases).
# PBC 시트의 '받은 날' 칸은 보지 않는다. 파일이 폴더에 있어야 받은 것이다.

# row 는 PBC 의 # 번호(키 이름 no 는 YAML 이 거짓으로 읽어 쓰지 않는다). 1000 감사계약/PBC_*.xlsx 의 '요청 자료' 글에 match 낱말이 모두 들어 있으면 그 항목이다.
# 위에서부터 보고 처음 맞는 것을 쓴다. PBC 파일이 없으면 이 표의 item 18건을 요청 목록으로 쓴다.
# from_stage: 그 단계부터 빠진 자료로 센다(서면진술서는 보고 단계에 받는다).
pbc:
  - row: 1
    match: [재무제표]
    item: 회사제시 재무제표(감사 전, 증선위 제출본 포함)
    workpaper: 3650A · 8100B
    kinds: [회사제시 재무제표·시산표]
  - row: 2
    match: [시산표]
    item: 합계잔액시산표(전기·당기)
    workpaper: 8100B
    kinds: [회사제시 재무제표·시산표]
    # 재무제표와 시산표가 같은 종류라 재무제표 파일만 있어도 받음이 됐다(2026-10-17 세트 결함 4). 시산표로 읽힌 파일만 센다
    read_as: [시산표 합계]
    unread_name: [시산표, 합계잔액]
  - row: 3
    match: [분개장]
    item: 분개장 전체(당기, 결산일 후 2개월)
    workpaper: 2120A · 3600-JET
    kinds: [분개장]
    period: [annual, after_end]
  - row: 4
    match: [명세서]
    item: 계정별 명세서(채권·채무·재고·유형자산·차입금)
    workpaper: "4000"
    kinds: [계정명세서]
    period: fy_end
  - row: 5
    match: [부가가치세]
    item: 부가가치세 신고서(1기·2기)
    workpaper: 2120A
    kinds: [부가세 신고서]
    period: annual
  - row: 6
    match: [원천징수]
    item: 원천징수이행상황신고서(1~12월)
    workpaper: 2120A · 4000EE
    kinds: [원천세 신고서]
    period: annual
  - row: 7
    match: [법인세]
    item: 전기 법인세 세무조정계산서
    workpaper: 2120A · 4000T
    kinds: [법인세 신고서]
  - row: 8
    match: [의사록]
    item: 이사회·주주총회 의사록(당기, 결산일 후 감사보고서일까지)
    workpaper: 2100-주요거래
    kinds: [이사회의사록, 주주총회의사록]
    need: all
    # 의사록은 열린 날이 기간이다. 사업연도 마지막 3개월 안에 의사록이 하나도 없으면 마지막 의사록 다음 달부터 결산 월까지를 묻는다
    period: events
  - row: 9
    match: [정관]
    item: 정관, 주주명부, 특수관계자 목록
    workpaper: "3500"
    kinds: [정관·법인등기부·사업자등록증, 주주명부·임원명부, 특수관계자목록]
    need: all
    period: {주주명부·임원명부: fy_end}
  - row: 10
    match: [금융기관]
    item: 금융기관 거래 목록(기중 해지 포함)과 잔액증명
    workpaper: 4000A · 조회서
    kinds: [금융기관 잔액증명·거래내역, 은행조회 회신]
    period: fy_end
    # 같은 종류의 12월 거래내역 · 잔액 화면 캡처가 결산일 잔액증명을 대신하지 않게 기준일은 증명서 · 조회 회신에서만 본다
    period_words: [잔액증명, 잔고증명, 예금잔액, 회신, 조회서]
  - row: 11
    match: [약정서]
    item: 차입·담보·지급보증 약정서
    workpaper: 4000BBDD
    kinds: [차입·담보·보증 약정]
    area: BBDD
  - row: 12
    match: [연령분석표]
    item: 주요 거래처 계약서, 연령분석표
    workpaper: 4000C
    kinds: [매출·매입 계약, 연령분석표]
    need: all
    period: {연령분석표: fy_end}
    area: C
  - row: 13
    match: [재고, 실사]
    item: 기말 재고 실사표와 실사 계획
    workpaper: 4000E · E100
    kinds: [재고 명세·실사표]
    keywords: [실사]
    area: E
  - row: 14
    match: [고정자산]
    item: 고정자산 대장, 당기 취득·처분 증빙
    workpaper: 4000G
    kinds: [고정자산대장]
    area: G
  - row: 15
    match: [개발, 프로젝트]
    item: 개발 프로젝트 목록과 자산화 근거
    workpaper: 4000H
    # 분개장 · 시산표 · 의사록에도 '개발' 이 나오므로 종류를 좁힌다
    kinds: [계정명세서, 고정자산대장, 기타 계약, 회사 답변, 기타]
    keywords: [프로젝트]
    area: H
  - row: 16
    match: [급여대장]
    item: 급여대장(월별), 퇴직연금 납입 내역
    workpaper: 4000EE
    # 퇴직연금 납입 내역은 받은자료 종류가 따로 없다. 급여대장이 오면 받음으로 본다
    kinds: [급여대장]
    period: annual
  - row: 17
    match: [소송]
    item: 소송 현황과 법률 자문 내역(변호사 조회 대상)
    workpaper: 4000CL · 조회서
    any_of:
      - {kinds: [변호사 조회 회신]}
      - {kinds: [회사 답변, 기타 계약, 기타], keywords: [소송, 법률 자문, 법률자문]}
  - row: 18
    match: [서면진술]
    item: 경영진 서면진술서 초안 확인
    workpaper: "8300"
    from_stage: 보고
    kinds: [회사 답변, 기타]
    keywords: [서면진술, 진술서]

# 시산표 · 재무제표에 잔액이 당기 · 전기 모두 0 인 영역(2026-10-18 실제 회사 자료: 재고자산이 없는 회사에 재고 실사표를 요청했다)
#   drop: 요청 줄(PBC 양식 · 빠진 자료)을 내지 않는다. 나머지 영역은 요청 줄에 「해당 없음 후보」 를 적고 빠진 자료로 세지 않는다
#   시산표가 없거나 읽지 못하면 영역 잔액을 모르므로 아무것도 빼지 않는다
no_balance:
  drop: [E]

# 열린 이슈의 대응 조서(이슈.json 의 response_wp)가 요구하는 자료.
# pbc: 같은 자료를 묻는 요청 항목 번호. 둘 다 빠졌으면 이슈 쪽 한 줄로 합친다(이슈 번호가 붙는다).
# item 은 회사에 가는 메일에 그대로 들어간다. 특정 회사의 거래처 · 은행 이름 · 금액을 적지 않는다(2026-10-18: 합성 회사 거래처 · 은행 이름이
# 실제 회사 메일 초안에 들어갔다). {account} 는 이슈의 계정 이름으로 채운다(이슈에 계정이 없으면 대응 조서 영역 이름).
# 정의 파일에 합성 회사 이름이 들어오면 tests/test_definitions_generic.py 가 실패한다.
issue_needs:
  4000C:
    - item: "{account} 관련 감사인 지정 거래의 계약서·출고(인도) 증빙{party}"
      # 종류를 좁힌다. 분개장 · 연령분석표의 엔진 사실에도 그 거래가 나오지만 그건 이슈를 낳은 자료지 증빙이 아니다(2026-10-05 R1 끝 기준 시험).
      # 거래처 이름 낱말로 가르던 것을 뺐으므로 일반 매출 계약서(PBC 12)로는 받음이 되지 않게 표본 증빙만 센다(2026-10-18)
      kinds: [표본 증빙]
      issue_parties: true
  4000BBDD:
    - item: "{account} 관련 당기 차입 약정서·입금 내역(감사인 지정 건{party})"
      # 이사회 의사록에도 차입 결의가 나오므로 종류를 약정서로 좁힌다. PBC 11(약정서)과 같은 자료라 둘 다 빠졌으면 이 줄로 합친다.
      # 은행 이름 낱말로 가르던 것을 뺐다. 대신 날짜가 사업연도 안인 약정만 센다(예전 약정이 이슈 증빙이 되지 않게), 이슈 거래의
      # 상대방(분석.json)이 있으면 그 이름이 든 약정만 센다
      kinds: [차입·담보·보증 약정]
      dated_in_year: true
      issue_parties: true
      pbc: [11]
  4000E:
    - item: 기말 재고 실사표와 실사 계획
      kinds: [재고 명세·실사표]
      keywords: [실사]
      pbc: [13]
  4000H:
    - item: 개발 프로젝트별 단계 구분 자료
      kinds: [계정명세서, 고정자산대장, 기타 계약, 회사 답변, 기타]
      keywords: [프로젝트, 단계 구분]
      pbc: [15]
  4000EE:
    - item: 월별 급여대장과 원천세 신고서(1~12월)
      kinds: [급여대장, 원천세 신고서]
      need: all
      period: annual
      pbc: [6, 16]
  2100-주요거래:
    - item: 이사회·주주총회 의사록(당기)
      kinds: [이사회의사록, 주주총회의사록]
      need: all
      period: events
      pbc: [8]
