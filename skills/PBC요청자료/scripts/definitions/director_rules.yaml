# 지휘 규칙: 단계와 다음 할 일 (R1 T3, 2026-10-05)
#
# audit/director.py 가 읽는다. 결정적이다. 같은 _색인 이면 같은 결과가 나온다.
# 설계: docs/plans/2026-10-05-감사-R1-맥락색인-지휘.md T3, docs/specs/2026-10-03-감사프로그램-독립점검.md §5.2
#
# 문구 규칙: 회계사에게 부탁하는 줄은 '주십시오' 로 끝낸다. 줄표와 물음표로 끝나는 문장을 쓰지 않는다.
# 문구 안 {이름} 은 지휘가 채운다: {count} {items} {no} {name} {skill} {needs} {status} {basis} {breakdown} {examples}

version: 1

max_actions: 8          # 다음 할 일은 우선순위대로 이만큼만 쓴다

# 받은 것으로 세는 파일: 확인된 것 또는 판별 근거가 아래인 것. '종류 판독 필요' 처럼 종류가 비어 있는 파일은
# 어떤 종류 이름과도 맞지 않으므로 세지 않는다. AI 판별은 확인 전이라도 파일은 들어온 것이므로 센다(확인은 규칙 확인-판독 몫)
counted_bases: [폴더, 파일명, 엔진, AI]

done_statuses: [검사 통과, 검토 끝]

# 단계: 위에서부터 보고 leave_when 이 채워지지 않은 첫 단계에 머문다. 모두 채워지면 종결이다.
# leave_when.workpapers: 조서목록에 있는 것은 모두 done_statuses 여야 한다(조서목록에 없는 조건부 조서는 건너뛴다)
# leave_when.folders: 그 폴더의 조서목록 조서와 열린 이슈의 대응 조서(4000 영역)가 모두 done_statuses 여야 한다
stages:
  - name: 준비
    meaning: 감사계약 구간(1000) 조서가 모두 검사 통과 이상이 될 때까지
    leave_when: {workpapers: [PBC, "1100", "1200", "1300"]}
  - name: 계획
    meaning: 위험평가 핵심 조서(기업이해 · 주요회계처리 · 감사계획 · 분석적절차 · 위험 · 중요성)가 끝날 때까지
    leave_when: {workpapers: ["2100", 2100-주요거래, "2110", 2120A, "2301", "2302", 2700A]}
  - name: 실행
    meaning: 위험대응(3000)과 계정별(4000) 조서가 모두 끝날 때까지
    leave_when: {folders: ["3000 위험대응", "4000 계정별"]}
  - name: 보고
    meaning: 감사완결(8000) 가운데 감사보고서까지의 조서가 끝날 때까지. 8700 감사종료 · DART 는 종결에서 한다
    leave_when: {workpapers: [8100A, 8100B, 8110A, "8200", "8300", "8400", "8500", "8550", "8600", "8800", "8810", "8820"]}
  - name: 종결
    meaning: 감사보고서 뒤 감사종료 · 보관 · 공시 제출

# 조서 초안을 만드는 스킬과, 그 스킬을 돌리기 전에 있어야 하는 받은자료 종류.
