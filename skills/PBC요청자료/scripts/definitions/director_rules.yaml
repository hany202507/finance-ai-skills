# 다음 할 일 규칙. priority 가 작은 것부터 쓴다. 같은 규칙 안에서는 조서 폴더 순서(1000 → 8000)를 따른다
# 조서마다 한 줄인 규칙(다시확인 · 스킬실행 · 검토요청 · 작성)은 규칙마다 이만큼만 보이고 나머지는 마지막 줄에 묶는다.
# 한 규칙이 목록을 다 차지해 검토 요청 · 작성 줄이 안 보이던 것을 R1 끝 기준 시험에서 고쳤다(2026-10-05)
max_per_rule: 3

rules:
  - id: 확인-판독
    priority: 10
    when: 받은자료 가운데 확인 안 된 파일(AI 판독 또는 종류 판독 필요)이 있다. 한 줄로 묶는다
    who: 회계사
    title: "받은자료 {count}건의 종류와 판독 내용을 확인해 주십시오"
    detail: "{breakdown}. 확인 전에는 조서 결론에 쓰지 않습니다. {examples}"
  - id: 확인-분석값
    priority: 15
    # 2026-10-18. 분석.json ocr_checks(스캔본을 OCR(kordoc)로 읽어 확인 전인 값)와 requests 가운데 회계사 몫(to 회계사).
    # 회사에 다시 묻지 않는다. 회사에 묻는 분석 요청은 빠진 자료(요청-빠진자료)로 간다
    when: 분석.json 에 ocr_checks 나 회계사 몫 요청이 있다. 한 줄로 묶는다
    who: 회계사
    title: "분석 값 {count}건을 확인해 주십시오(OCR 값 · 엔진이 읽지 못한 자료)"
    detail: "{items}. OCR 값은 _색인/ocr 의 쪽 그림과 대조해 맞는 값만 조서에 적어 주십시오. 엔진은 확인 전 OCR 값으로 대사 · 이슈를 만들지 않습니다"
  - id: 요청-빠진자료
    priority: 20
    when: 빠진 자료(문서목록.missing)가 있다. 아직 요청하지 않은 것이 있으면 요청, 모두 요청했으면 다시 요청
    who: 회사
    skill: 감사-요청메일
    title: "빠진 자료 {count}건 요청 메일 초안 만들기"
    title_again: "요청한 자료 {count}건이 아직 오지 않았습니다. 다시 요청 메일 초안 만들기"
    # 종결 단계에서는 요청이 아니라 품질관리 확인이다(2026-10-05 통합)
    title_closed: "빠진 자료 {count}건이 남은 채 종결했습니다. 대체 절차 근거가 감사파일에 있는지 확인해 주십시오"
    detail: "{items}"
  - id: 다시확인
    priority: 30
    when: 조서가 작성중이고 다시 확인 표시(needs_recheck)가 있다. 조서마다 한 줄
    who: 회계사
    title: "{no} {name} 조서를 다시 확인해 주십시오"
    detail: "{basis}. 바뀐 숫자가 결론에 닿는지 보고 검사를 다시 돌려 주십시오"
  - id: 기본값확인
    priority: 33
    # 2026-10-07. 분석이 2700A · 2120A 빈 칸을 방법론 기본값(definitions/methodology.yaml)으로 채워 돌았다(분석.json default_inputs)
    when: 분석.json 에 default_inputs 가 있다. 한 줄로 묶는다
    who: 회계사
    title: "2700A 중요성 · 2120A 유의성 기준이 방법론 기본값으로 돌았습니다. 확인해 주십시오"
    detail: "{items}. 그대로 쓰려면 2700A 근거 칸에 그 뜻을 적고, 바꾸려면 기준 · 백분율 · 비율 칸이나 금액 칸을 채운 뒤 analyze 를 다시 돌려 주십시오"
  - id: 수정반영
    priority: 34
    # 2026-10-12. audit/apply.py pending 이 정한다. 8100A · 8100B 의 회계사 기입과 회사제시 판을 엔진 문서가 담은 것과 견준다
    when: 8100A 처리 「수정」 분개, 8100B 수정 제안 반영 여부, 회사제시 판 가운데 엔진 문서에 아직 반영되지 않은 것이 있다. 한 줄
    who: 스킬
    skill: 감사-수정반영
    title: "수정 반영하기 (감사-수정반영)"
    detail: "{items}. python -m audit apply 가 판을 남기고 보고 문서와 계정별 조서를 다시 만듭니다. --undo 로 되돌릴 수 있습니다"
  - id: 보고준비
    priority: 35
    # 2026-10-06. _색인/보고.json 의 dart_ready(report make · check · dart 가 쓴다)로 경우마다 한 줄.
    # 남은 기입 칸(marks)은 작성 규칙이 조서마다 알린다. 다시 만들기는 지금 워드로 준비가 끝났는데(ready) HTML 에 상자가 남았을 때만
    when: dart_ready 가 있고 감사의견을 고르지 않았거나 기입이 틀렸거나, 공시 점검이 끝나지 않은 주석이 있거나, 준비가 끝났는데 DART 초안에 검토 전 상자가 남았다
    who: 회계사
    title_opinion: "8600 감사의견 종류를 골라 주십시오"
    title_opinion_fix: "8600 감사의견 기입을 고쳐 주십시오"
    title_notes: "8400 주석 {items} 의 공시 점검 칸을 채워 주십시오"
    title_rebuild: "DART 제출 파일을 다시 만들어 주십시오(python -m audit report dart)"
    detail_opinion: "고른 종류의 감사기준서 700 · 705 문형으로 8820 과 DART 초안이 채워집니다. 엔진은 의견을 정하지 않습니다. {items}"
    detail_notes: "예는 DART 에 넣고, 해당 없음은 빼고 번호를 다시 매깁니다. 아니오나 빈칸은 검토 전으로 봅니다"
    detail_rebuild: "의견 선택과 주석 검토, 기입 칸이 끝났습니다. 지금 DART 초안에는 검토 전 표시가 남아 있습니다"
  - id: 스킬실행
    priority: 40
    when: 조서가 없음이고 skills 의 needs 가 모두 들어왔다. 열린 이슈의 대응 조서(4000 영역)도 본다. 조서마다 한 줄
    who: 스킬
    title: "{no} {name} 초안 만들기 ({skill})"
    detail: "{needs}. {no} {name} 초안을 만듭니다"
  # R7(2026-10-06) 전기 자료. 시작 자료가 쓴 _색인/시작자료.json prior_source 를 본다. 판단은 회계사 몫이다
  - id: 전기이어받기
    priority: 45
    when: prior_source.carry 가 있고 2100 「전기에서 이어진 사항」의 당기 이슈 여부 칸이 빈 것이 있다(2100 이 없으면 전부)
    who: 회계사
    title: "전기에서 이어진 사항 {count}건을 2100 에서 판단해 주십시오"
    detail: "{items}. 당기 이슈로 볼지(예 · 아니오)와 근거를 적어 주십시오. 엔진은 정하지 않습니다"
  - id: 초도기초잔액
    priority: 46
    when: 초도감사이고 전기조서가 없거나 전기 재무제표가 감사받지 않았는데 3800 「기초잔액 대체절차」 칸이 비었다
    who: 회계사
    title: "3800 대체절차를 적어 주십시오"
    detail: "{why}. 기초잔액 증거(감사기준서 510 문단 6(c))를 3800 「기초잔액 대체절차」 칸에 적어 주십시오{make}"
  - id: 검토요청
    priority: 50
    when: 조서가 검사 통과이고 아직 검토 끝이 아니다. 조서마다 한 줄
    who: 감사반
    title: "{no} {name} 검토 요청"
    detail: "검사를 통과했습니다. 폴더를 공유받은 동료가 검토의견_{no}.xlsx 나 댓글로 남기면 색인이 읽습니다"
  - id: 작성
    priority: 60
