# 수정 반영과 판 관리 (2026-10-12)
#
# audit/apply.py 가 읽는다. 명령은 python -m audit apply <감사 폴더>.
# 설계: docs/plans/2026-10-12-감사-다음작업-수정반영-전기조서-배정.md 작업 1, docs/specs/2026-10-12-감사-수정반영-전기조서-배정-결과.md
#
# 판은 감사 폴더 안 <dir>/<번호 3자리>_<시각>/ 에 둔다. 받은자료는 넣지 않는다.
# 판은 작업 이력이다. 최종 감사파일(_보관)에는 넣지 않는다(close.yaml exclude_top).

version: 1

dir: "_판"
hash_list: 해시목록.json
index_file: 판.json              # _색인 안. 판 목록과 지금 판
result_file: 수정반영.json       # _색인 안. 마지막 반영(또는 되돌리기)에서 바뀐 숫자

# 판에 통째로 담는 폴더. 엔진이 다시 쓰는 문서와 그 문서의 회계사 기입(8100A · 8100B 포함)이 여기 있다
folders: ["3000 위험대응", "4000 계정별", "8000 감사완결"]

# 되돌릴 때 판에서 되살리는 색인 파일. WTB양식.json 은 WTB 양식(8000 감사완결)이 담은 수정분개 기록이라 파일과 함께 되살린다. 나머지 색인(문서목록 · 이슈 · 분석 · 기록)은 판에 사본만 두고 되살리지 않는다.
# 문서목록을 되살리면 판 뒤에 넣은 받은자료 판독이 사라지고, 감사건을 되살리면 기록(log)이 사라지기 때문이다
index_restore: [보고.json, 조회.json, WTB양식.json]

# 회사제시 판이 바뀌었을 때만 다시 만드는 실행 단계 조서(수정분개와 상관없는 조서). 4000 영역 조서는 늘 다시 만든다
version_only: [3650A, "3320", 3600-JET, "3800"]
