# 3700 계속기업 「엔진이 아는 사실」(2026-10-18). 엔진은 시산표 · 전기 재무제표 · 계정명세서 차입금 표에서 결정적으로 아는
# 재무적 사항만 사실로 싣고, 감사기준서 570 문단 A3 의 예시(한공회 3700 점검 항목 1.(1))에 해당할 수 있는 줄에 「해당 후보」 를 붙인다.
# 점검 항목의 예 · 아니오 칸과 계속기업 판단은 회계사가 한다. 엔진은 기준(얼마면 유의적인가)을 정하지 않는다.
#   links    사실 종류 → 점검 항목 문항에 들어 있는 낱말(그 낱말이 든 줄에 표시)
#   plan_keys  다음 해 사업계획 · 추정 자료로 보는 받은자료 파일 이름 낱말(파일 이름으로만 찾는다. 내용 확인은 회계사)
#   유동 · 비유동 구분은 더존 계정코드 범위(figures.FS_RANGES: 유동자산 101~175, 유동부채 251~290)를 쓴다
going_concern:
  links:
    capital_deficit: ["순부채 또는 순유동부채"]
    net_current_liabilities: ["순부채 또는 순유동부채"]
    operating_loss: ["유의적 영업손실"]
    net_loss: ["유의적 영업손실"]
    borrowings_due: ["차입금의 만기도래"]
    plan: ["경영자의 향후 계획", "현금흐름을 예측"]
    plan_actual: ["경영자의 향후 계획", "현금흐름을 예측"]      # 사업계획 ↔ 실적(같은 기간 미달이면 후보, 2026-10-20 audit/plans.py)
  plan_keys: [사업계획, 경영계획, 추정재무, 추정손익, 예산, 자금계획, 자금수지, 현금흐름예측, 현금흐름 예측, projection, forecast, budget]

# 1300 독립성: 감사반인 감사인은 소속 공인회계사 중 1명 이상이 공인회계사법 제21조 제1항 각 호의 관계에 있으면
# 그 회사의 감사인이 될 수 없다(외감법 제9조 제3항 ★★★). 그래서 사람마다 아래 항목을 확인한다.
# 문장은 조문을 요약한 것이고 근거 조문을 함께 적는다. 답은 "예"(해당하지 않음을 확인) · "아니오"(해당함) · "해당 없음".
independence:
  people_file: "1000 감사계약/감사반인원.xlsx"     # 열: 성명 · 역할 · 등록번호(선택)
  roles: [업무수행이사, 참여공인회계사, 품질관리검토자, 감사보조자]
  items:
    - {law: "공인회계사법 제21조 제1항 제1호", text: "본인 또는 배우자가 회사의 임원이나 그에 준하는 직위(재무 사무의 책임 있는 담당자 포함)에 있지 않고, 과거 1년 이내에도 없었다"}
    - {law: "공인회계사법 제21조 제1항 제2호", text: "본인이 회사의 직원이 아니고 과거 1년 이내에도 아니었으며, 배우자가 재무 사무를 하는 직원이 아니고 과거 1년 이내에도 아니었다"}
    - {law: "공인회계사법 시행령 제14조 제1항 제1호", text: "본인 또는 배우자가 회사의 주식 또는 출자지분을 소유하고 있지 않다"}
    - {law: "공인회계사법 시행령 제14조 제1항 제2호", text: "본인 또는 배우자가 회사와 채권 또는 채무 관계에 있지 않다(같은 호 단서의 제외 항목은 근거 칸에 적는다)"}
    - {law: "공인회계사법 시행령 제14조 제1항 제3호", text: "회사로부터 무상 또는 현저히 낮은 대가로 사무소나 영업용 차량을 제공받고 있지 않다"}
    - {law: "공인회계사법 시행령 제14조 제1항 제4호", text: "회사로부터 공인회계사 업무 외의 업무로 계속적인 보수나 그 밖의 경제상 특별한 이익을 받고 있지 않다"}
    - {law: "공인회계사법 시행령 제14조 제1항 제5호", text: "회사로부터 직무 대가로 주식 · 신주인수권부사채 · 전환사채 · 주식매수선택권을 받았거나 받기로 하지 않았다"}
    - {law: "공인회계사법 제21조 제2항", text: "감사 계약 기간 중 회사에 같은 항 각 호의 업무(회계기록과 재무제표 작성, 내부감사 대행, 재무정보체제 구축 · 운영 등)를 하지 않았다"}

# 검토의견 양식: 감사반 동료가 폴더를 공유받아 남긴다(folder_standard.yaml naming.review)
review:
  file: "검토의견_{no}.xlsx"           # 조서와 같은 폴더에 둔다
  sheet: 검토의견
  done_answer: 예                      # 검토 끝 여부 칸이 이 값이어야 검토 끝
  opinion_rows: 30                     # 양식에 미리 그려 두는 의견 줄 수

# 8700 감사종료 · 보관본
close:
  assembly_days: 60                    # 최종 감사파일 취합: 감사보고서일로부터 일반적으로 60일 이내(한공회 04 감사조서철 작성 및 보존, ISA 230 A21)
  retention_years: 8                   # 감사조서는 감사종료 시점부터 8년간 보존(외감법 제19조 제2항 ★★★)
  retention_from: 감사종료일            # 8700 기입란. 비어 있으면 감사보고서일을 감사종료일로 본다(8700 Part A 11.⑸ "감사보고서일자는 사실상 감사가 종료된 날")
  archive_dir: "_보관"
  hash_list: 해시목록.json
  exclude_top: ["_보관", "_판"]        # 보관본에 넣지 않는 맨 위 폴더. _판 은 수정 반영 앞뒤의 작업 이력이다(대체된 초안, 감사기준서 230 A4)
  # 보관 조건: 조서목록의 조서가 모두 검토 끝이어야 한다. 아니면 --force 와 사유가 있어야 하고 사유를 보관.json 에 남긴다
  required_status: 검토 끝
  law_note: "감사조서를 위조 · 변조 · 훼손 · 파기해서는 안 된다(외감법 제19조 제3항 ★★★). 어기면 5년 이하 징역 또는 5천만원 이하 벌금(제41조 제2호 ★★★)"
