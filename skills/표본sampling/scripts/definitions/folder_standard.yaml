# 감사 폴더 표준 (R0, 2026-10-05 · 2판: 한공회 조서철 서식 01~04 대조)
#
# 정본은 회계사 Drive 의 감사 폴더다. 에이전트는 Drive 데스크톱 동기화 폴더를 로컬 파일로 읽고 쓴다.
# _색인 은 에이전트가 폴더를 읽어 다시 만드는 사본이고 사람이 고치지 않는다. _보관 은 8700 감사종료 때 고정한다.
# 설계 문서 §3, 설계 문서
#
# 위치: <회계사 Drive>/감사/<회사>/
#   영구조서/              회사가 바뀌지 않는 한 해마다 이어 쓰는 서류(한공회 영구조서목록 110~520)
#   <연도> 기말감사/       당기조서(한공회 일반조서목록 1000~8000) + 받은자료 + _색인 + _보관
# 회사 목록은 감사/ 아래 폴더 목록이다. 별도 등록부를 두지 않는다.
#
# 근거(한공회 감사조서서식 2026, 일반기업): 01 조서파일(영구조서·당기조서 구분, 조서목록), 02 영구조서목록,
# 03 일반조서목록(1000 감사계약 · 2000 위험평가 · 3000 위험에 대한 대응 · 4000 계정별 실증절차 · 7000 그룹감사 · 8000 감사완결),
# 04 감사조서철 작성 및 보존(단일 감사파일 취합, 최종 감사파일 취합은 일반적으로 감사보고서일로부터 60일 이내,
# 외감 대상 감사조서는 감사종료 시점부터 8년 보존).

version: 2

engagement_folder: "{연도} 기말감사"

permanent:
  path: "../영구조서"
  purpose: 회사 단위로 해마다 이어 쓰는 서류. 감사 건마다 확인하고 갱신연도를 적는다(02 영구조서목록)
  items:
    "110": 회사연혁
    "120": 정관·법인등기부·사업자등록증
    "130": 조직도
    "140": 주주명부·임원명부
    "150": 특수관계자목록
    "160": 주요제품·설비목록
    "170": 부동산등기부목록
    "175": 토지·건축물관리대장목록
    "180": 주요거래은행
    "190": 주요거래처목록
    "210": 회사규정요약
    "310": 주주총회의사록
    "320": 이사회의사록요약
    "410": 인허가서
    "420": 임대차계약서
    "430": 리스계약서
    "440": 각종계약서
    "450": 각종협약서

folders:
  - path: "00 받은자료"
    role: received
    purpose: 이번 감사에서 받은 원본. 에이전트는 읽기만 한다. 회계사가 넣거나 메일 회신 첨부를 에이전트가 옮긴다. 장기 서류는 확인 뒤 영구조서에도 둔다
    children:
      - {path: 회사제시, versioned: true, kinds: [{name: 회사제시 재무제표·시산표, keys: [재무제표, 시산표]}]}
      - {path: 분개장, kinds: [{name: 분개장, keys: [분개장, 전표, 원장]}]}
      - path: 명세서
        kinds:
          - {name: 진행률 명세, keys: [진행률, 진행기준, 공사진행]}      # 계약별 진행률(4000P 진행기준 매출, 2026-10-16). 「명세」 보다 먼저 본다
          - {name: 외화자산·부채 명세, keys: [외화]}               # 통화 · 외화금액 · 적용환율 · 원화금액(X-fx-translation, 2026-10-20). 「명세」 보다 먼저 본다
          - {name: 대손충당금 연령표, keys: [대손충당금]}         # 회사가 만든 거래처 · 연령 구간 · 잔액 · 설정률 · 충당금 표(4000C IPE, 2026-10-26). 「명세」 · 「연령」 보다 먼저 본다
          - {name: 계정명세서, keys: [명세]}
          - {name: 연령분석표, keys: [연령]}
          - {name: 급여대장, keys: [급여]}
          - {name: 고정자산대장, keys: [고정자산, 유형자산]}
          - {name: 재고 명세·실사표, keys: [재고, 실사]}
      - path: 세무신고
        kinds:
          - {name: 부가세 신고서, keys: [부가세, 부가가치세]}
          - {name: 원천세 신고서, keys: [원천]}
          - {name: 법인세 신고서, keys: [법인세, 세무조정]}
      - path: 의사록
        kinds:
          - {name: 이사회의사록, keys: [이사회]}
          - {name: 주주총회의사록, keys: [주주총회, 주총]}
      - path: 계약서
        kinds:
          - {name: 차입·담보·보증 약정, keys: [차입, 여신, 대출, 담보, 보증]}
          - {name: 임대차·리스 계약, keys: [임대차, 리스]}
          - {name: 매출·매입 계약, keys: [매출, 판매, 공급, 매입, 구매]}
          - {name: 기타 계약, keys: [계약]}
      - {path: 잔액증명, kinds: [{name: 금융기관 잔액증명·거래내역, keys: [잔액, 거래내역, 통장]}]}
      - path: 조회회신
        kinds:
          - {name: 은행조회 회신, keys: [은행]}
          - {name: 채권·채무 조회 회신, keys: [채권, 채무, 거래처]}
          - {name: 변호사 조회 회신, keys: [변호사, 법률, 소송]}
      - {path: 증빙, kinds: [{name: 표본 증빙, keys: [증빙, 세금계산서, 출고, 입금, 지출]}]}
      - {path: 회사답변, kinds: [{name: 회사 답변, keys: [답변, 회신, 설명]}]}
      - path: 전기
        kinds:
          - {name: 전기 감사보고서, keys: [감사보고서]}
          - {name: 전기조서, keys: [조서]}
          - {name: 전기 시산표, keys: [시산표, 합계잔액]}      # 회사제시 전기 시산표(계정별). R7 계정 단위 전기 원천 3
          - {name: 전기 재무제표, keys: [재무제표]}
      - {path: 기타, kinds: [{name: 기타, keys: []}]}
  - path: "1000 감사계약"
    role: workpapers
    workpapers: [PBC, "1100", "1200", "1300"]
  - path: "2000 위험평가"
    role: workpapers
    workpapers: ["2100", 2100-주요거래, "2110", 2110-배정, 2120A, "2301", "2302", "2511", "2512", "2513", "2520", "2530", "2531", "2532", "2533", 2700A, 2700B]
  - path: "3000 위험대응"
    role: workpapers
    workpapers: ["3200", "3300", "3320", "3400", "3500", "3600", 3600-JET, 3650A, "3700", "3800"]
  - path: "4000 계정별"
    role: workpapers
    workpapers: [4000A, 4000B, 4000C, 4000DL, 4000D, 4000E, 4000G, 4000H, 4000AA, 4000BBDD, 4000CC, 4000EE, 4000FF, 4000CL, 4000GG, 4000P, 4000Q, 4000R, 4000T, 4000CF]
    note: 4000 영역은 이 감사에서 생긴 것만 둔다. 표준에 없는 영역도 4000<영문 코드> 로 시작하면 조서로 본다
  - path: "7000 그룹감사"
    role: workpapers
    optional: true
    workpapers: ["7100", "7200", "7400", "7500"]
  - path: "8000 감사완결"
    role: workpapers
    workpapers: [8100A, 8100B, 8110A, "8200", "8300", "8400", "8500", "8550", "8600", "8650", "8700", "8800", "8810", "8820", DART]
  - path: "_색인"
    role: index
    purpose: 에이전트가 관리하는 사본. 사람이 고치지 않는다
    files: [감사건.json, 문서목록.json, 조서목록.json, 이슈.json]
  - path: "_보관"
    role: archive
    purpose: 최종 감사파일(감사보고서일로부터 일반적으로 60일 안에 취합)의 보관본과 파일 해시 목록. 감사조서는 감사 종료 시점부터 8년간 보존한다(외감법 제19조 제2항)
  - path: "_기록"
    role: records
    optional: true
    purpose: 사람이 정한 것(판독 확인 · 고침 · 회사에 묻기 · OCR 값 확인 · 회사정보 확인 · 정산표 확인 · 요청 메일 보냄). 사람마다 확인_<이름>.jsonl 에 줄을 더하기만 한다. _색인 을 다시 만들 때 엔진이 읽어 확인을 다시 입힌다. 색인 · 조서목록에 넣지 않고 보관본에는 넣는다. 지우지 않는다(audit/records.py, 2026-10-22)
  - path: "_작업"
    role: scratch
    optional: true
    purpose: 화면이 띄운 AI 의 작업 파일(_작업/<YYYYMMDD-HHMM>_<스킬>/ 의 patch · 메모 · 글 덤프). 색인 · 조서목록 · 보관본에 넣지 않고 보관(close archive) 때 지운다(2026-10-22)
  - path: "_판"
    role: versions
    optional: true
    purpose: 수정 반영(python -m audit apply) 앞뒤의 조서 폴더 사본과 해시 목록. 되돌리기에 쓰는 작업 이력이고 색인 · 조서목록 · 보관본에 넣지 않는다(definitions/apply.yaml)

# 필수가 아닌 조서. 조건이 맞을 때만 조서목록에 올린다
conditional:
  "3800": 초도감사
  2110-배정: 감사반 인원이 둘 이상이거나 python -m audit assign 으로 배정할 때
  "8650": 기타정보(사업보고서 등)가 있을 때
  "7100": 그룹감사
  "7200": 그룹감사
  "7400": 그룹감사
  "7500": 그룹감사

# 소규모기업 감사 건의 필수 조서(2026-10-26, W-1026-14). 감사건.json company_size 가 「소규모」 일 때만 쓴다.
# 근거: 한공회 감사조서서식 소규모기업 세트(「3. 소규모회사 조서」, 19개 파일)의 「03 일반조서목록」 이 소규모 감사에서 작성하는 조서를 1000~8000 으로 적는다.
# 엔진 조서번호와 한공회 소규모 번호가 다른 곳은 값에 소규모 번호를 적었다(엔진 1200 업무조건합의는 소규모 1100 에, 1300 독립성은 소규모 1200 에,
# 8100A 왜곡표시집계는 소규모 8100B 에, 8110A 종결분석적절차는 소규모 8100A 에 든다). 3600-JET 는 소규모 3600 시트 7-⑴ 분개 테스트 절차다.
# 소규모기업 해당 여부는 감사인이 소규모 1100 시트 「소규모 기업 해당여부에 대한 검토」(외감법상 상장 · 상장예정 · 금융회사 · 사업보고서 제출 · 지정감사 ·
# 연결작성 회사가 아니고, 직전 회계연도말 자산 200억원 미만 또는 매출 100억원 미만)로 정해 감사건에 적는다. 엔진은 정하지 않는다.
# 목록에 있으나 엔진 조서가 없는 것: 2131 감사인측 전문가의 활용(전문가를 쓸 때), 3100 위험에 대한 대응(감사위험 대응 총괄표).
# 「본 목록은 예시적으로 열거된 것이므로 필요시 추가하여야 함」(03 일반조서목록 주석). 4000 영역은 이 목록이 아니라 always_areas 와 이슈 · 유의적 계정으로 정한다
small_entity:
  sizes: [소규모, 일반]
  required:
    "1100": 소규모 1100 계약전 위험평가 및 업무조건의 합의
    "1200": 소규모 1100 계약전 위험평가 및 업무조건의 합의(감사 업무 조건)
    "1300": 소규모 1200 독립성, 윤리규정 및 품질관리기준의 준수
    "2100": 소규모 2100 회사의 사업 및 법규에 대한 이해
    "2110": 소규모 2110 감사계획의 수립
    2120A: 소규모 2120 분석적 절차(계획단계) · 2120A
    "2301": 소규모 2301 감사위험의 평가
    "2511": 소규모 2511 통제환경 이해와 평가
    "2520": 소규모 2520 재무보고 관련 정보시스템에 대한 이해
    "2530": 소규모 2530 감사에 관련된 통제활동의 이해
    "2531": 소규모 2531 통제활동의 이해와 평가 및 감사 중 알게 된 내부통제 미비점
    "2532": 소규모 2532 정보기술(IT)시스템과 IT일반통제의 이해와 평가
    2700A: 소규모 2700 중요성 · 2700A
    "3200": 소규모 3200 유의적 사항에 대한 문서화
    "3300": 소규모 3300 분석적 절차(수행단계)
    "3400": 소규모 3400 공정가치 등 회계추정치
    "3500": 소규모 3500 특수관계자 거래
    "3600": 소규모 3600 부정의 검토
    3600-JET: 소규모 3600 부정의 검토 7-⑴ 분개 테스트
    "3700": 소규모 3700 계속기업 검토
    "3800": 소규모 3800 초도감사 - 기초잔액 감사(초도감사일 때)
    8100A: 소규모 8100 왜곡표시의 평가 · 8100B 왜곡표시 집계표
    8110A: 소규모 8100 분석적절차(종결단계) · 8100A
    "8200": 소규모 8200 후속사건 검토
    "8300": 소규모 8300 서면진술
    "8400": 소규모 8400 공시사항점검표
    "8500": 소규모 8500 커뮤니케이션
    "8550": 소규모 8550 심리사항점검표
    "8600": 소규모 8600 감사 의견의 형성
    "8700": 소규모 8700 감사 종료
    "8800": 소규모 8800 시산표
    "8810": 소규모 8810 날인된 재무제표(주석포함)
    "8820": 소규모 8820 감사보고서의 최종본

naming:
  workpaper: "<조서번호>_<이름>[_v<회사제시 판>].<확장자>"
  workpaper_example: ["2120A_위험평가분석적절차_v1.1.xlsx", "1100_계약전위험평가.xlsx", "8820_감사보고서_v1.2.docx"]
  permanent: "<번호>_<이름>[_<갱신연도>].<확장자>   예) 150_특수관계자목록_2025.xlsx"
  version_rule: 회사제시 판은 v1.1 부터 회사가 다시 낼 때마다 v1.2, v1.3 으로 올린다. v2.0 은 감사 수정을 반영한 최종 판이다
  version_on: 판 표시는 회사제시 숫자가 들어가는 조서에만 붙인다(uses_company_figures)
  received_version: "회사제시 폴더의 파일은 이름 끝에 _v<판> 을 붙인다. 예) 재무제표_시산표_v1.2.xlsx"
  review: 감사반 동료 검토는 폴더를 공유받아 '검토의견_<조서번호>.xlsx' 로 남긴다. Drive 댓글도 색인이 읽는다(R1)

ignore:
  - "~$*"          # 오피스 임시 파일
  - "desktop.ini"
  - "Thumbs.db"
  - ".DS_Store"
  - "*.tmp"
