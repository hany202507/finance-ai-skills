# 표본 방법론 값 (R4 실행, 2026-10-05)
#
# audit/workpapers/sampling.py 가 읽는다. 4000C 매출채권 · 4000P 매출 표본 시트와 3320 조회 대상의 표본 이유에 쓴다.
# 값은 감사인(감사반)의 방법론 값으로 바꿀 수 있다. 바꾸면 줄 끝 주석에 날짜와 까닭을 남긴다.
# 설계 문서 §6(감사-샘플링), §11(방법론 값은 감사인의 것)
#
# 표본 크기(금액 단위 표본, MUS, 예상 왜곡 0건)
#   표본 간격 = 허용왜곡표시(수행중요성) ÷ 신뢰계수
#   표본 수   = 올림(모집단 금액 ÷ 표본 간격)
#   간격 이상인 항목은 고액 항목으로 전부 고른다(간격 선정 결과에 이미 들어간다)
# 무작위 표본은 같은 표본 수를 시드 고정 난수로 고른다(금액 가중 없음).

version: 1

# 같은 시드 · 같은 모집단이면 같은 표본이 나온다. `python -m audit wp make <폴더> 4000C --seed 11` 로 바꾸면 시트에 남는다.
seed: 20251231

# 신뢰계수: 오류 0건을 기대할 때 포아송 분포 상한 = −ln(1 − 신뢰수준).
# 출처: 수식 값(95% 2.996, 90% 2.303, 80% 1.609). AICPA Audit Guide "Audit Sampling" 의 MUS 신뢰계수 표(예상 왜곡 0)와 같은 값이다.
# 위험 수준(감사인 판단)마다 쓰는 신뢰수준은 감사인이 정한다. 아래 대응은 엔진 기본값이고 시트에 기입란으로 다시 묻는다.
# 기본(실무 예시): 2026-10-25 결정. 10-08 감사 전문가 회의의 실무 예시(「중요성 1억에 매출 10억이면 10개」, 표본 간격 = 수행중요성)를
# 초기값으로 둔다. 신뢰계수 1.00 은 오류 0건 기대 때 신뢰수준 약 63%(1 − e^-1)다. 감사인이 표본 시트 · 2700B 에서 높음 · 보통 · 낮음을 고르거나
# 계수를 직접 적으면 그 값이 앞선다. 전에는 감사인 값이 없으면 엔진의 영역 위험 제안(대부분 높음 3.00)을 써서 표본이 실무 예시의 3배쯤 나왔다
# (가상 회사 세트 매출 399건 · 기타유동부채 174건). 근거: 설계 문서 4절
risk_levels:
  기본: {confidence: 0.632, factor: 1.00}
  높음: {confidence: 0.95, factor: 3.00}
  보통: {confidence: 0.90, factor: 2.31}
  낮음: {confidence: 0.80, factor: 1.61}
default_risk: 기본      # 감사인이 위험 수준을 고르지 않았을 때(2026-10-25 높음 → 기본)

# 예상 왜곡표시를 넣을 때의 확장계수(2026-11-09). 열쇠는 잘못된 수용 위험(1 − 신뢰수준), 사이 값은 직선 보간.
# 표본 간격 = (허용왜곡표시 − 예상 왜곡표시 × 확장계수) ÷ 신뢰계수. 출처: AICPA Audit Guide "Audit Sampling" 의 MUS 확장계수 표.
# 예상 왜곡표시는 감사인 값이다(표본 시트 「예상 왜곡표시 직접 입력」 · sample 명령 --expected). 비우면 0 이고 표본 수는 전과 같다.
expansion: {0.01: 1.9, 0.05: 1.6, 0.10: 1.5, 0.15: 1.4, 0.20: 1.3, 0.25: 1.25, 0.30: 1.2, 0.37: 1.15, 0.50: 1.0}

# 단독 표본 조서(python -m audit sample make)에서 고르는 추출 방법(2026-11-09). 감사기준서 530 문단 A13 · 보론 4, 500 문단 A65 · A66.
methods:
  mus: {name: 금액 단위 표본(MUS), kind: 통계 표본}
  random: {name: 무작위 표본, kind: 비통계 표본}
  systematic: {name: 체계적 표본, kind: 비통계 표본}
  specific: {name: 특정 항목 선정, kind: 표본감사 아님(500 문단 A65 · A66)}
# 열린 이슈가 있는 영역과 유의적 위험 영역의 초기값(2026-11-02 결정, 스킬 리뷰 판단필요 1). 감사인 값(표본 시트 · 2302 · 2700B)이 없을 때만 쓴다.
# 근거: 감사기준서 530 문단 7 · A10(수용가능한 위험이 낮을수록 표본이 커진다), 330 문단 7(b). 3.00 은 회계사 샘플 C-1 MUS 시트의 「신뢰계수(관행)」 과 같다.
# 수익인식 부정위험 추정(240 문단 27)으로 매출은 늘 유의적 위험이라 이 값을 쓴다. 비우면 모든 영역이 default_risk 다
risk_area_default: 높음

# 수행중요성 후보: 2700A 에 감사인 값이 없고 분석(analyze)도 아직 돌지 않아 방법론 기본값(methodology.yaml)이 없을 때만 쓴다(2026-10-07).
# 후보 가운데 작은 값을 쓰고 시트에 "엔진 후보" 로 적는다.
# 출처: R4 실행계획(2026-10-05 요청)의 예시 값 '매출 1% · 자산 0.5%'. 감사인 방법론 값이 아니다.
materiality_candidates:
  - {base: 매출액, rate: 0.01}
  - {base: 자산총계, rate: 0.005}

# 4000P 매출 표본을 기간으로 나눠 뽑기(R9 묶음 B4, 2026-10-06). 사람 조서(샘플 F)는 1~9월 · 10~12월을 따로 뽑는다(결산일 근처 기간 귀속 위험).
# 사업연도 마지막 tail_months 달을 한 기간, 그 앞을 다른 기간으로 둔다. 기간마다 같은 허용왜곡표시 · 신뢰계수로 금액 단위 표본을
# 뽑으므로 표본 수는 기간 매출 금액에 비례한다. 시드는 기간마다 seed + 기간 순번(0, 1)이다(같은 시드면 같은 표본).
period_split: {tail_months: 3}
# 4000P 매출 분석: 결산일 전후 일평균 매출을 볼 일수(결산일 전 days 일 · 결산일 후 days 일)
sales_window_days: 15

# 샘플링 가이드 (2026-10-08 감사 전문가 회의). 감사기준에 기법 · 개수 지침이 없어 로컬 회계사가 판단을 못 한다는
# 지적을 받아, 표본 수를 계산만 하지 말고 고르는 방법을 조서에 함께 적는다.
# 회의 근거: docs/meetings/2026-10-08-감사-조서초안-우선순위-정답조서.md (「판단인데 판단을 모르는 거죠」)
# 문장은 감사반 방법론에 맞게 고쳐도 된다. 고치면 줄 끝에 날짜와 까닭을 남긴다. 비우면 가이드 블록이 빠진다.
guide:
  - "표본 수 = 올림(모집단 금액 ÷ 표본 간격)이고, 표본 간격 = (허용왜곡표시 − 예상 왜곡표시 × 확장계수) ÷ 신뢰계수다. 예상 왜곡표시 0 · 신뢰계수 1.00(기본)이면 수행중요성 1억에 매출 10억에서 10개다."  # 2026-11-09 예상 왜곡표시를 넣은 식으로 고침
  - "카테고리로 나눠 볼 때는 카테고리마다 모집단을 갈라 각각 뽑는다. 매출 10억이 제품 3억 · 상품 7억이면 따로 뽑는다. 합쳐 뽑으면 금액이 큰 카테고리에 점이 몰린다."
  - "판관비는 전 계정을 뽑지 않는다. 분석적 검토로 수행중요성을 넘거나 추이가 튀는 계정만 표본을 뽑고, 나머지는 원장 통독과 메모로 둔다."
  - "한 계정과목에서 뽑는 수에 상한을 두는 감사반이 있다(계정과목당 75개 사례). 제품군마다 그 수를 다시 적용하면 과하다."
  - "회사 특성에 따라 볼 것이 달라진다. 수출이 많으면 해외 매출채권과 수출신고서를 함께 보고, 국내 거래만이면 그 절차를 뺀다."
  - "감사기준에 기법과 개수 지침이 없어 표본 수는 감사인의 판단이다. 왜 그 수인지를 이 조서에 남기는 것이 뒤에 설명할 근거가 된다."
  - "예상 왜곡표시를 0 으로 두면 표본 수가 가장 작지만, 간격 미만 항목에서 왜곡이 하나만 나와도 상한이 허용왜곡표시를 넘는다. 전기에 왜곡이 있었으면 예상 왜곡표시를 적고 뽑는다."  # 2026-11-09
  - "특정 항목 선정(고액 · 상위 n개 · 결산일 전후)은 표본감사에 해당하지 않아 결과를 투영하지 않는다. 선정하지 않은 나머지가 허용왜곡표시보다 크면 나머지에 분석적 절차나 표본을 더한다(500 문단 A66)."  # 2026-11-09
