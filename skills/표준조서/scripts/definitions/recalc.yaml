# R9 묶음 A 계정별 조서 보강 정의 (2026-10-06)
#
# audit/workpapers/recalc.py 가 읽는다. 4000 리드 부속 시트(거래처별 증감 · 이자 재계산 · 차입금 약정 · 감가상각 재계산 ·
# 부외부채 검토 · 재고실사)와 3200 소송 조회 대장, 4000 리드의 주석 연결.
# 엔진은 숫자를 받은자료 · 분개장 · 시산표에서만 읽는다. 결론 · 부외부채 여부 · 재고 차이 처리 · 승패전망은 회계사 기입란이다.
# 계정 묶음은 더존 계정코드 앞 세 자리 기준이다. 회사 코드가 다르면 names 낱말로 찾는다.

version: 1

accounts:
  receivable: {ranges: [[108, 110]], names: [외상매출금, 받을어음, 매출채권]}
  payable: {ranges: [[251, 252]], names: [외상매입금, 지급어음, 매입채무]}
  other_payable: {ranges: [[253, 253], [262, 262]], names: [미지급금, 미지급비용]}
  borrowings: {ranges: [[260, 260], [264, 264], [291, 293]], names: [차입금, 유동성장기부채, 사채]}
  interest_expense: {ranges: [[951, 951]], names: [이자비용]}
  cash: {ranges: [[101, 106]], names: [현금, 예금]}
  # 감가상각비 · 상각비(판관비 818 · 840, 제조원가 518). 계정명 낱말이 먼저다
  depreciation: {ranges: [[518, 518], [818, 818]], names: [감가상각비]}
  amortization: {ranges: [[840, 840]], names: [무형자산상각, 개발비상각, 소프트웨어상각]}
  accumulated_depreciation: {ranges: [], names: [감가상각누계액]}
  inventory: {ranges: [[146, 169]], names: [재고자산, 제품, 상품, 원재료, 재공품, 저장품]}
  # 부외부채 후보가 되는 차변 계정: 비용(451~899 · 951~997)과 자산(101~250, 현금 · 부가세대급금 제외)
  expense: {ranges: [[451, 899], [951, 997]]}
  asset: {ranges: [[107, 134], [136, 250]]}
  # 4000CL 기말 후 출금 검토: 상대계정이 부채이면 기말 부채 결제로 구분한다
  liability: {ranges: [[251, 330]]}
  # 4000FF 충당부채 변동: 차변의 상대계정이 수익(매출 · 영업외수익)이나 환입 계정이면 환입으로 본다
  income: {ranges: [[401, 430], [901, 930]], names: [환입]}

# A2 거래처별 증감표(4000 영역 → 계정 묶음, 계정명세서 시트 낱말, 증가 쪽)
party_movement:
# reply_kinds: 3320 조회 대장(_색인/조회.json)의 종류 가운데 이 영역 회신으로 보는 것
  C: {accounts: receivable, sheets: [외상매출금, 매출채권], increase: dr, line: 매출채권, reply_kinds: [매출채권, 채권채무]}
  AA: {accounts: payable, sheets: [외상매입금, 매입채무], increase: cr, line: 매입채무, reply_kinds: [매입채무, 채권채무]}
  BBDD: {accounts: borrowings, sheets: [차입금], increase: cr, line: 차입금, reply_kinds: [은행, 여신]}

# A3 이자 재계산(적수). 일수는 한편넣기(잔액이 바뀐 날을 넣고 다음 바뀐 날은 뺀다, 결산일은 넣는다)
interest:
  days_in_year: 365        # 기입란(연 일수)이 비어 있을 때 쓰는 값. 원화 여신 이자는 1년 365일 일할 계산이 관행이다
  basis: >-
    적수 = 잔액 × 그 잔액이 유지된 일수(한편넣기: 잔액이 바뀐 날 포함, 다음 바뀐 날 제외, 결산일 포함).
    재계산 이자 = 적수 × 약정 이율 ÷ 연 일수(원 미만 반올림). 원화 여신의 1년 365일 일할 계산 관행을 따른다.
    약정서가 월할(원금 × 이율 ÷ 12) 이거나 360일 기준이면 연 일수 칸을 고치거나 차이 사유에 적어 주십시오

# A4 감가상각 · 상각 재계산
depreciation:
  methods:
    정액법: [정액, 직선]
    정률법: [정률, 체감]
  basis_straight: >-
    정액법: (취득가액 − 잔존가치) ÷ 내용연수 × 당기 사용 월수 ÷ 12. 상각누계액이 감가상각대상금액을 넘지 않게 남은 금액을 한도로 한다.
    감가상각은 사용가능한 때부터 시작한다(일반기업회계기준 문단 10.34). 사용 월수는 취득월을 넣는 월할이다
    (실무 관행. 법인세법 시행령 제26조 제9항 · 1개월 미만은 1개월)
  basis_declining: >-
    정률법: (취득가액 − 기초 상각누계액) × 상각률 × 당기 사용 월수 ÷ 12. 상각률은 대장의 상각률 열에서 읽고,
    없으면 기입란이다(엔진은 상각률을 정하지 않는다)
  basis_intangible: >-
    무형자산은 합리적인 상각방법을 정할 수 없으면 정액법이고 잔존가치는 없는 것이 원칙이다(일반기업회계기준 문단 11.32 · 11.33).
    대장에 방법이 없으면 기입란이다
  columns:
    life: [내용연수, 상각연수, 내용년수]
    method: [상각방법, 감가상각방법, 방법]
    residual: [잔존가치, 잔존가액]
    rate: [상각률]
    acct: [계정, 계정과목, 계정명, 과목]
    asset_no: [자산번호, 자산코드, 관리번호]
    beg_acc: [기초감가상각누계액, 기초상각누계액, 전기말감가상각누계액, 기초누계액]

# A5 부외부채 테스트
unrecorded:
  window_days: 60          # 결산일 다음 날부터 이 일수 안의 지급 전표
  # 적요에 이 낱말이 있으면 「적요에 당기 표시」 로 적는다(판단은 회계사). {year} 는 당기 연도, {month} 는 결산월
  period_hints: ["{year}년", "{year}.", "{month}월분", "{year}-{month2}"]

# A6 재고실사 입회(재고 명세: 계정명세서 재고 시트 또는 재고 명세 · 실사표)
inventory:
  sheets: [재고자산, 재고, 제품, 원재료]
  columns:
    item_code: [품목코드, 품번, 품목번호, 코드]
    item: [품목명, 품명, 품목, 규격]
    kind: [구분, 재고구분, 분류]
    location: [보관장소, 창고, 보관처, 위치]
    unit: [단위]
    qty: [장부수량, 기말수량, 재고수량, 수량]
    price: [단가, 평균단가]
    amount: [장부금액, 기말금액, 재고금액, 금액]
  # 보관장소에 이 낱말이 있으면 타처보관(조회 · 입회 대상 안내, 판단은 회계사)
  outside_keys: [외부, 타처, 위탁, 임가공, 수탁, 물류]

# A1 리드 주석 공시사항: 주석 정의(report_fs.yaml notes)의 units 가 영역 표시과목과 겹치면 연결한다.
# units 가 없는 주석은 아래 영역에 연결한다
lead_notes:
  retirement: [EE]
  equity: [GG]
  revenue: [P]
  tax: [T]
  contingent: [BBDD, CL]

# ---------------------------------------------------------------------------
# 절차 시트 둘째 묶음 (2026-10-12, audit/workpapers/substantive.py)
# 설계 문서 12절
# 귀속 판단 · 적립율 · 기준 금액 · 사유 · 결론은 회계사 기입란이다. 아래 값은 뽑는 범위와 표시 기준이고 판단 기준은 없다

# 4000P 매출 Cut-off: 결산일 앞뒤 기간의 매출 전표 가운데 금액(절대값) 상위
cutoff:
  days: 5            # 결산일을 넣어 앞 days 일, 결산일 다음 날부터 days 일
  top: 10            # 구간마다 조서에 싣는 전표 수

# 4000R 판관비 월별 변동: 달 금액이 그 세목 월평균의 multiple 배를 넘고 수행중요성도 넘으면 붉게 보이고 사유를 받는다
monthly:
  multiple: 2.0

# 4000CL 기말 후 출금 검토. 대상 기간은 unrecorded.window_days 를 4000AA 부외부채 검토와 같이 쓴다.
# 기간 후 사건(2026-10-26, audit/workpapers/subsequent.py · 감사-기간후사건 스킬)
#   threshold   기준 금액(원). 이 금액 이상인 출금마다 분류 칸을 둔다. 2700B 「recalc.subsequent_threshold」 로 감사 건마다 바꾸고,
#               4000CL 시트의 「기준 금액(기말 후 출금)」 칸에 적으면 그 조서에서만 그 값을 쓴다. 0 이면 수행중요성
#   max_rows    기준 금액 이상 출금을 이 줄 수까지 싣는다(넘으면 기준 금액을 올리라고 적는다)
#   classes     분류 칸에서 감사인이 고르는 값. 엔진은 제안만 하고 고르지 않는다
#   next_hints  적요에 다음 기간 표시가 있으면 「다음 기간 정상 거래」 를 제안한다. 당기 표시는 unrecorded.period_hints 를 같이 쓴다.
#               {next_year} 는 결산일 다음 해, {post_month} 는 대상 기간의 달. 앞에 숫자가 붙은 것(11월분의 1월분)은 보지 않는다
subsequent:
  threshold: 5000000
  max_rows: 300
  classes: [기말 부채 결제, 당기 비용, 다음 기간 정상 거래, 확인 필요]
  next_hints: ["{next_year}년", "{next_year}.", "{next_year}-", "{post_month}월분"]
  kinds:
    transfer: 계좌 사이 대체
    settle: 기말 부채 결제
    accrue: 기말 후 발생 또는 계상하지 않은 부채 후보
    other: 확인 필요
  # 법률 수수료 거래처 대사. 거래처 이름 낱말은 definitions/confirm_kinds.yaml 변호사 party_keys 를 같이 쓴다
  legal:
    memo_keys: [법률, 소송, 변호사, 착수금, 성공보수]   # 비용 계정 차변 줄의 적요에 있으면 법률 수수료로 본다
    case_keys: [소송, 착수금, 성공보수, 가압류, 소장]   # 적요에 있으면 「적요에 소송 낱말」 로 적는다(판단은 감사인)
    list_keys: [변호사 목록, 법무법인 목록, 법률사무소 목록, 소송 현황, 소송 목록, 법률 자문 현황, 법률자문 현황]  # 회사가 낸 변호사 목록 파일 이름
    list_columns: [법무법인, 법률사무소, 사무소, 변호사, 대리인, 법률 자문 거래처]

# 4000FF 충당부채 변동: 사용 건을 금액 상위 use_top 건까지 싣는다
provision:
  use_top: 10

# 4000GG 자본변동표: 자본 계정 전표의 변동 유형을 낱말로 나눈다. 어느 것에도 맞지 않으면 「그 밖의 변동」 이다
equity:
  dividend_keys: [배당]                       # 적요나 상대계정명에 있으면 배당
  issue_accounts: [자본금, 주식발행초과금]    # 이 계정의 대변이고 아래 조건 가운데 하나가 맞으면 증자
  issue_keys: [증자, 신주, 주금]              # 적요에 있거나 상대계정이 현금 · 예금
  income_keys: [손익, 당기순이익]             # 상대계정명에 있거나 상대계정이 손익 계정이면 당기순이익
  capital_lines: [자본금]                     # 등기 대사의 장부 자본금으로 보는 표시과목

# 4000G · 4000H 변동내역: 고정자산대장에서 더 읽는 열(없으면 그 값을 0 으로 두거나 다른 열로 계산하고 시트에 적는다)
rollforward:
  columns:
    disposal: [당기처분, 당기처분액, 처분가액, 처분금액, 처분장부가액, 당기감소]
    end_acc: [기말감가상각누계액, 기말상각누계액, 당기말감가상각누계액]
    end_book: [기말장부가액, 기말장부금액, 당기말장부가액, 기말잔액]
    beg_book: [기초장부가액, 기초장부금액, 전기말장부가액, 기초잔액]

# 4000C 손실충당금 검토: 연령분석표 머리줄에서 연령 구간 열을 찾는 규칙과 시산표의 충당금 계정 낱말
loss_allowance:
  bucket_units: [일, 개월, 월, 년]            # 머리 이름에 숫자와 이 단위가 함께 있으면 연령 구간 열이다
  bucket_words: [미도래, 미경과]              # 숫자가 없어도 이 낱말이 있으면 연령 구간 열이다
  allowance_names: [대손충당금, 손실충당금]
