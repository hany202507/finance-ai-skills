# 계정별 표준조서 정의(2026-11-24). 설계 문서
#
# 예시 조서 가 · 나 · 다 · 라(Drive KernelAcademy/감사 모듈/예시 조서)의 Lead · 절차 시트 구성을 기호로만 옮겼다.
# 회사 · 거래처 · 사람 이름, 금액, 회사 고유 계정은 넣지 않는다.
#
# 영역 키
#   name       조서 이름(파일 이름 · A3)
#   letter     8100B 정산표 「영역」 열 값
#   kicpa      한공회 4000 Part 1 · Part 2 키(tools/proto_data/kicpa_4000_part1.json · part2.json)
#   main       bs · pl · none. Lead 첫 블록과 예비 줄을 넉넉히 줄 블록. none 은 금액 표 없이 절차 목록 Lead(예시 다 CL)
#   pl_words   영역이 달라도 이 조서 손익 블록에 함께 싣는 계정명 낱말
#   lines      8100B 「영역」 과 상관없이 표시과목이 이 이름인 손익 계정을 이 조서 주 블록에 싣는다(4000S).
#              8100B 가 영업외손익을 매출(P) · 판관비(R) 영역에 넓게 넣어 두기 때문이다. 다른 조서는 이 계정을 자기 계정으로 싣지 않고
#              pl_words 가 맞으면 「다른 영역 손익 계정」 으로만 싣는다
#   sheets     절차 시트. id 는 .01 부터, steps 는 이 시트가 덮는 Part 1 번호, cols 는 표 머리, tie 는 합계를 Lead 주 블록 Final 과 견줄 열
#   checks     main none 영역의 Lead 절차 목록(번호 · 절차 · 결과 기입 · Ref)
#
# 표지 조서번호: steps 로 시트를 찾고, Part 1 의 총괄표(1번)와 「감사결론」 은 Lead, 「공시」 가 든 절차는 주석 시트로 잇는다.

assertions:
  - [E, 실재성]
  - [C, 완전성]
  - [RO, 권리와 의무]
  - [V, 평가]
  - [A, 정확성]
  - [O, 발생사실]
  - [CO, 기간귀속]
  - [CL, 분류]
  - [P, 표시]
  - [U, 이해가능성]

ticks:
  - ["{a}", 전기 감사보고서와 대사함]
  - ["{b}", 회사 제시 명세서 및 재무제표와 비교대사]
  - ["{c}", 합계검증함]

memo:                     # Audit memo 칸. 에이전트가 std fill 로 채우는 키
  - [main, (1) 계정의 주요 내용]
  - [change, (2) 증감 분석]
  - [risk, (3) 이슈 · 유의적 위험 대응]

areas:
  4000A:
    name: 현금및현금성자산
    letter: A
    kicpa: A
    main: bs
    pl_words: [이자수익, 외화환산, 외환차]
    sheets:
      - {id: "01", title: 금융상품 명세, steps: [2], asrt: [E, C, V],
         purpose: 기말 현금및현금성자산 · 금융상품 잔액을 계좌별로 확인한다,
         proc: 회사 제시 명세를 입수해 시산표와 대사하고 계좌별 전기말 · 당기말 잔액과 사용 제한 여부를 적는다,
         cols: [금융기관, 종류, 계좌(끝 4자리), 통화, 전기말, 당기말, 사용 제한, t/m], tie: 당기말}
      - {id: "02", title: 금융기관 조회, steps: [4], asrt: [E, RO],
         purpose: 잔액의 실재성과 권리를 금융기관 회신으로 확인한다,
         proc: 금융기관 조회서를 발송 · 회수해 장부 잔액과 대사하고, 회신이 없으면 대체적 절차를 적는다,
         cols: [금융기관, 발송일, 회신일, 장부 잔액, 회신 잔액, 차이, 대체적 절차, 비고], tie: 장부 잔액}
      - {id: "03", title: 현금 실사, steps: [3], asrt: [E, C],
         purpose: 보유 현금 · 미사용 수표 · 어음의 실재성을 확인한다,
         proc: 실사일 보유액을 세어 장부와 대사하고 실사일과 결산일 사이 증감을 조정한다,
         cols: [실사일, 장소, 권종, 수량, 금액, 장부, 차이, 비고]}
      - {id: "04", title: 사용 제한 예금, steps: [5], asrt: [CL, P],
         purpose: 사용이 제한된 예금과 장기성 예금의 분류 · 공시를 확인한다,
         proc: 조회 회신 · 약정서에서 질권 · 담보 · 사용 제한을 찾아 분류와 주석 기재를 확인한다,
         cols: [금융기관, 종류, 금액, 제한 내용, 분류, 주석 기재]}
  4000B:
    name: 유가증권
    letter: B
    kicpa: B
    main: bs
    pl_words: [평가이익, 평가손실, 처분이익, 처분손실, 배당금수익]
    sheets:
      - {id: "01", title: 금융자산 명세, steps: [2, 6], asrt: [C, V, CL],
         purpose: 금융자산 잔액과 분류를 종목별로 확인한다,
         proc: 회사 제시 명세를 시산표와 대사하고 종목별 분류 · 수량 · 장부금액을 확인한다,
         cols: [종목, 분류, 수량, 취득원가, 전기말, 당기말, t/m], tie: 당기말}
      - {id: "02", title: 실재성 확인, steps: [3], asrt: [E, RO],
         purpose: 보관 기관 회신 · 실물로 실재성과 권리를 확인한다,
         proc: 증권사 · 예탁원 조회서 회신 또는 실물 실사로 수량을 대사한다,
         cols: [종목, 보관처, 장부 수량, 확인 수량, 차이, 확인 방법]}
      - {id: "03", title: 후속측정 · 손상, steps: [7, 8], asrt: [V, A],
         purpose: 공정가치 평가와 손상 검토의 적정성을 확인한다,
         proc: 기말 공정가치 원천을 확인해 평가손익을 재계산하고 손상 징후를 검토한다,
         cols: [종목, 장부금액, 공정가치, 원천, 평가손익, 재계산, 차이]}
      - {id: "04", title: 증감 · 배당 · 이자, steps: [5, 9], asrt: [O, C, A],
         purpose: 중요한 취득 · 처분과 관련 손익을 확인한다,
         proc: 취득 · 처분 증빙과 대사하고 처분손익 · 배당 · 이자수익을 재계산한다,
         cols: [일자, 종목, 구분, 금액, 손익, 증빙, 비고]}
  4000C:
    name: 매출채권
    letter: C
    kicpa: C
    main: bs
    pl_words: [대손상각비, 대손충당금환입]
    sheets:
      # feed: 엔진 계산을 이 표에 채운다(2026-11-25 D1, audit/stdfeed.py). calc 는 줄마다 넣는 수식({열} 은 같은 줄 칸, {p:이름} 은 표 위 줄 값)
      - {id: "01", title: 거래처별 잔액 명세, steps: [2, 4], asrt: [E, C, A, CL],
         purpose: 매출채권 잔액을 거래처별로 확인하고 일반 상거래 외 채권의 재분류를 본다,
         proc: 거래처별 명세를 입수해 시산표와 대사하고 전기 대비 증감이 큰 거래처와 성격이 다른 채권을 짚는다,
         cols: [거래처, 특수관계, 전기말, 당기말, 증감, 연령, 비고, t/m], tie: 당기말, lead_excl: [충당금],
         feed: ar_parties, calc: {증감: '=IF(OR({당기말}="",{전기말}=""),"",{당기말}-{전기말})'}}
      - {id: "02", title: 채권 조회, steps: [3, 8], asrt: [E, RO, V],
         purpose: 잔액의 실재성을 거래처 회신으로 확인한다,
         proc: 표본 거래처에 조회서를 발송해 회신 잔액과 대사하고 차이 원인을 적는다,
         cols: [거래처, 장부 잔액, 발송일, 회신 잔액, 차이, 차이 원인, 비고, 투영(과대), 투영(과소)], tie: 장부 잔액, lead: false,
         feed: ar_confirm, fmts: {발송일: text},
         calc: {차이: '=IF(OR({장부 잔액}="",{회신 잔액}=""),"",{장부 잔액}-{회신 잔액})',
                투영(과대): '=IF(AND(ISNUMBER({차이}),ISNUMBER({p:표본 간격}),ISNUMBER({장부 잔액})),IF({차이}>0,IF(OR({장부 잔액}<=0,{장부 잔액}>={p:표본 간격}),{차이},ROUND({차이}/{장부 잔액}*{p:표본 간격},0)),0),0)',
                투영(과소): '=IF(AND(ISNUMBER({차이}),ISNUMBER({p:표본 간격}),ISNUMBER({장부 잔액})),IF({차이}<0,IF(OR({장부 잔액}<=0,{장부 잔액}>={p:표본 간격}),-{차이},ROUND(-{차이}/{장부 잔액}*{p:표본 간격},0)),0),0)'},
         after: {'표본에서 찾은 왜곡표시(차이 합계)': {차이: '=SUM({rng:차이})'},
                 '투영한 왜곡표시: 과대계상': {차이: '=SUM({rng:투영(과대)})'},
                 '투영한 왜곡표시: 과소계상': {차이: '=SUM({rng:투영(과소)})'}}}
      - {id: "03", title: 대체적 절차, steps: [3, 6], asrt: [E, CO],
         purpose: 회신이 없는 거래처와 기간귀속을 기말 후 회수 · 증빙으로 확인한다,
         proc: 기말 후 입금 · 세금계산서 · 출고 증빙과 대사하고 결산일 전후 매출의 귀속을 확인한다,
         cols: [거래처, 장부 잔액, 기말 후 입금, 증빙, 확인 금액, 차이, 비고], feed: ar_alt,
         calc: {차이: '=IF(OR({장부 잔액}="",{확인 금액}=""),"",{장부 잔액}-{확인 금액})'}}
      - {id: "04", title: 손실충당금, steps: [5], asrt: [V, A],
         purpose: 회수가능성과 손실충당금의 적정성을 확인한다,
         proc: 연령분석표의 완전성을 시산표와 대사하고 회사 설정률 · 개별평가를 재계산한다,
         cols: [연령 구간, 잔액, 설정률, 충당금, 재계산, 차이, 비고], feed: ar_allowance, fmts: {설정률: pct},
         calc: {재계산: '=IF(OR({잔액}="",{설정률}=""),"",ROUND({잔액}*{설정률},0))',
                차이: '=IF(OR({충당금}="",{재계산}=""),"",{충당금}-{재계산})'},
         after: {'완전성 차이(구간 합 − 시산표 채권 잔액)': {잔액: '=SUM({rng:잔액})-{a:시산표 채권 잔액(충당금 차감 전):잔액}'}}}
      - {id: "05", title: 외화환산, steps: [7], asrt: [V, A],
         purpose: 외화표시 매출채권의 환산을 확인한다,
         proc: 기말 환율로 재계산해 회사 환산액과 견준다,
         cols: [거래처, 통화, 외화 금액, 기말 환율, 원화 재계산, 장부, 차이]}
  4000D:
    name: 기타유동자산
    letter: D
    kicpa: D
    main: bs
    pl_words: [이자수익]
    sheets:
      - {id: "01", title: 계정별 명세, steps: [2, 4], asrt: [C, V],
         purpose: 기타유동자산(미수금 · 선급금 · 선급비용 · 대여금 · 보증금)의 잔액과 성격을 확인한다,
         proc: 계정별 명세를 입수해 시산표와 대사하고 중요한 항목은 증빙과 대사한다,
         cols: [계정, 상대방, 내용, 전기말, 당기말, 증빙, t/m], tie: 당기말}
      - {id: "02", title: 외부 조회, steps: [3], asrt: [E, RO],
         purpose: 중요한 잔액의 실재성을 상대방 회신으로 확인한다,
         proc: 조회서 회신 잔액과 대사하고 회신이 없으면 대체적 절차를 적는다,
         cols: [상대방, 장부 잔액, 회신 잔액, 차이, 대체적 절차]}
      - {id: "03", title: 기간계산 항목, steps: [5], asrt: [A, CO],
         purpose: 선급비용 · 미수수익의 기간 배분을 확인한다,
         proc: 계약 기간과 금액으로 기말 잔액을 재계산한다,
         cols: [항목, 계약 기간, 총액, 경과 기간, 재계산, 장부, 차이]}
      - {id: "04", title: 회수가능성, steps: [6], asrt: [V],
         purpose: 회수가 불확실한 항목과 충당금을 확인한다,
         proc: 장기 미회수 · 분쟁 항목을 찾아 충당금 설정 여부를 확인한다,
         cols: [상대방, 잔액, 발생일, 회수 상황, 충당금, 판단]}
  4000DL:
    name: 리스
    letter: DL
    kicpa: DL
    main: bs
    pl_words: [사용권자산상각비, 리스이자, 지급임차료]
    sheets:
      - {id: "01", title: 리스계약 목록 · 분류, steps: [1, 5], asrt: [A, C, CL],
         purpose: 리스계약을 빠짐없이 입수하고 분류를 확인한다,
         proc: 임차 계약 · 원장의 임차료 · 렌탈료로 계약 목록의 완전성을 보고 계약마다 분류 근거를 적는다,
         cols: [계약, 대상, 기간, 월 지급액, 분류, 근거, 비고]}
      - {id: "02", title: 최초 인식 · 측정, steps: [2, 3], asrt: [A, E, CL],
         purpose: 리스자산 · 리스부채 최초 인식 금액을 확인한다,
         proc: 리스료 · 할인율 · 기간으로 현재가치를 재계산해 회사 금액과 견준다,
         cols: [계약, 리스료 합계, 할인율, 현재가치, 장부, 차이]}
      - {id: "03", title: 후속측정, steps: [4], asrt: [A],
         purpose: 상각 · 이자 · 잔액 변동을 확인한다,
         proc: 계약별 기초 · 증가 · 상각 · 상환 · 기말을 재계산해 시산표와 대사한다,
         cols: [계약, 기초, 증가, 상각, 이자, 상환, 기말], tie: 기말}
  4000E:
    name: 재고자산
    letter: E
    kicpa: E
    main: bs
    pl_words: [재고자산평가손실, 재고자산감모손실, 평가충당금환입]
    sheets:
      - {id: "01", title: 재고 명세 · 수불부, steps: [2, 4], asrt: [C, V],
         purpose: 기말 재고 잔액을 품목군별로 확인하고 수불부를 검증한다,
         proc: 수불부 기말 금액을 시산표와 대사하고 품목군별 전기 대비 증감을 본다,
         cols: [품목군, 창고, 전기말, 당기말, 증감, 회전일수, t/m], tie: 당기말}
      - {id: "02", title: 실사 입회, steps: [3], asrt: [E, RO],
         purpose: 재고의 실재성을 실사 입회로 확인한다,
         proc: 실사 표본의 장부 수량과 실사 수량을 대사하고 실사일과 결산일 사이 수불을 조정한다,
         cols: [품목, 창고, 장부 수량, 실사 수량, 차이, 단가, 차이 금액, 원인]}
      - {id: "03", title: 단가 검토, steps: [5], asrt: [V, A],
