  - {key: S-new-party-large-sales.ratio, group: signals, name: "신규 거래처 매출 합 ≥ 수행중요성 ×", file: signals, path: "signals[id=S-new-party-large-sales].min_amount.ratio", unit: multiple, wp: 2120A, grade: 초기값}
  - {key: S-ar-days-up.n_days, group: signals, name: "매출채권 회전일수 증가", file: signals, path: "signals[id=S-ar-days-up].params.n_days", unit: days, wp: 2120A, grade: 초기값}
  - {key: S-post-ye-reversal.window_days, group: signals, name: "결산일 뒤 매출 차감 전표를 보는 기간", file: signals, path: "signals[id=S-post-ye-reversal].params.window_days", unit: days, wp: "2120A · 8100B", grade: 초기값}
  - {key: S-post-ye-reversal.ratio, group: signals, name: "결산일 뒤 매출 차감 합 ≥ 수행중요성 ×", file: signals, path: "signals[id=S-post-ye-reversal].min_amount.ratio", unit: multiple, wp: 2120A, grade: 초기값}
  - {key: S-inv-days-up.n_days, group: signals, name: "재고 회전일수 증가", file: signals, path: "signals[id=S-inv-days-up].params.n_days", unit: days, wp: 2120A, grade: 초기값}
  - {key: S-gm-swing.pp, group: signals, name: "매출총이익률 변동", file: signals, path: "signals[id=S-gm-swing].params.pp", unit: pp, wp: 2120A, grade: 초기값}
  - {key: S-ye-round-manual.window_days, group: signals, name: "결산 직전 수동 전표를 보는 일수", file: signals, path: "signals[id=S-ye-round-manual].params.window_days", unit: days, wp: 2120A, grade: 초기값}
  - {key: S-ye-round-manual.round_unit, group: signals, name: "수동 전표 끝자리 단위", file: signals, path: "signals[id=S-ye-round-manual].params.round_unit", unit: won, wp: 2120A, grade: 초기값}
  - {key: S-ye-round-manual.ratio, group: signals, name: "결산 직전 수동 전표 합 ≥ 수행중요성 ×", file: signals, path: "signals[id=S-ye-round-manual].min_amount.ratio", unit: multiple, wp: 2120A, grade: 초기값}
  - {key: S-expense-accrual-drop.p, group: signals, name: "미지급비용 감소율", file: signals, path: "signals[id=S-expense-accrual-drop].params.p", unit: ratio, wp: 2120A, grade: 초기값}

  # 이슈 순위
  - {key: rank.amount_cap, group: rank, name: "금액 점수 상한(금액 ÷ 수행중요성)", file: analytics, path: "rank.amount_cap", unit: multiple, wp: 2120A, grade: 초기값}
  - {key: rank.weight.recon, group: rank, name: "가중치: 자료 사이 대사", file: analytics, path: "rank.weight.recon", unit: factor, wp: 2120A, grade: 초기값}
  - {key: rank.weight.expectation, group: rank, name: "가중치: 기대치", file: analytics, path: "rank.weight.expectation", unit: factor, wp: 2120A, grade: 초기값}
  - {key: rank.weight.relation, group: rank, name: "가중치: 관계 규칙", file: analytics, path: "rank.weight.relation", unit: factor, wp: 2120A, grade: 초기값}
  - {key: rank.weight.keytx_minutes, group: rank, name: "가중치: 의사록 대사", file: analytics, path: "rank.weight.keytx_minutes", unit: factor, wp: 2120A, grade: 초기값}
  - {key: rank.weight.keytx, group: rank, name: "가중치: 비경상 전표", file: analytics, path: "rank.weight.keytx", unit: factor, wp: 2120A, grade: 초기값}
  - {key: rank.weight.variance, group: rank, name: "가중치: 증감", file: analytics, path: "rank.weight.variance", unit: factor, wp: 2120A, grade: 초기값}
  - {key: rank.weight.monthly, group: rank, name: "가중치: 월별 추이", file: analytics, path: "rank.weight.monthly", unit: factor, wp: 2120A, grade: 초기값}
  - {key: rank.weight.pattern, group: rank, name: "가중치: 감리지적사례 패턴", file: analytics, path: "rank.weight.pattern", unit: factor, wp: 2120A, grade: 초기값}
  - {key: rank.corroboration, group: rank, name: "다른 종류 Finding 이 겹칠 때 더하는 점수", file: analytics, path: "rank.corroboration", unit: factor, wp: 2120A, grade: 초기값}
  - {key: rank.corroboration_cap, group: rank, name: "겹침 점수를 더하는 최대 개수", file: analytics, path: "rank.corroboration_cap", unit: count, wp: 2120A, grade: 초기값}
