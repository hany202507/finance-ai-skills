# 감사방법론 설정 카탈로그 (2026-10-07). audit/params.py 가 읽는다.
#
# 감사인 판단이나 감사반 방법론에 따라 달라지는 값의 목록이다. 기본값은 각 정의 파일(file · path)에 있고, 감사 건마다
# 2700B 감사방법론 설정 조서의 「감사인 값」 칸이 그 기본값을 덮는다. 엔진은 정의 파일을 읽을 때 지금 감사 건의 2700B 값을
# 겹쳐 읽는다(params.use). 그래서 이 감사에 적용한 값은 이 감사 파일(2700B)에 남고, 정의 파일을 나중에 고쳐도 끝난 감사의
# 결과가 바뀌지 않는다(감사기준서 230 문서화).
#
# 중요성(2700A)과 2120A 유의성 기준은 그 조서의 기입란이 정본이라 여기 넣지 않는다(methodology.yaml). 화면 「방법론」 에는 함께 보인다.
#
# 항목
#   key    2700B 기입란 이름에 쓰는 열쇠(바꾸지 않는다. 바꾸면 앞서 적은 값을 잃는다)
#   file   정의 파일(definitions/<file>.yaml)
#   path   그 파일 안 위치. 점으로 잇고, 목록은 [id=값] 으로 고른다
#   unit   ratio(비율, 20% 또는 0.2) · pp(%p) · days(일) · count(개 · 번) · months(개월) · won(원) · multiple(배) · factor(계수)
#          · yesno(예 · 아니오) · choice(choices 가운데 하나) · int(정수)
#   wp     값이 닿는 조서
#   grade  근거 수준: 기준서 · 법정 · 실무 관행 · 초기값(대표 블라인드 대조로 조정할 값) · 재현
#   rerun  바꾼 뒤 다시 돌릴 명령

version: 1

groups:
  - {key: analytics, title: "2120A 위험평가 분석적 절차 (증감 관계 · 월별)", rerun: analyze}
  - {key: signals, title: "2120A 패턴 신호", rerun: analyze}
  - {key: rank, title: "이슈 순위 (2120A · 2302 · 4000 대응 조서)", rerun: analyze}
  - {key: keytx, title: "2100-주요거래 (의사록 대사 · 비경상 전표)", rerun: analyze}
  - {key: jet, title: "3600-JET 분개 테스트", rerun: wp make}
  - {key: sampling, title: "표본 (4000C · 4000P · 3320 표본 이유)", rerun: wp make}
  - {key: confirm, title: "3320 외부조회 대상", rerun: wp make}
  - {key: recalc, title: "4000 재계산 · 부외부채", rerun: wp make}
  - {key: close, title: "8700 감사종료", rerun: close make}

params:
  # 2120A 증감 관계 · 월별
  - {key: M-ye-month.ratio, group: analytics, name: "결산월 금액 ÷ 앞 11개월 평균", file: analytics, path: "monthly.rules[id=M-ye-month].ratio_to_avg", unit: multiple, wp: 2120A, grade: 초기값}
  - {key: R-sales-ar.threshold, group: analytics, name: "매출 · 매출채권 증감률 차이", file: analytics, path: "relations[id=R-sales-ar].threshold", unit: ratio, wp: 2120A, grade: 초기값}
  - {key: R-inv-cogs.threshold, group: analytics, name: "재고 · 매출원가 증감률 차이", file: analytics, path: "relations[id=R-inv-cogs].threshold", unit: ratio, wp: 2120A, grade: 초기값}
  - {key: R-debt-interest.threshold, group: analytics, name: "차입금 · 이자비용 증감률 차이", file: analytics, path: "relations[id=R-debt-interest].threshold", unit: ratio, wp: 2120A, grade: 초기값}
  - {key: R-intangible-rnd.threshold, group: analytics, name: "무형자산 증가와 관련 비용 감소(금액 기준 0 이면 켜짐)", file: analytics, path: "relations[id=R-intangible-rnd].threshold", unit: ratio, wp: 2120A, grade: 초기값}
  - {key: R-payroll-headcount.threshold, group: analytics, name: "급여 · 인원 증감률 차이", file: analytics, path: "relations[id=R-payroll-headcount].threshold", unit: ratio, wp: 2120A, grade: 초기값}

