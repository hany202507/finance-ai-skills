  - {key: minutes.증자감자.days, group: keytx, name: "의사록 증자 · 감자 ↔ 전표 일자 차이", file: minutes_topics, path: "topics.증자·감자.match.date_window_days", unit: days, wp: 2100-주요거래, grade: 초기값}
