  - {key: jet.reversal.after, group: jet, name: "기말 후 취소: 결산일 후 보는 일수", file: jet, path: "tests[id=post_ye_reversal].window_after", unit: days, wp: 3600-JET, grade: 초기값}
  - {key: jet.near_ye.days, group: jet, name: "결산일 근처 큰 금액: 결산일 전 일수", file: jet, path: "tests[id=near_ye_large].days", unit: days, wp: 3600-JET, grade: 초기값}
