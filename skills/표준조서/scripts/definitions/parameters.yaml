  - {key: minutes.처분.days, group: keytx, name: "의사록 자산 처분 ↔ 전표 일자 차이", file: minutes_topics, path: "topics.자산 처분.match.date_window_days", unit: days, wp: 2100-주요거래, grade: 초기값}
  - {key: minutes.취득.days, group: keytx, name: "의사록 자산 취득 ↔ 전표 일자 차이", file: minutes_topics, path: "topics.자산 취득.match.date_window_days", unit: days, wp: 2100-주요거래, grade: 초기값}
