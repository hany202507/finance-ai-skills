# 절차 시트가 없던 영역의 증빙 대조 표본 · 전수(2026-10-09, audit/workpapers/vouch.py)
# side: 표본 모집단을 차변(dr) · 대변(cr) 어느 쪽 증가로 볼지. full 이면 표본 대신 전수(행이 적은 영역)
vouch:
  CC: {side: cr, what: 기타유동부채 당기 대변(발생) 분개 행}
  EE: {side: dr, what: 급여 · 퇴직급여 당기 차변(비용) 분개 행}
  Q: {side: dr, what: 매출원가 당기 차변 분개 행}
  # exclude_note: 같은 표시과목인데 다른 영역이 맡는 계정(급여 · 퇴직급여 · 감가상각비 · 무형자산상각비 · 대손상각비)을 표본 근거에 적는다
  R: {side: dr, what: 판매비와관리비 당기 차변 분개 행, exclude_note: true}
  GG: {full: true, sheet: 자본 변동, what: 자본 계정 당기 변동 분개 행}

# 외부조회(3320) 대상 선정
confirmations:
  ar_top_n: 5                # 기말 잔액 상위 거래처 수
  ar_new_parties: true       # 전기 분개장에 없던 거래처는 전부
  ar_over_performance: true  # 잔액이 수행중요성 이상인 거래처는 전부
  ar_sample: true            # 4000C 매출채권 금액 단위 표본에 뽑힌 거래처
  ar_opposite: true          # 기말 잔액이 반대(대변)인 매출채권 거래처는 전부(이중 입금 · 선수 확인, 2026-10-24)
  # 채무 조회(외상매입금 · 미지급금, 2026-10-24). 잔액 상위 · 수행중요성 이상 · 반대(차변) 잔액. 금융기관 이름이 든 거래처는 은행조회로 본다
  ap: true
  ap_top_n: 3
  ap_accounts: [외상매입금, 매입채무, 지급어음, 미지급금]
  alt_days: 31               # 대체 절차 후보에서 결산월 청구로 볼 결산일 전 날 수
  bank_name_keys: [은행, 저축은행, 금고, 캐피탈, 증권]
  # 계정명세서에서 거래처가 금융기관인 시트 이름 낱말(은행조회 대상, R8 진단 #17)
  bank_schedule_sheets: [제예금, 보통예금, 당좌예금, 정기예, 정기적금, 외화예금, 단기차입금, 장기차입금, 금융상품]
  # 계정명세서 거래처 칸에 있어도 거래처가 아닌 줄(조회 대상 · 4000C 표본 모집단에서 뺀다, R8 진단 #14). 공백을 지운 이름에 이 낱말이 있으면 뺀다
  non_party_keywords: [결산조정, 조정분개, 결산분개, 계정대체, 선충전, 예치금, 미확인입금, 일괄조정, 바우처조정]

# 3500 특수관계자 거래 · 잔액 시트(2026-10-16, audit/relparty.py, 감사기준서 550 문단 15 · 16 · 23).
# 목록(영구조서 150 특수관계자목록)에 있는 상대방은 분개장 거래처 칸이 같거나 적요에 이름(min_name_len 글자 이상)이 있으면 잇는다.
# 목록에 없는 후보: 적요에 memo_keys 낱말이 있거나 계정명에 account_keys 낱말이 있는 당기 분개 행. 판정은 감사인
related_parties:
  min_name_len: 3
  memo_keys: [대표이사, 대표님, 임원, 주주, 관계회사, 계열사, 특수관계, 사장님]
  account_keys: [가지급금, 가수금, 주임종, 임원대여, 주주대여]
  candidates_top: 20
  big_vouchers: 3            # 상대방 · 계정마다 금액이 큰 전표 이 수만큼 적는다

# 4000 조서 표지(2026-10-12). 한공회 4000 표지의 경영진 주장 약어. 표지 6~9행에 적는다
cover:
  # 절차 성격 · 시기 제안(2026-11-03, 감사기준서 330 문단 6 추가감사절차의 성격 · 시기 · 범위). 절차 글에 낱말이 있으면 그 값을
  # 표지 기입란에 미리 넣는다. 절차 제목 줄(첫 줄)만 본다. 위에서부터 처음 맞는 규칙을 쓴다. 감사인이 고친 값은 다시 만들어도 남는다. 이슈 대응 줄은 세부 테스트(330 문단 21)
  nature_rules:
    - {nature: 통제 테스트, words: [통제의 운영, 운영효과성, 통제테스트, 통제 테스트]}
    - {nature: 실증 분석적 절차, words: [분석적 검토, 분석적 절차, 분석적절차, 추세 분석, 비율 분석, 증감 분석, 합리성 검토, 기대치]}
  nature_default: 세부 테스트
  timing_rules:
    - {timing: 기말 후, words: [기말 후, 결산일 후, 보고기간 후, 보고기간후, 후속사건, 후속 사건, 감사보고서일, 기말일 이후, 다음 연도]}   # 「후속측정」 은 기말 후가 아니다
  timing_default: 기말            # 중간감사 건(폴더 이름에 「중간」)이면 중간
  assertions:
    - [A, 정확성]
    - [E, 실재성]
    - [RO, 권리와 의무]
    - [C, 완전성]
    - [O, 발생사실]
    - [CL, 분류]
    - [CO, 기간귀속]
    - [V, 평가]
    - [U, 이해가능성]
    - [P, 표시]

# 2110-1 감사전략계획서 9절 「실증절차 수행계획」 의 엔진 제안(2026-11-10 Q-06, audit/analysis/sheets.py w2110_1). 영역마다 [실증절차 유형, 수행시기(대상기간)].
# 감사접근법은 모두 「실증절차 중심」(엔진은 통제 테스트를 두지 않는다), 범위는 2302 위험(riskplan)으로 정한다. 감사인이 표 칸에서 고친다
strategy_plan:
  A: [조회 · 실사, 결산일 기준]
  B: [조회 · 실사 · 평가 검토, 결산일 기준]
  C: [조회 · 세부테스트 · 손실충당금 재계산, 결산일 기준]
  D: [조회 · 세부테스트, 결산일 기준]
  DL: [계약서 검사 · 재계산, 결산일 기준]
  E: [실사 · 평가 검토, 결산일 전후(결산일 기준)]
  G: [조사 · 감가상각 재계산, 기말현장감사(전체 회계기간)]
  H: [조사 · 상각 재계산, 기말현장감사(전체 회계기간)]
  AA: [조회 · 부외부채 검토, 결산일 기준]
  BBDD: [조회 · 이자 재계산(실증적 분석절차), 결산일 기준]
  CC: [세부테스트 · 기간귀속 검토, 결산일 기준]
  EE: [재계산 · 세부테스트, 결산일 기준]
  FF: [변동 검토 · 재계산, 결산일 기준]
  CL: [조회 · 기말 후 출금 검토, 결산일 후(감사보고서일까지)]
  GG: [변동 전수 · 등기 대사, 전체 회계기간]
  P: [세부테스트 · Cut-off · 실증적 분석절차, 기말현장감사(전체 회계기간)]
  Q: [실사 · 원가 재계산, 결산일 기준]
  R: [세부테스트 · 월별 변동(실증적 분석절차), 기말현장감사(전체 회계기간)]
  T: [재계산 · 신고서 대사, 결산일 기준]
  CF: [재계산 · 대사, 결산일 기준]
  default: [세부테스트, 기말현장감사(전체 회계기간)]

# 원자료 대신 요약(2026-10-12 결정). 거래처 목록처럼 줄이 많은 표는 금액 상위 top_rows 줄과 「기타 (n곳)」 한 줄로 줄인다.
# 합계와 검산은 전체 금액이다. 표본 · 신규 · 기말 후 취소 · 조회 회신이 있는 거래처는 줄여도 남긴다
summary:
  top_rows: 30

# 4000 조서의 시트(2026-10-12, audit/workpapers/skeleton.py). 키는 생성기가 만드는 번호 없는 시트 이름이다.
# kind: procedure 는 절차 시트(만든 순서대로 .01 .02 … 번호가 붙고 맨 아래에 발견사항 · 결론 칸이 붙는다),
# summary 는 요약 시트(번호 없음, 주석 뒤에 놓는다). 여기에 없는 시트는 절차로 보고 문구 없이 번호만 붙인다.
# procedure 는 시트 6행에 적는 감사절차 한 줄이고 purpose 는 그 위에 적는 목적 한 줄(이 절차가 겨냥하는 경영진 주장, 2026-11-10 Q-05
# 결정: 예시 조서 나의 「목적 · 절차 · 결과 · 결론」 꼴). 영역마다 다르면 {영역 코드: 문구, default: 문구} 로 적는다
sheets:
  거래처별:
    kind: procedure
    purpose: 매출채권 잔액의 실재성 · 완전성 · 정확성(E · C · A)을 거래처별 명세로 확인한다
    procedure: 거래처별 기말 잔액 명세의 합계를 시산표 매출채권과 대사하고 신규 거래처와 기말 후 입금 · 취소를 확인한다
  표본:
    kind: procedure
    purpose:
      C: 매출채권 잔액의 실재성과 권리(E · RO)를 조회 회신과 증빙으로 확인한다
      P: 매출의 발생사실과 기간귀속(O · CO)을 증빙으로 확인한다
      R: 판매비와관리비의 발생사실 · 정확성 · 분류(O · A · CL)를 증빙으로 확인한다
      default: 거래의 발생사실과 정확성(O · A)을 증빙으로 확인한다
    procedure:
      C: 매출채권 거래처별 잔액에서 금액 단위 표본을 뽑아 조회 회신(3320)과 증빙으로 실재성을 확인한다
      P: 당기 매출 분개 행에서 기간을 나눠 금액 단위 표본을 뽑아 증빙과 대사하고 기간 귀속을 확인한다
      R: 판매비와관리비 분개 행에서 다른 영역이 맡는 계정을 뺀 뒤 금액 단위 표본을 뽑아 증빙과 금액 · 일자 · 계정 분류를 대사한다
      default: 당기 분개 행에서 금액 단위 표본을 뽑아 증빙과 금액 · 일자 · 거래처를 대사한다
  매출 분석:
    kind: procedure
    purpose: 매출의 완전성 · 발생사실 · 기간귀속(C · O · CO)을 분석적 절차로 확인한다
    procedure: 월별 · 거래처별 매출과 매출총이익률, 환입 · 에누리, 결산일 전후 매출, 부가세 과세표준 대사를 분석한다
  거래처별 증감:
    kind: procedure
    purpose: 잔액의 완전성과 정확성(C · A)을 거래처별 증감과 조회 회신으로 확인한다
    procedure: 거래처별 전기말 · 증가 · 감소 · 당기말을 분개장과 명세서로 대사하고 조회 회신액과 비교한다
  차입금 약정:
    kind: procedure
    purpose: 차입금의 완전성 · 권리와 의무 · 표시(C · RO · P)를 약정서와 조회 회신으로 확인한다
    procedure: 차입금 약정 명세(대주 · 만기 · 약정액 · 이율 · 담보)를 약정서와 조회 회신으로 확인한다
  이자 재계산:
    kind: procedure
    purpose: 이자비용의 정확성과 완전성(A · C)을 재계산으로 확인한다
    procedure: 차입처별 적수와 약정 이율로 이자비용을 재계산해 장부 이자와 비교한다
  감가상각 재계산:
    kind: procedure
    purpose: 감가상각비와 상각누계액의 정확성과 평가(A · V)를 재계산으로 확인한다
    procedure: 자산별 취득가액 · 내용연수 · 상각방법으로 당기 감가상각비를 재계산해 장부와 비교한다
  상각 재계산:
    kind: procedure
    purpose: 무형자산 상각비의 정확성과 평가(A · V)를 재계산으로 확인한다
    procedure: 무형자산별 취득가액 · 내용연수로 당기 상각비를 재계산해 장부와 비교한다
  부외부채 검토:
    kind: procedure
    purpose: 부채의 완전성과 기간귀속(C · CO)을 결산일 뒤 지급 전표로 확인한다
    procedure: 결산일 뒤 지급 전표 가운데 당기에 귀속될 비용 · 자산이 있는지 증빙으로 확인한다
  재고실사:
    kind: procedure
    purpose: 재고자산의 실재성 · 완전성 · 권리(E · C · RO)를 실사 입회로 확인한다
    procedure: 재고실사에 입회해 품목별 장부 수량과 실사 수량을 대사하고 타처보관 재고를 확인한다
  금융기관별 잔액:
    kind: procedure
    purpose: 예금의 실재성 · 정확성 · 권리(E · A · RO)를 잔액증명과 조회 회신으로 확인한다
    procedure: 금융기관별 예금 잔액을 잔액증명과 은행조회 회신으로 대사한다
  자본 변동:
    kind: procedure
    purpose: 자본 거래의 발생사실 · 정확성 · 권리와 의무(O · A · RO)를 의사록 · 등기부로 확인한다
    procedure: 자본 계정의 당기 변동 행 전부를 의사록 · 등기부 · 주금납입증명과 대조한다
  변동 전수:
    kind: procedure
    purpose: 당기 변동의 발생사실과 정확성(O · A)을 증빙으로 확인한다
    procedure: 당기 변동 행 전부를 증빙과 대조한다
  Cut-off:
    kind: procedure
    purpose: 매출의 기간귀속(CO)을 결산일 앞뒤 전표로 확인한다
    procedure: 결산일 앞뒤 기간의 매출 전표를 금액이 큰 순서로 뽑아 증빙과 인도일로 귀속 연도를 확인한다
  월별 변동:
    kind: procedure
    purpose: 판매비와관리비의 완전성 · 발생사실 · 기간귀속(C · O · CO)을 월별 변동으로 확인한다
    procedure: 판매비와관리비 세목별 월 금액을 분개장에서 모아 Lead 와 대사하고 월평균보다 크게 늘어난 달의 사유를 확인한다
  기말 후 출금 검토:
    kind: procedure
    purpose: 부채와 우발부채의 완전성과 기간귀속(C · CO)을 결산일 뒤 출금으로 확인한다
    procedure: 결산일 뒤 출금 전표를 상대계정으로 구분하고 기준 금액 이상인 건마다 증빙과 귀속 기간을 확인해 분류(기말 부채 결제 · 당기 비용 · 다음 기간 정상 거래 · 확인 필요)하며, 보고일 직전 분개장을 다시 받으면 앞 판에 없던 전표를 확인해 계상하지 않은 부채와 우발부채를 찾는다
  법률 수수료 거래처 대사:
    kind: procedure
    purpose: 소송 · 배상청구의 완전성(C)을 법률 수수료 거래처로 확인한다
    procedure: 분개장의 법률 수수료 거래처를 회사가 낸 변호사 목록과 외부조회(3320) 변호사 조회 대상에 대사해 빠진 법무법인과 소송 · 배상청구 단서를 찾는다(감사기준서 501 문단 9~10)
  충당부채 변동:
    kind: procedure
    purpose: 충당부채의 완전성과 평가(C · V)를 변동 내역으로 확인한다
    procedure: 충당부채 계정별 기초 · 전입 · 사용 · 환입 · 기말을 분개장으로 모아 Lead 와 대사하고 사용 건을 증빙과 대조한다
  자본변동표:
    kind: procedure
    purpose: 자본의 완전성 · 정확성 · 표시(C · A · P)를 자본변동표와 등기사항으로 확인한다
    procedure: 자본 계정별 기초 · 증자 · 배당 · 당기순이익 · 그 밖의 변동 · 기말을 모아 Lead 와 대사하고 자본금을 등기사항과 대사한다
  변동내역:
    kind: procedure
    purpose: 유형 · 무형자산 변동의 완전성 · 정확성 · 실재성(C · A · E)을 대장으로 확인한다
    procedure:
      G: 유형자산 계정별 전기말 · 취득 · 처분 · 상각 · 당기말을 고정자산대장으로 모아 Lead 와 대사한다
      H: 무형자산 계정별 전기말 · 취득 · 처분 · 상각 · 당기말을 고정자산대장으로 모아 Lead 와 대사한다
      default: 계정별 전기말 · 취득 · 처분 · 상각 · 당기말을 고정자산대장으로 모아 Lead 와 대사한다
