# 11 퇴직급여 조서(retirement)가 더 쓰는 근거. 2026-10-10 fx3. 원문 확인: korean-law MCP get_law_text,
# 법인세법 MST 276111(2025-10-01 시행). 묶음 이름은 rates_2025.yaml 의 retirement 와 겹치지 않게 둔다.

pension_income:
  rule:
    value: "퇴직연금 운용수익을 수익 없이 충당부채 등에 더한 전표는 감지만 하고 조정은 확인 줄로"
    basis: "법인세법 제15조 제1항 (순자산을 증가시키는 수익은 익금). 충당부채에 더한 몫은 32호 당기 설정액에 들어 한도초과로 더해지고 33호 손금산입(시행령 제44조의2 제4항, 기말 운용자산 기준)에도 들어가 합계가 같아진다는 것은 엔진 계산 구조의 설명이다"
    grade: "★★☆"
