/* Rhea Green components (ds/rhea/components/bundle.css 에서 쓰는 부분만) */
*, ::before, ::after { box-sizing: border-box; border-color: var(--border); }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }

.sr-icon { flex-shrink: 0; pointer-events: none; }
/* ---------- Button ---------- */
.sr-button {
  display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; white-space: nowrap;
  border: 1px solid transparent; border-radius: var(--radius-2xl); background-clip: padding-box;
  font: 500 14px/20px var(--font-sans); color: inherit; background-color: transparent; cursor: pointer;
  transition: all .15s ease; outline: none; user-select: none; text-decoration: none;
}
.sr-button .sr-icon { width: 16px; height: 16px; }
.sr-button:focus-visible { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 30%, transparent); }
.sr-button:active:not([aria-haspopup]) { transform: translateY(1px); }
.sr-button:disabled { pointer-events: none; opacity: .5; }
.sr-button[aria-invalid="true"] { border-color: var(--destructive); box-shadow: 0 0 0 3px color-mix(in oklch, var(--destructive) 20%, transparent); }

.sr-button--default { background-color: var(--primary); color: var(--primary-foreground); }
.sr-button--default:hover { background-color: color-mix(in oklch, var(--primary) 80%, transparent); }
.sr-button--outline { border-color: var(--border); background-color: var(--background); }
.sr-button--outline:hover, .sr-button--outline[aria-expanded="true"] { background-color: var(--muted); color: var(--foreground); }
.sr-button--secondary { background-color: var(--secondary); color: var(--secondary-foreground); }
.sr-button--secondary:hover { background-color: color-mix(in oklch, var(--secondary), var(--foreground) 5%); }
.sr-button--ghost:hover, .sr-button--ghost[aria-expanded="true"] { background-color: var(--muted); color: var(--foreground); }
.sr-button--destructive { background-color: color-mix(in oklch, var(--destructive) 10%, transparent); color: var(--destructive); }
.sr-button--destructive:hover { background-color: color-mix(in oklch, var(--destructive) 20%, transparent); }
.sr-button--destructive:focus-visible { border-color: color-mix(in oklch, var(--destructive) 40%, transparent); box-shadow: 0 0 0 3px color-mix(in oklch, var(--destructive) 20%, transparent); }
.sr-button--link { color: var(--primary); text-underline-offset: 4px; }
.sr-button--link:hover { text-decoration: underline; }

.sr-button--size-xs { height: 24px; gap: 4px; padding: 0 10px; font-size: 12px; line-height: 16px; }
.sr-button--size-xs .sr-icon { width: 12px; height: 12px; }
.sr-button--size-sm { height: 28px; gap: 4px; padding: 0 12px; }
.sr-button--size-default { height: 32px; gap: 6px; padding: 0 12px; }
.sr-button--size-lg { height: 36px; gap: 6px; padding: 0 16px; }
.sr-button--size-default:has(> .sr-icon:first-child):not(:has(> .sr-icon:only-child)) { padding-left: 10px; }
.sr-button--size-default:has(> .sr-icon:last-child):not(:has(> .sr-icon:only-child)) { padding-right: 10px; }
.sr-button--size-icon-xs { width: 24px; height: 24px; padding: 0; }
.sr-button--size-icon-xs .sr-icon { width: 12px; height: 12px; }
.sr-button--size-icon-sm { width: 28px; height: 28px; padding: 0; }
.sr-button--size-icon { width: 32px; height: 32px; padding: 0; }
.sr-button--size-icon-lg { width: 36px; height: 36px; padding: 0; }
/* ---------- Badge ---------- */
.sr-badge {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; width: fit-content; height: 20px;
  padding: 2px 8px; border: 1px solid transparent; border-radius: var(--radius-2xl); overflow: hidden;
  font: 500 12px/16px var(--font-sans); white-space: nowrap; transition: all .15s ease;
}
.sr-badge .sr-icon { width: 12px !important; height: 12px !important; }
.sr-badge--default { background: var(--primary); color: var(--primary-foreground); }
.sr-badge--secondary { background: var(--secondary); color: var(--secondary-foreground); }
.sr-badge--outline { border-color: var(--border); color: var(--foreground); }
.sr-badge--destructive { background: color-mix(in oklch, var(--destructive) 10%, transparent); color: var(--destructive); }
.sr-badge--ghost { color: var(--foreground); }
.sr-badge--link { color: var(--primary); text-underline-offset: 4px; }

.sr-badge--link:hover { text-decoration: underline; }
/* ---------- Input, Textarea, NativeSelect ---------- */
.sr-input, .sr-textarea, .sr-native-select {
  width: 100%; min-width: 0; border: 1px solid transparent; border-radius: var(--radius-2xl);
  background: color-mix(in oklch, var(--input) 50%, transparent); color: var(--foreground);
  font: 400 14px/20px var(--font-sans); outline: none; transition: color .2s, box-shadow .2s, border-color .2s;
}
.sr-input { height: 32px; padding: 4px 10px; }
.sr-textarea { min-height: 64px; padding: 8px 10px; resize: none; field-sizing: content; display: block; }
.sr-input::placeholder, .sr-textarea::placeholder { color: var(--muted-foreground); }
.sr-input:focus-visible, .sr-textarea:focus-visible, .sr-native-select:focus-visible {
  border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 30%, transparent);
}
.sr-input[aria-invalid="true"], .sr-textarea[aria-invalid="true"], .sr-native-select[aria-invalid="true"] {
  border-color: var(--destructive); box-shadow: 0 0 0 3px color-mix(in oklch, var(--destructive) 20%, transparent);
}
.sr-input:disabled, .sr-textarea:disabled { opacity: .5; cursor: not-allowed; }
.sr-input::file-selector-button { height: 24px; border: 0; background: transparent; color: var(--foreground); font: 500 14px var(--font-sans); }

.sr-native-select-wrap { position: relative; width: fit-content; }
.sr-native-select-wrap:has(select:disabled) { opacity: .5; }
.sr-native-select { appearance: none; height: 32px; padding: 4px 32px 4px 10px; cursor: pointer; }
.sr-native-select--sm { height: 28px; }
.sr-native-select-icon { position: absolute; top: 50%; right: 10px; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted-foreground); pointer-events: none; }
/* ---------- Tabs ---------- */
.sr-tabs { display: flex; flex-direction: column; gap: 8px; }
.sr-tabs-list {
  display: inline-flex; align-items: center; justify-content: center; width: fit-content; height: 32px; padding: 3px;
  border-radius: var(--radius-2xl); background: var(--muted); color: var(--muted-foreground);
}
.sr-tabs-list--line { background: transparent; gap: 4px; border-radius: 0; }
.sr-tabs-trigger {
  position: relative; display: inline-flex; flex: 1; align-items: center; justify-content: center; gap: 6px;
  height: calc(100% - 1px); padding: 2px 6px; border: 1px solid transparent; border-radius: var(--radius-2xl);
  background: transparent; color: color-mix(in oklch, var(--foreground) 60%, transparent);
  font: 500 14px/20px var(--font-sans); white-space: nowrap; cursor: pointer; outline: none; transition: all .15s;
}
.sr-tabs-trigger:hover { color: var(--foreground); }
.sr-tabs-trigger:focus-visible { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
.sr-tabs-trigger[data-active] { background: var(--background); color: var(--foreground); }
.sr-tabs-list--line .sr-tabs-trigger[data-active] { background: transparent; }
.sr-tabs-list--line .sr-tabs-trigger[data-active]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -5px; height: 2px; background: var(--foreground); }
.sr-tabs-trigger:disabled { pointer-events: none; opacity: .5; }
.sr-tabs-trigger .sr-icon { width: 16px; height: 16px; }
.sr-tabs-content { flex: 1; font-size: 14px; outline: none; }
/* ---------- Table ---------- */
.sr-table-container { position: relative; width: 100%; overflow-x: auto; }
.sr-table { width: 100%; caption-side: bottom; border-collapse: collapse; font: 400 14px/20px var(--font-sans); }
.sr-table-header tr { border-bottom: 1px solid var(--border); }
.sr-table-body tr:last-child { border-bottom: 0; }
.sr-table-footer { background: color-mix(in oklch, var(--muted) 50%, transparent); border-top: 1px solid var(--border); font-weight: 500; }
.sr-table-footer > tr:last-child { border-bottom: 0; }
.sr-table-row { border-bottom: 1px solid var(--border); transition: background-color .15s; }
.sr-table-row:hover { background: color-mix(in oklch, var(--muted) 50%, transparent); }
.sr-table-row[data-state="selected"] { background: var(--muted); }
.sr-table-head { height: 40px; padding: 0 8px; text-align: left; vertical-align: middle; font-weight: 500; white-space: nowrap; color: var(--foreground); }
.sr-table-cell { padding: 8px; vertical-align: middle; white-space: nowrap; }
.sr-table-head.sr-num, .sr-table-cell.sr-num { text-align: right; font-variant-numeric: tabular-nums; }
.sr-table-caption { margin-top: 16px; color: var(--muted-foreground); font-size: 14px; }
/* ---------- Progress, Skeleton, Separator ---------- */
.sr-progress { position: relative; display: flex; width: 100%; height: 8px; overflow: hidden; border-radius: var(--radius-2xl); background: var(--muted); }
.sr-progress-indicator { height: 100%; background: var(--primary); transition: width .3s ease; }
.sr-skeleton { border-radius: var(--radius-2xl); background: var(--muted); animation: sr-pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }
@keyframes sr-pulse { 50% { opacity: .5; } }
.sr-separator { flex-shrink: 0; background: var(--border); border: 0; margin: 0; }
.sr-separator[data-orientation="horizontal"] { width: 100%; height: 1px; }
.sr-separator[data-orientation="vertical"] { width: 1px; align-self: stretch; }
/* ---------- Questionnaire ---------- */
.sr-q { display: flex; flex-direction: column; gap: 24px; width: 100%; min-width: 0; font: 400 14px/20px var(--font-sans); }
.sr-q-progress { display: inline-block; min-width: 14ch; font: 500 12px/16px var(--font-sans); color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.sr-q-item { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.sr-q-title { margin: 0; font: 600 16px/22px var(--font-heading); color: inherit; text-wrap: pretty; }
.sr-q-description { margin: -14px 0 0; font-size: 14px; color: var(--muted-foreground); text-wrap: pretty; }
.sr-q-choices { display: grid; gap: 12px; min-width: 0; }
.sr-q-choice {
  position: relative; display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 12px 16px;
  border: 1px solid var(--input); border-radius: var(--radius-2xl); font-size: 14px; line-height: 1.375;
  text-align: start; cursor: pointer; user-select: none; transition: background-color .15s, border-color .15s;
}
.sr-q-choice:hover { background: color-mix(in oklch, var(--input) 40%, transparent); }
.sr-q-choice[data-checked] { border-color: color-mix(in oklch, var(--primary) 40%, transparent); background: color-mix(in oklch, var(--primary) 10%, transparent); }
.sr-q-choice[data-invalid] { border-color: var(--destructive); }
.sr-q-choice:has(> input:focus-visible) { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
.sr-q-choice[data-disabled] { opacity: .5; pointer-events: none; cursor: not-allowed; }
.sr-q-choice-input { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.sr-q-indicator {
  position: relative; display: flex; flex-shrink: 0; align-items: center; justify-content: center; width: 16px; height: 16px;
  transform: translateY(1.8px); border: 1px solid transparent; border-radius: 5px;
  background: color-mix(in oklch, var(--input) 90%, transparent); color: var(--primary-foreground); pointer-events: none;
}
.sr-q-choice[data-type="radio"] .sr-q-indicator { border-radius: 9999px; }
.sr-q-choice:has(.sr-q-choice-description) .sr-q-indicator { transform: translateY(2px); }
.sr-q-choice[data-checked] .sr-q-indicator { background: var(--primary); border-color: var(--primary); }
.sr-q-indicator .sr-icon { width: 14px; height: 14px; }
.sr-q-dot { display: none; width: 8px; height: 8px; border-radius: 9999px; background: var(--primary-foreground); }
.sr-q-choice[data-checked] .sr-q-dot { display: block; }
.sr-q-choice-content { display: flex; flex: 1; flex-direction: column; gap: 4px; min-width: 0; line-height: 1.375; }
.sr-q-choice-description { color: var(--muted-foreground); }
.sr-q-choice-description.q-sets { display: block; font-size: 12px; overflow-wrap: anywhere; }
.sr-q-shortcut {
  display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; width: 20px; height: 20px; margin-left: auto;
  transform: translateY(1.8px); border: 1px solid color-mix(in oklch, var(--primary) 10%, transparent); border-radius: 9999px;
  background: color-mix(in oklch, var(--background) 80%, transparent); color: var(--muted-foreground);
  font: 500 10px/1 var(--font-mono); pointer-events: none;
}
.sr-q-input-wrapper { width: 100%; }
.sr-q-error { margin: 8px 0 0; font-size: 14px; color: var(--destructive); }
.sr-q-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px; width: 100%; min-height: 32px; }
.sr-q-previous { justify-self: start; }
.sr-q-skip, .sr-q-next, .sr-q-submit { justify-self: end; }
:is([data-theme="dark"], .dark) .sr-q-dot { width: 10px; height: 10px; }

<style>
html:root{
  --font-sans:"Inter","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",ui-sans-serif,system-ui,sans-serif;

}

body{margin:0;background:var(--background);color:var(--foreground)}
a{color:var(--foreground)}a:hover{color:var(--primary)}
button{font-family:inherit}
.app{min-height:100vh;display:flex;flex-direction:column;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:20px}
.ro{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:8px 24px;font-size:13px;line-height:18px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--primary) 7%,var(--background))}
.ro code{font-family:var(--font-mono);font-size:12px;padding:1px 6px;border-radius:var(--radius-md);background:var(--background);box-shadow:0 0 0 1px var(--border);overflow-wrap:anywhere}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:10px 24px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.logo{display:grid;place-items:center;width:28px;height:28px;border-radius:var(--radius-xl);background:var(--foreground);color:var(--background);font-size:13px;font-weight:700}
.co{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;color:var(--muted-foreground)}
.co b{color:var(--foreground);font-weight:500}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted-foreground);font-size:13px}
.pill{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:9999px;background:var(--primary);color:var(--primary-foreground);font-size:11px;font-weight:600;line-height:16px}
.body{flex:1;display:flex;flex-wrap:wrap;align-items:stretch}
.side{flex:1 1 360px;max-width:440px;min-width:0;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--border)}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.steps{padding:20px 20px 16px;display:grid;gap:12px;border-bottom:1px solid var(--border)}
.steps-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted-foreground)}
.steps ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.st{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--radius-xl)}
.st-dot{display:grid;place-items:center;flex-shrink:0;width:20px;height:20px;border-radius:9999px;font-size:11px}
.st-note{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted-foreground);text-align:right}
.st.done .st-dot{background:var(--muted);color:var(--primary)}
.st.cur{background:var(--background);box-shadow:0 0 0 1px var(--border);font-weight:600}
.st.cur .st-dot{background:var(--primary);color:var(--primary-foreground)}
.st.todo{color:var(--muted-foreground)}
.st.todo .st-dot{box-shadow:inset 0 0 0 1px var(--border)}
.work{flex:1;padding:20px;display:grid;gap:20px;align-content:start}
.q-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.choice-main{font-weight:500}
.cap{font-size:12px;font-weight:500;color:var(--muted-foreground)}
.h2s{margin:0;font-size:16px;font-weight:600;line-height:22px}
.ans{display:flex;align-items:flex-start;gap:10px;padding-top:10px;border-top:1px solid var(--border)}
.ans .sr-icon{margin-top:2px}
.ans-t{flex:1;min-width:0;display:grid;gap:2px}
.ans-q{font-size:12px;color:var(--muted-foreground)}
.ans-a{font-weight:500;overflow-wrap:anywhere}
.flat{all:unset;box-sizing:border-box;cursor:pointer}
.flat:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.facts{display:grid;gap:2px;padding-top:12px;border-top:1px solid var(--border)}
.fact{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-2xl)}
button.fact:hover{background:color-mix(in oklch,var(--muted) 70%,transparent)}
.fact-t{flex:1;min-width:0;display:grid}
.fact-t b{font-weight:500}
.fact-t small{font-size:12px;line-height:16px;color:var(--muted-foreground)}
.fact-btns{display:flex;flex-wrap:wrap;gap:6px;padding-left:26px}
.cta{padding:16px 20px;border-top:1px solid var(--border);display:grid;gap:8px}
.cta .sr-button{width:100%}
.cta-hint{font-size:12px;line-height:16px;color:var(--muted-foreground);text-align:center}
.tabbar{padding:12px 24px;border-bottom:1px solid var(--border);overflow-x:auto}
.tabbar [role=tablist]{display:inline-flex;height:32px;padding:3px;border-radius:var(--radius-2xl);background:var(--muted)}
.tabbar .sr-tabs-trigger{padding:2px 12px;flex:none}
.pane{padding:20px 24px 32px;display:grid;gap:24px;align-content:start;max-width:920px;min-width:0}
.pane.wide{max-width:none}
.blk{display:grid;gap:8px;min-width:0}
.blk h3,.blk>summary{margin:0;font-size:13px;font-weight:500;color:var(--muted-foreground);line-height:20px}
.tbl{overflow-x:auto;min-width:0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.card-h{display:grid;gap:6px}
.card-h h2{margin:0;font-size:20px;line-height:28px;font-weight:600}
.sub{font-size:13px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.result{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius-2xl);background:var(--muted)}
.result>span{font-weight:500;flex:1;min-width:0}
.card-acts{display:flex;flex-wrap:wrap;gap:6px}
.comment{margin:0;max-width:68ch;font-size:15px;line-height:24px}
.foot{margin:0;font-size:13px;color:var(--muted-foreground)}
.law{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.law li{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.grade{font-size:12px;letter-spacing:1px;color:var(--muted-foreground)}
.grade.g3{color:var(--primary)}
.lnk{all:unset;cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.lnk:hover{text-decoration-color:currentColor}
.lnk:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.muted{color:var(--muted-foreground)}
details.blk>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary .sr-icon{transition:transform .15s}
details.blk[open]>summary .sr-icon{transform:rotate(90deg)}
.subflow{list-style:none;margin:2px 0 4px 30px;padding:0;display:grid;gap:2px}
.subflow button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;padding:6px 8px;border-radius:var(--radius-xl);font-size:13px}
.subflow button:hover,.subflow button[aria-current="true"]{background:var(--background);box-shadow:0 0 0 1px var(--border)}
.subflow button:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.subflow .sf-n{font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.subflow .sf-meta{grid-column:1/-1;font-size:12px;color:var(--muted-foreground)}
.scope{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 14px;border-radius:var(--radius-2xl);background:var(--muted)}

.scope b{font-weight:600}

      h += '<div style="display:grid;gap:4px"><span class="cap">요청된 자료</span>' + req.map(function (r) {
        return '<div class="req"><span class="file-t"><b>' + esc(r.name) + '</b><span class="cap" style="font-weight:400">' + esc(r.from || "") + "</span></span>" +
          (live ? btn("올리기", "upload", { v: r.name }) : "") + "</div>";
      }).join("") + "</div>";
    }
    h += '<div style="display:grid;gap:2px"><span class="cap" style="padding-bottom:4px">올린 자료 · ' + files.length + "</span>" + files.map(function (f) {
      return '<div class="file">' + icon("check-circle", 16, "color:var(--primary)") + '<span class="file-t"><b>' + esc(f.name) + "</b><code>" + esc(f.file || "") + "</code></span>" +
        '<span class="when">' + esc(f.when || "") + "</span></div>";
    }).join("");
    if (isNum(m.excluded) && m.excluded > 0) h += '<div class="file muted">' + icon("eye-slash") + '<span style="flex:1">제외한 파일</span><span class="when">' + m.excluded + "</span></div>";
    if (!files.length) h += '<p class="empty">올린 자료가 없어요.</p>';
    h += "</div></div></section>";
    return h;
  }
  function render() {
    var app = document.getElementById("app");
    var act = document.activeElement, keepId = act && act.id, selS = null, selE = null;
    var inQ = !!(act && act.closest && act.closest('[data-slot="questionnaire"]'));
    try { if (act && act.tagName === "INPUT" && act.type === "text") { selS = act.selectionStart; selE = act.selectionEnd; } } catch (e) { /* 선택 범위가 없는 입력 */ }
    var sb = app.querySelector(".sheet-b"), sheetTop = sb ? sb.scrollTop : 0;
    app.innerHTML = banner() + header() + '<div class="body' + (ui.busy ? " busy" : "") + '">' + side() + mainArea() + "</div>" + sheet() +
      (ui.toast ? '<div class="toast" role="status">' + esc(ui.toast) + "</div>" : "");
    var sb2 = app.querySelector(".sheet-b");
    if (sb2) sb2.scrollTop = sheetTop;
    var el = keepId ? document.getElementById(keepId) : null;
    if (el) { el.focus({ preventScroll: true }); if (selS != null && el.setSelectionRange) try { el.setSelectionRange(selS, selE); } catch (e) { /* 무시 */ } }
    else if (inQ) { var qel = app.querySelector('[data-slot="questionnaire"]'); if (qel) qel.focus({ preventScroll: true }); }
  }

  /* ---------- 동작 ---------- */
  function goQ(i) { var qs = Q(); if (i < 0 || i >= qs.length) return; ui.qi = i; ui.qerr = null; ui.focus = qs[i].uid; ui.tab = "basis"; }
  function curQ() { return Q()[ui.qi]; }
  function validCur() { var q = curQ(); if (q && required(q) && draftEmpty(q, draftOf(q))) { ui.qerr = q.uid; return false; } return true; }
  function submitAll() {
    var payloads = [];
    Q().forEach(function (q) {
      var d = ui.drafts[q.uid];
      if (!d || draftEmpty(q, d)) return;
      var p = draftPayload(q, d);
      if (!samePayload(q, p)) payloads.push(p);
    });
    decide(payloads, function () { ui.asking = false; ui.drafts = {}; ui.qerr = null; });
  }
  function reopen(uid) {
    var i = qByUid(uid);
    if (i < 0) { ui.focus = uid; ui.tab = "basis"; return; }
    ui.asking = true; ui.drafts = {}; goQ(i);
  }
  var upInput = document.createElement("input");
  upInput.type = "file"; upInput.multiple = true; upInput.style.display = "none";
  document.body.appendChild(upInput);
  var upName = "";
  upInput.addEventListener("change", function () {
    var files = upInput.files;
    if (!files || !files.length) return;
    var fd = new FormData();
    for (var i = 0; i < files.length; i++) fd.append("file", files[i]);
    if (upName) fd.append("name", upName);
    ui.busy = true; render();
    fetch("api/upload", { method: "POST", body: fd })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (d) { DATA = d; ui.busy = false; initUi(true); render(); })
      .catch(function () { ui.busy = false; toast("이 화면에서는 아직 올리지 못해요. 신고건 받은자료 폴더에 넣고 다시 읽어 주세요."); render(); });
    upInput.value = "";
  });

  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!t || t.disabled) return;
    var a = t.getAttribute("data-act"), uid = t.getAttribute("data-uid"), v = t.getAttribute("data-v");
    if (ui.busy && a !== "sheet-close" && a !== "tab" && a !== "card") return;
    switch (a) {
      case "tab": ui.tab = v; break;
      case "group": ui.tab = "summary"; ui.group = v; render(); var gel = document.getElementById("grp-" + v); if (gel) gel.scrollIntoView({ block: "start" }); return;
      case "sheet-view": ui.sheetAll = v === "all"; try { localStorage.setItem("ar-sheet-view", v); } catch (e) { /* 저장 못 해도 화면은 된다 */ } break;
      case "card": ui.focus = uid; ui.tab = "basis"; break;
      case "reopen": reopen(uid); break;
      case "q-prev": goQ(ui.qi - 1); break;
      case "q-next": if (validCur()) goQ(ui.qi + 1); break;
      case "q-skip": if (ui.qi >= Q().length - 1) { submitAll(); return; } goQ(ui.qi + 1); break;
      case "q-submit": if (!validCur()) break; submitAll(); return;
      case "accept-all": accept(ADJ().filter(function (x) { return !x.accepted; }).map(function (x) { return x.uid; })); return;
      case "accept": accept([uid]); return;
      case "undo": undo(uid); return;
      case "sheet-open": ui.sheet = true; render(); var c = document.getElementById("sheet-close"); if (c) c.focus(); return;
      case "sheet-close": ui.sheet = false; render(); var b = document.querySelector('[data-act="sheet-open"]'); if (b) b.focus(); return;
      case "upload": upName = v || ""; upInput.click(); return;
      case "cta": toast("서식 총괄표는 ctax forms 단계입니다"); break;
      default: return;
    }
    render();
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (!t || t.getAttribute("data-change") !== "choice") return;
    var i = qByUid(t.getAttribute("data-uid"));
    if (i < 0) return;
    var q = Q()[i], d = draftOf(q), v = t.getAttribute("data-v");
    var o = optLabel(q, v), value = o ? o.value : v;
    if (q.multiple) {
      var at = d.values.map(String).indexOf(String(value));
      if (at >= 0) d.values.splice(at, 1); else d.values.push(value);
    } else { d.value = value; d.other = ""; }
    if (ui.qerr === q.uid) ui.qerr = null;
    render();
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (!t || t.getAttribute("data-input") !== "other") return;
    var i = qByUid(t.getAttribute("data-uid"));
    if (i < 0) return;
    var q = Q()[i], d = draftOf(q);
    d.other = t.value;
    // 한글 입력(조합) 중에 다시 그리면 글자가 끊긴다. 입력 칸은 두고 선택지 표시만 고친다.
    if (!q.multiple && t.value) {
      d.value = null;
      var sec = t.closest('[data-slot="questionnaire"]');
      if (sec) Array.prototype.forEach.call(sec.querySelectorAll(".sr-q-choice"), function (l) {
        l.removeAttribute("data-checked"); l.removeAttribute("data-invalid");
        var inp = l.querySelector("input"); if (inp) inp.checked = false;
      });
    }
    if (ui.qerr === q.uid) {
      ui.qerr = null;
      var er = document.querySelector(".sr-q-error"); if (er) er.parentNode.removeChild(er);
      Array.prototype.forEach.call(document.querySelectorAll(".sr-q-choice[data-invalid]"), function (l) { l.removeAttribute("data-invalid"); });
    }
  });
  document.addEventListener("toggle", function (e) {
    var t = e.target;
    if (t && t.getAttribute && t.getAttribute("data-toggle") === "others") ui.othersOpen = t.open;
  }, true);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && ui.sheet) { ui.sheet = false; render(); return; }
    var t = e.target || {};
    if (!t.closest || !t.closest('[data-slot="questionnaire"]')) return;
    var q = curQ();
    if (!q) return;
    var typing = t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && t.type === "text");
    if (e.key === "Enter" && !e.shiftKey) {
      if (t.tagName === "BUTTON" || t.tagName === "A") return;
      e.preventDefault();
      if (!validCur()) { render(); return; }
      if (ui.qi >= Q().length - 1) submitAll(); else { goQ(ui.qi + 1); render(); }
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = LETTERS.indexOf(String(e.key).toUpperCase());
    var os = arr(q.options);
    if (k < 0 || k >= os.length || String(e.key).length !== 1) return;
    e.preventDefault();
    var input = document.getElementById("q-ch-" + q.uid + "-" + k);
    if (input) input.click();
  });

  initUi(false);
  render();
})();
</script>
</body>
</html>
