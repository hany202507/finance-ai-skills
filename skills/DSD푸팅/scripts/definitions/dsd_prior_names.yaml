# DSD 푸팅 전기 대사: 작년 보고서와 줄 이름이 조금 다른 줄을 잇는 표현 차이 사전(2026-10-22 실행 시간 P4).
# 이름 짝(dsd_compare._pairs)과 XBRL 항목으로 잇지 못한 줄에만 쓴다. 바꾼 이름이 양쪽 표에 하나씩일 때만 잇는다.
# 줄 이름은 표의 글자 열을 이은 전체 이름(「판매비와관리비 합계 경상연구개발비를 제외한 판매비와관리비 소계 급여」)으로 견준다.
# 줄 이름 키(dsd_compare.row_keys)는 앞 두 칸만 써서 셋째 칸만 다른 줄이 같은 키가 된다(한 상장사 2026 반기 별도 주석 19-2 · 21-2).
#
# 차례: 각주 표시를 뗀 이름에 open_close(맞으면 기초 · 기말로 끝) → swap → 띄어쓰기를 떼고 replace 를 위에서부터 → 쉼표 · 붙임표 · 가운뎃점을 뗀다.
# 각 줄의 출처는 한 상장사 2026 반기 별도를 작년 반기 · 사업보고서와 견줄 때 AI 가 prior_pairs 로 적은 짝이다(10-21).

# 변동표의 기초 · 기말 줄(띄어쓰기를 떼기 전 이름에 건다). 「기초 배출권」 ↔ 「기초」, 「기말 배출권」 ↔ 「반기말」.
# 기간 이름(반기말 · 분기말 · 당기말)은 기말로 읽는다. 「기말상품재고액」 처럼 붙여 쓴 과목은 걸리지 않는다
open_close: '^(?:당|반|분)?(기초|기말)(?:\s+\S.*)?$'

# 「감가상각비, 사용권자산」(XBRL 표준 이름) ↔ 「사용권자산감가상각비」. 쉼표 앞뒤를 바꿔 잇는다(띄어쓰기를 떼기 전 이름에 건다)
swap: '^([^,]+),\s*([^,]+)$'

replace:
  # 「단기차입금의 순감소」 ↔ 「단기차입금의 순증가(감소)」. 괄호 덧말을 떼기 전에 증감 표현을 하나로 맞춘다
  - ['순(?:증가|감소|증감)(?:\((?:증가|감소)\))?', '순증감']
  # 「이자수익(금융수익)」 ↔ 「이자수익」, 「영업이익(손실)」 ↔ 「영업이익」
  - ['\([^()]*\)', '']
  # 「사채 및 장기차입금의 차입」 ↔ 「장기차입금의 차입」. 작년에 사채와 장기차입금을 한 줄로 적은 표
  - ['사채및장기차입금', '장기차입금']
  # 「기타포괄손익-공정가치측정금융자산의처분」 ↔ 「기타포괄손익-공정가치금융자산의 처분」
  - ['공정가치측정', '공정가치']
  # 「기타 변동을 통한 증가(감소)」 ↔ 「기타 변동에 따른 증가(감소)」
  - ['을통한', '에따른']
  # 「지급될 배당금」 ↔ 「배당금」(분기배당 표)
  - ['^지급될', '']
  # 「총 금융자산」 ↔ 「금융자산 합계」
  - ['^총(.+)$', '\1합계']
