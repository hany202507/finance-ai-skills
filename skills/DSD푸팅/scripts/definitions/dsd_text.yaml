# dsd 문장 검토(2026-10-17, audit/report/dsd_text.py). 「푸팅은 상호 레퍼도 해야겠지만 오타 표현수정도 다 잡아야 해.
# 주소수정, 경영진 변경 등 공시필요한 주요 내용 포함해서. 물론 회계감사기간 등 표 이외 것들도」.
#
# 엔진 규칙은 여기 낱말과 기준사실.json 으로만 판정한다. 뜻을 읽어야 하는 오타 · 표현 · 공시 누락은 AI 가 문장.json 에 적는다.
version: 1

# 오타 사전: 틀린 글자 → 바른 글자. 감사보고서 · 주석에서 되풀이되는 것만 둔다. 늘리면 날짜와 출처를 적는다
typos:
  재무재표: 재무제표
  재무상태포: 재무상태표
  손익계산사: 손익계산서
  현금흐름포: 현금흐름표
  자본변동포: 자본변동표
  회게: 회계
  감사보고사: 감사보고서
  충담금: 충당금
  충당부체: 충당부채
  대손충담: 대손충당
  감가상각누게액: 감가상각누계액
  이익잉여금처분게산서: 이익잉여금처분계산서
  결손금처리게산서: 결손금처리계산서
  일반기업회계기쥰: 일반기업회계기준
  보고기관: 보고기간
  보고기간말말: 보고기간말
  계속기업으로서이: 계속기업으로서의
  유의적인인: 유의적인
  감사의의견: 감사의견
  외부감사에관한: 외부감사에 관한
  주식회사등의: 주식회사 등의
  하였읍니다: 하였습니다
  있읍니다: 있습니다
  없읍니다: 없습니다

# 기준서 용어: 옛 용어나 기준서에 없는 말 → 기준서 용어. 「표현」 으로 적는다. 늘리면 날짜와 출처를 적는다
# (10-18, 한 상장사 2025 연결감사보고서 문장 검토에서 AI 가 찾음)
terms:
  공정가액: 공정가치                                   # K-IFRS 1113 · 일반기업회계기준 모두 「공정가치」
  당기손익인식금융부채: 당기손익-공정가치측정 금융부채    # K-IFRS 1109
  당기손익인식금융자산: 당기손익-공정가치측정 금융자산
  회수가능가액: 회수가능액                             # K-IFRS 1036
  기타포괄-공정가치: 기타포괄손익-공정가치

# 띄어쓰기 규칙(2026-10-22). pat 의 a 와 b 사이를 띄운다(join 이면 붙인다). 「오타 · 띄어쓰기」 로 적는다.
# 한 상장사 2026 반기 별도 문장 검토에서 AI 가 적은 오타 37건 가운데 26건이 이 꼴이었다. 공개 감사보고서 15건(2026-03 · 04 공시),
# 한 상장사 2025 사업보고서 연결 · 별도, 회사 dsd 둘에 돌려 틀린 지적이 나온 꼴을 뺐다(「을 대한민국의」, 「사실상의」).
#   fs: false     재무제표 본표의 표 줄(과목 이름)은 보지 않는다. 「영업활동으로인한현금흐름」 처럼 과목 이름을 붙여 쓰는 관행이 있다
#   dsd_only      OpenDART 원문 xml 은 보지 않는다. xml 에는 문단 안 줄바꿈(&cr;)이 빠져 「있습니다.우리의 의견으로는」 처럼 붙어 나온다
#                 (공개 원문 15건에서 133곳). dsd 는 줄바꿈을 빈칸으로 읽는다
# 늘리면 날짜와 찾은 보고서를 적고, 공개 원문에 다시 돌려 틀린 지적이 없는지 본다
spacing:
  - name: 및 뒤
    pat: '(?P<a>(?<=[가-힣)] )및)(?P<b>[가-힣])'
    basis: 「및」 은 앞뒤를 띄어 쓴다
  - name: 및 앞
    pat: '(?P<a>[가-힣])(?P<b>및 [가-힣(])'
    basis: 「및」 은 앞뒤를 띄어 쓴다
  - name: 지 않다
    pat: '(?P<a>[가-힣]지)(?P<b>않[가-힣]|못하[가-힣])'
    basis: 보조용언 「않다 · 못하다」 는 띄어 쓴다
  - name: 기간 중
    pat: '(?P<a>(?:당|전)(?:기|반기|분기)|연도|기간)(?P<b>중)(?=[\s,.)]|$|에[\s,]|의\s)'
    basis: 의존명사 「중」 은 띄어 쓴다(「당기 중」)
  - name: 주식수 중
    pat: '(?P<a>\d주)(?P<b>중)(?=[\s,.)]|$)'
    basis: 의존명사 「중」 은 띄어 쓴다
  - name: 는 데
    pat: '(?P<a>[가-힣]는)(?P<b>데)(?=\s*(?:사용|주력|중점|기여|도움|이용|활용|소요|쓰이|쓰는|걸리|드는|든다|들어가|어려움)|에\s)'
    basis: 일 · 경우를 뜻하는 의존명사 「데」 는 띄어 쓴다. 감사보고서 문안의 「작성하는데 필요하다고」 「발행하는데 있습니다」 는 기준서 예시 문안이라 보지 않는다
  - name: 사이 간
    pat: '(?P<a>회사|기업|법인|부문|세율|당사자|계정|지역|국가|사업부|계열사|금융기관|거래처|자회사|상호|주주|임원|채권자)(?P<b>간)(?=[\s,]|의\s|에\s|에서\s|$)'
    basis: 사이를 뜻하는 「간」 은 띄어 쓴다(「회사 간」)
  - name: 안 내
    pat: '(?P<a>권역|범위|기간|그룹|한도|부문|지역|영업주기)(?P<b>내)(?=[\s,]|의\s|에\s|에서\s|$)'
    basis: 의존명사 「내」 는 띄어 쓴다(「범위 내」)
  - name: 접미사 상
    pat: '(?P<a>재무제표|재무상태표|손익계산서|현금흐름표|자본변동표|장부|세법|계약|회계기준|기준서|규정|정관|법률) (?P<b>상)(?=[\s,]|의\s|으로\s|에\s|$)'
    join: true
    basis: 「~에 따라」 를 뜻하는 접미사 「-상」 은 붙여 쓴다(「손익계산서상」)
  - name: 는바
    pat: '(?P<a>[었았였했]는) (?P<b>바,)'
    join: true
    basis: 연결어미 「-는바」 는 붙여 쓴다
  - name: 글자 뒤 금액
    pat: '(?P<a>[가-힣]{2})(?P<b>\d{1,3}(?:,\d{3})+)'
    basis: 낱말과 금액 사이를 띄어 쓴다
  - name: 조사 뒤 붙임
    pat: '(?P<a>[가-힣](?:에|로|으로|을|를))(?P<b>(?:대한|대해|대하여|관한|관하여|따라|따른|의한|의하여|걸쳐|인한|인하여|위한|위해|위하여|통해|통하여)(?!민국))'
    fs: false
    basis: 조사 뒤 「대한 · 따른 · 위한」 은 띄어 쓴다
  - name: 관형 뒤 붙임
    pat: '(?P<a>(?:에|로|을|를)\s?(?:따른|의한|인한|관한|위한|통한)|(?:에|로)\s?대한)(?P<b>[가-힣](?<!다)(?<!민))'
    fs: false
    basis: 「따른 · 대한 · 위한」 뒤 낱말은 띄어 쓴다(「따른 만기」)
  - name: 등 뒤 영문
    pat: '(?P<a>(?<=\s)등)(?P<b>[A-Za-z0-9])'
    basis: 「등」 뒤를 띄어 쓴다
  - name: 마침표 뒤
    pat: '(?P<a>[가-힣]다\.)(?P<b>[가-힣])'
    dsd_only: true
    basis: 문장이 끝난 마침표 뒤를 띄어 쓴다
  - name: 낫표 앞
    pat: '(?P<a>[가-힣])(?P<b>「)'
    basis: 낫표 앞을 띄어 쓴다
  - name: 기준서 제
    pat: '(?P<a>기준서|해석서)(?P<b>제\d)'
    basis: 「기업회계기준서 제1109호」 처럼 띄어 쓴다
  - name: 홀로 조사
    pat: '(?P<a>[가-힣]) (?P<b>(?:으로|에서|으로서|으로써|에서는|으로는|에게))(?=[\s,.])'
    join: true
    basis: 조사는 앞말에 붙여 쓴다
  - name: 모든 뒤
    pat: '(?P<a>(?<![가-힣])모든)(?P<b>[가-힣])'
    basis: 관형사 「모든」 뒤를 띄어 쓴다
  - name: 적인 뒤
    pat: '(?P<a>[가-힣]적인)(?P<b>[가-힣])(?<!인지)(?<!인가)(?<!인데)(?<!인바)(?<!인양)(?<!인듯)(?<!인즉)'
    basis: 「~적인」 뒤 낱말은 띄어 쓴다
  - name: 목적어 뒤 동사
    pat: '(?P<a>[가-힣''」)](?:을|를))(?P<b>(?:제공|창출|표시|수행|인식|측정|적용|사용|보유|지급|부여|체결|결정|고려|포함|반영)(?:하|되|한|된|할))'
    basis: 목적어 뒤 동사를 띄어 쓴다
  - name: 를 하다
    pat: '(?P<a>[가-힣]를)(?P<b>하(?:는|여|고|였|기|지|며)|한다|합니다|할)'
    basis: 목적어 뒤 「하다」 를 띄어 쓴다
  - name: 에 뒤 동사
    pat: '(?P<a>[가-힣''」)]에)(?P<b>(?:표시|포함|반영|인식|해당|계상|기재)(?:되|하|한|된|할))'
    basis: 조사 「에」 뒤 동사를 띄어 쓴다
  - name: 어 있다
    pat: '(?P<a>[가-힣](?:어|아|여|져|워|하고))(?P<b>있(?:습니다|으며|다|는|고|어|었))'
    basis: 보조용언 「있다」 는 띄어 쓴다(「구성되어 있습니다」 「하고 있습니다」)
  - name: 특성상 뒤
    pat: '(?P<a>특성상|구조상|성격상|편의상|사실상|형식상|업무상|관행상)(?P<b>[가-힣](?<![당대환품황태호승실계각장속위여의은는이으에도만과와]))'
    basis: 「특성상」 뒤 낱말은 띄어 쓴다

# 율 · 률 검사에서 뺄 낱말(고유명사 등)
rate_ok: []

# 반복 낱말 검사에서 뺄 낱말(같은 낱말이 이어져도 맞는 경우)
repeat_ok: [각각, 하나하나, 따로따로, "-"]

# 주소로 보는 글: 이 낱말이 든 문단에서 시 · 도 이름 뒤의 글을 주소로 읽는다
address_keys: [본점, 본사, 소재지, 도로명주소]      # 「주소」 한 낱말은 넣지 않는다(감사인 서명 주소 · 「(가상 주소)」 를 본점으로 읽었다, 10-17)
regions: [서울특별시, 부산광역시, 대구광역시, 인천광역시, 광주광역시, 대전광역시, 울산광역시, 세종특별자치시, 경기도, 강원도, 강원특별자치도,
          충청북도, 충청남도, 전라북도, 전북특별자치도, 전라남도, 경상북도, 경상남도, 제주특별자치도]

# 대표이사 이름을 읽는 글. 「대표이사 홍길동」 「대표이사는 홍길동」 「대표이사: 홍길동」
ceo_pattern: "대표이사(?:는|인|이|\\s*:)?\\s*([가-힣]{2,4}(?:\\(가상\\))?)"
# 대표이사 뒤에 이름이 아닌 낱말이 오는 경우
ceo_not_name: [및, 등, 의, 와, 과, 이사, 선임, 변경, 사임, 취임, 겸, 소유, 보유, 지분, 외, 회사, 해임, 직무, 후보, 명의, 개인, 직속, 산하]   # 해임: 「대표이사 해임권고」 의 「해임권고」 를 이름으로 읽음(한 상장사 2025, 10-18)

# 공시 확인 대상: 감사 폴더 받은자료 사실(의사록 · 등기부 판독)에 이 낱말이 있으면 「공시 확인 대상」 으로 AI 에게 넘긴다
disclosure_keys:
  대표이사 변경: [대표이사 선임, 대표이사 사임, 대표이사 변경, 대표이사 취임, 대표이사로 선임]
  본점 이전: [본점 이전, 본점이전, 본점 소재지 변경, 본사 이전]
  상호 변경: [상호 변경, 상호변경]
  증자 · 감자: [유상증자, 무상증자, 감자, 신주 발행]
  차입 · 담보 · 보증: [차입, 담보, 보증, 근저당]
  후속사건: [결산일 후, 보고기간 후, 기말 후]
