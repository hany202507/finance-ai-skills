# DSD 푸팅: 재무제표 간 연결 규칙(2026-10-12).
# 양쪽 이름을 다 찾았을 때만 건다. 이름은 여러 표기를 차례로 찾는다. col 의 당기 · 전기는 재무제표 표의 기간 열이다.
# 주석 연결과 재무제표 안 소계 구조는 사전 스터디에서 확인한 규칙만 넣는다.
fs_links:
  - id: 재무상태표-대차
    left: {table: 재무상태표, row: [자산총계]}
    right: [{table: 재무상태표, row: [부채와자본총계, 부채및자본총계, 자본과부채총계, 부채와자본의총계]}]
    periods: [당기, 전기]
    basis: 자산총계 = 부채와자본총계
  - id: 재무상태표-부채자본
    left: {table: 재무상태표, row: [부채와자본총계, 부채및자본총계, 자본과부채총계, 부채와자본의총계]}
    right: [{table: 재무상태표, row: [부채총계]}, {table: 재무상태표, row: [자본총계]}]
    periods: [당기, 전기]
    basis: 부채총계 + 자본총계 = 부채와자본총계
  - id: 자본변동표-자본총계
    left: {table: 자본변동표, row: ["@last"], col: "@last"}
    right: [{table: 재무상태표, row: [자본총계], col: 당기}]
    basis: 자본변동표 기말 총계 = 재무상태표 자본총계
  - id: 자본변동표-당기순이익
    left: {table: 자본변동표, row: [당기순이익, 당기순이익(손실), 당기순손실, 당기순손익, 전기순이익, 반기순이익, 반기순이익(손실), 반기순손실, 분기순이익, 분기순이익(손실), 분기순손실], row_nth: "@period", col: "@last"}
    right: [{table: 손익계산서, row: [당기순이익, 당기순이익(손실), 당기순손실, 당기순손익, 연결당기순이익, 반기순이익, 반기순이익(손실), 반기순손실, 분기순이익, 분기순이익(손실), 분기순손실]}]
    periods: [당기, 전기]
    loss_sign: true
    basis: 자본변동표 당기순이익(총계 열) = 손익계산서 당기순이익(K-IFRS 1001 문단 106(4)(가), 일반기업회계기준 2.80⑸). 자본변동표에 당기순이익 줄이 기간마다 하나씩 둘일 때만 건다. 「당기순손실」 처럼 손실만 적는 줄의 양수는 손실 금액으로 읽는다
  - id: 현금흐름표-현금
    left: {table: 현금흐름표, row: [기말의현금, 기말의현금및현금성자산, 기말현금및현금성자산, 기말의현금및현금성자산]}
    right: [{table: 재무상태표, row: [현금및현금성자산, 현금및현금등가물]}]
    periods: [당기, 전기]
    basis: 현금흐름표 기말의 현금 = 재무상태표 현금및현금성자산
# 함께 낸 다른 보고서(연결 ↔ 별도, foot --pair)와 견주는 규칙(2026-10-15). 연결 재무상태표의 자본금은 지배기업의 자본금이다
# (종속기업 자본금은 지배기업의 투자와 상계해 없어진다, K-IFRS 1110 B86). 그래서 연결과 별도의 자본금은 같아야 한다.
pair_links:
  - id: 짝-자본금
    left: {table: 재무상태표, row: [자본금]}
    right: [{table: "짝:재무상태표", row: [자본금]}]
    periods: [당기, 전기]
    basis: 연결과 별도의 자본금은 같다(연결은 지배기업 자본금만 남는다, K-IFRS 1110 B86)
