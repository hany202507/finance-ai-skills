# R4 실행 단계 조서 정의 (2026-10-05)
#
# audit/workpapers 가 읽는다. 계정 → 4000 영역 대응, 표시 부호, 전기 과목 이름, 이슈 대응 절차 줄, 외부조회 대상 선정 기준.
# 영역 대응은 엔진 제안이다. 3650A '계정 매핑' 시트에서 감사인이 확정한다.
# 영역 코드는 한공회 4000 Part 1(tools/proto_data/kicpa_4000_part1.json)의 시트 코드와 같다.

version: 1

# 이 단계 몫 조서: 3650A · 4000 영역(이슈 대응 조서와 수행중요성 초과 표시과목) · 3600-JET · 3320 (audit/workpapers/__init__.py plan)

# 계정 금액과 이슈가 없어도 늘 만드는 영역과 그 까닭(2026-10-12). 우발부채와 약정사항은 잔액이 없어 유의적 계정으로 잡히지 않는다.
# 감사기준서 501 문단 9~12(소송과 배상청구)와 한공회 4000 CL 의 완전성 검토는 감사마다 수행한다. 빼려면 이 줄을 지운다
always_areas:
  CL: 필수(감사기준서 501 · 한공회 4000 CL 우발부채 및 약정사항)

# 금액 리드시트가 없는 영역의 Lead(2026-10-12). 리드시트 자리에 「번호 · 감사절차 · 수행 결과 · 참조 · 발견사항 여부」 표를 둔다.
# wp 는 다른 조서번호, sheet 는 이 파일의 절차 시트(번호 없는 이름, 만들어졌을 때만 적는다)
lead_steps:
  CL:
    - {step: 이사회의사록 검토, wp: 2100-주요거래}
    - {step: 법인인감날인대장 검토}
    - {step: 금융기관조회서 확인, wp: "3320"}
    - {step: 소송사건 검토, wp: "3200"}
    - {step: 기말 후 출금 검토, sheet: 기말 후 출금 검토}
    - {step: 주석 검토, sheet: 주석}

