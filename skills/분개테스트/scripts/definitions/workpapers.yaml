# 계정명에 낱말이 들어 있으면 표시과목보다 먼저 쓴다(위에서부터 처음 맞는 것)
# except 의 낱말이 든 계정명은 그 규칙에서 뺀다. 「손실충당금」(K-IFRS 대손충당금)은 「재고자산평가손실충당금」 에도 들어 있어 뺐다.
# 「손실충당」 으로 두면 공사손실충당부채 · 소송손실충당부채까지 C 로 가므로 「손실충당금」 으로 적었다.
# 「사용권자산」 은 감가상각보다 위에 둔다. 사용권자산상각비 · 사용권자산감가상각누계액이 유형자산(G)으로 갈라지지 않게 한다
account_keywords:
  - {keys: [급여, 상여, 퇴직, 복리후생], area: EE}
  - {keys: [사용권자산], area: DL}
  - {keys: [감가상각], area: G}
  - {keys: [연구, 개발비], area: H}
  - {keys: [이자비용, 이자수익], area: BBDD}
  - {keys: [대손, 손실충당금], except: [평가손실충당금], area: C}
  - {keys: [법인세], area: T}

# 표시 부호: 대변 성격 계정(부채 · 자본 · 수익)은 부호를 뒤집어 양수로 보인다. 더존 계정코드 앞 세 자리 기준
# 영업외수익은 901~930, 931 부터 영업외비용(R8: 더존 표준 계정체계 · accounts.yaml code_sections 와 맞춤)
credit_ranges: [[251, 430], [901, 930]]

# 전기 재무제표 과목 이름이 표시과목과 다를 때(같은 과목으로 본다)
prior_aliases:
  금융원가: [이자비용]
  당기법인세부채: [미지급법인세]

# 이슈 출처별로 4000 절차표 맨 위에 붙이는 대응 절차 줄의 '이 감사에서 할 일' 초안
issue_steps:
  분석적 변동: 변동 원인을 회사에 묻고 답변을 증빙(계약서 · 출고 · 입금)과 대사한다. 기대치를 다시 계산해 차이를 줄인다
  자료 불일치: 두 자료의 차이를 건별로 대사해 원인을 찾고, 장부 수정이 필요한지 정한다
  주요 회계처리: 근거 문서(의사록 · 계약서)와 전표를 대사하고 적용 기준서 문단을 확인한다
  절차 예외: 예외의 원인을 확인하고 같은 성격의 항목을 더 검사한다

# 이슈 대응 줄의 근거(Finding)마다 이 조서에서 대응하는 시트(2026-10-16, audit/workpapers/issuedetail.py).
# 키는 분석 규칙 id 또는 kind:<종류>. 값은 시트 기본 이름(번호 없이) 목록이고 이 조서에 있는 첫 시트를 가리킨다.
# 없으면 표지에 「대응 시트 없음」 이 나가고 감사인이 절차를 적는다. 4000P 는 sales.issue_detail 이 따로 적는다
issue_sheets:
  X-inv-schedule: [재고실사]
  R-inv-cogs: [재고실사]
  E-cogs: [표본]
  X-payroll-wht: [표본]
  E-payroll: [표본]
  R-payroll-headcount: [표본]
  E-interest: [이자 재계산]
  R-debt-interest: [이자 재계산]
  R-sales-ar: [거래처별, 표본]
  R-intangible-rnd: [변동내역, 상각 재계산]
  kind:keytx:minutes: [차입금 약정, 거래처별 증감, 변동내역]
  kind:keytx: [표본, 변동내역, 재고실사, 차입금 약정, 상각 재계산]
  kind:variance: [거래처별 증감, 변동내역, 표본, Lead]
  kind:monthly: [표본, 거래처별 증감, Lead]

# 4000 표지 실증절차 「조서번호」 칸의 처음 값(2026-10-09). 절차 글(번호 줄)에 keys 가운데 하나가 있으면 참조를 미리 적는다.
# sheet 는 같은 조서 안의 시트(만들어졌을 때만 적는다. 번호 없는 이름으로 적으면 조서에는 「.01 거래처별」 처럼 번호 붙은 이름이 들어간다),
# wp 는 다른 조서 번호. area 를 비우면 모든 영역. 엔진이 붙이지 않은 칸에 감사인이 적은 값은 다시 만들어도 남는다
proc_refs:
  - {keys: [총괄표, 비교분석표], sheet: Lead}
  - {keys: [총괄표], sheet: 거래처별 증감}
  - {area: C, keys: [명세서, 회수가능성], sheet: 거래처별}
  - {area: C, keys: [외부 조회], sheet: 표본}
  - {keys: [외부 조회, 금융기관 등에 대한 조회], wp: "3320"}
  - {area: P, keys: [비교분석표, 부가가치세신고서, 분석적], sheet: 매출 분석}
  - {area: P, keys: [기간귀속], sheet: 표본}
  - {area: P, keys: [거래형태별, 수주산업, 진행기준], sheet: 진행기준 매출}
  - {keys: [분석적], wp: "2120A"}
  - {keys: [특수관계자], wp: "3500"}
  - {keys: [공시사항, 공시 사항], wp: "8400"}
  - {area: G, keys: [감가상각비], sheet: 감가상각 재계산}
  - {area: H, keys: [상각비], sheet: 상각 재계산}
  - {area: BBDD, keys: [이자], sheet: 이자 재계산}
  - {area: BBDD, keys: [계약서], sheet: 차입금 약정}
  - {area: AA, keys: [이후 지급], sheet: 부외부채 검토}
  - {area: E, keys: [실사], sheet: 재고실사}
  - {area: A, keys: [명세서, 금융기관 등에 대한 조회], sheet: 금융기관별 잔액}
  - {area: GG, keys: [변동사항], sheet: 자본 변동}
  # 절차 시트 둘째 묶음(2026-10-12, audit/workpapers/substantive.py)
  - {area: P, keys: [기간귀속], sheet: Cut-off}
  - {area: R, keys: [월별명세서, 계상유무], sheet: 월별 변동}
  - {area: R, keys: [기간귀속, 분류되었는지], sheet: 표본}
  - {area: CL, keys: [완전성], sheet: 기말 후 출금 검토}
  - {area: CL, keys: [완전성], wp: "3320"}
  - {area: CL, keys: [완전성], wp: "3200"}
  - {area: FF, keys: [명세서, 변경 내역], sheet: 충당부채 변동}
  - {area: GG, keys: [명세서, 변동사항], sheet: 자본변동표}
  - {area: G, keys: [총괄표, 유형자산명세서], sheet: 변동내역}
  - {area: H, keys: [총괄표, 무형자산명세서], sheet: 변동내역}
  - {area: C, keys: [대손충당금], sheet: 손실충당금 검토}
  - {area: C, keys: [대손충당금], sheet: Roll-Rate}
  - {keys: [증빙, 계상되었, 구성을 검토], sheet: 표본}

# 절차 시트가 없던 영역의 증빙 대조 표본 · 전수(2026-10-09, audit/workpapers/vouch.py)
# side: 표본 모집단을 차변(dr) · 대변(cr) 어느 쪽 증가로 볼지. full 이면 표본 대신 전수(행이 적은 영역)
vouch:
  CC: {side: cr, what: 기타유동부채 당기 대변(발생) 분개 행}
  EE: {side: dr, what: 급여 · 퇴직급여 당기 차변(비용) 분개 행}
  Q: {side: dr, what: 매출원가 당기 차변 분개 행}
  # exclude_note: 같은 표시과목인데 다른 영역이 맡는 계정(급여 · 퇴직급여 · 감가상각비 · 무형자산상각비 · 대손상각비)을 표본 근거에 적는다
  R: {side: dr, what: 판매비와관리비 당기 차변 분개 행, exclude_note: true}
  GG: {full: true, sheet: 자본 변동, what: 자본 계정 당기 변동 분개 행}

# 외부조회(3320) 대상 선정
confirmations:
  ar_top_n: 5                # 기말 잔액 상위 거래처 수
  ar_new_parties: true       # 전기 분개장에 없던 거래처는 전부
  ar_over_performance: true  # 잔액이 수행중요성 이상인 거래처는 전부
  ar_sample: true            # 4000C 매출채권 금액 단위 표본에 뽑힌 거래처
  bank_name_keys: [은행, 저축은행, 금고, 캐피탈, 증권]
  # 계정명세서에서 거래처가 금융기관인 시트 이름 낱말(은행조회 대상, R8 진단 #17)
  bank_schedule_sheets: [제예금, 보통예금, 당좌예금, 정기예, 정기적금, 외화예금, 단기차입금, 장기차입금, 금융상품]
  # 계정명세서 거래처 칸에 있어도 거래처가 아닌 줄(조회 대상 · 4000C 표본 모집단에서 뺀다, R8 진단 #14). 공백을 지운 이름에 이 낱말이 있으면 뺀다
  non_party_keywords: [결산조정, 조정분개, 결산분개, 계정대체, 선충전, 예치금, 미확인입금, 일괄조정, 바우처조정]

# 3500 특수관계자 거래 · 잔액 시트(2026-10-16, audit/relparty.py, 감사기준서 550 문단 15 · 16 · 23).
# 목록(영구조서 150 특수관계자목록)에 있는 상대방은 분개장 거래처 칸이 같거나 적요에 이름(min_name_len 글자 이상)이 있으면 잇는다.
# 목록에 없는 후보: 적요에 memo_keys 낱말이 있거나 계정명에 account_keys 낱말이 있는 당기 분개 행. 판정은 감사인
related_parties:
  min_name_len: 3
  memo_keys: [대표이사, 대표님, 임원, 주주, 관계회사, 계열사, 특수관계, 사장님]
  account_keys: [가지급금, 가수금, 주임종, 임원대여, 주주대여]
  candidates_top: 20
  big_vouchers: 3            # 상대방 · 계정마다 금액이 큰 전표 이 수만큼 적는다

# 4000 조서 표지(2026-10-12). 한공회 4000 표지의 경영진 주장 약어. 표지 6~9행에 적는다
cover:
  assertions:
    - [A, 정확성]
    - [E, 실재성]
    - [RO, 권리와 의무]
    - [C, 완전성]
    - [O, 발생사실]
    - [CL, 분류]
    - [CO, 기간귀속]
    - [V, 평가]
    - [U, 이해가능성]
    - [P, 표시]

# 원자료 대신 요약(2026-10-12 대표 결정). 거래처 목록처럼 줄이 많은 표는 금액 상위 top_rows 줄과 「기타 (n곳)」 한 줄로 줄인다.
# 합계와 검산은 전체 금액이다. 표본 · 신규 · 기말 후 취소 · 조회 회신이 있는 거래처는 줄여도 남긴다
summary:
  top_rows: 30

# 4000 조서의 시트(2026-10-12, audit/workpapers/skeleton.py). 키는 생성기가 만드는 번호 없는 시트 이름이다.
# kind: procedure 는 절차 시트(만든 순서대로 .01 .02 … 번호가 붙고 맨 아래에 발견사항 · 결론 칸이 붙는다),
# summary 는 요약 시트(번호 없음, 주석 뒤에 놓는다). 여기에 없는 시트는 절차로 보고 문구 없이 번호만 붙인다.
# procedure 는 시트 6행에 적는 감사절차 한 줄이다. 영역마다 다르면 {영역 코드: 문구, default: 문구} 로 적는다
sheets:
  거래처별:
    kind: procedure
    procedure: 거래처별 기말 잔액 명세의 합계를 시산표 매출채권과 대사하고 신규 거래처와 기말 후 입금 · 취소를 확인한다
  표본:
    kind: procedure
    procedure:
      C: 매출채권 거래처별 잔액에서 금액 단위 표본을 뽑아 조회 회신(3320)과 증빙으로 실재성을 확인한다
      P: 당기 매출 분개 행에서 기간을 나눠 금액 단위 표본을 뽑아 증빙과 대사하고 기간 귀속을 확인한다
      R: 판매비와관리비 분개 행에서 다른 영역이 맡는 계정을 뺀 뒤 금액 단위 표본을 뽑아 증빙과 금액 · 일자 · 계정 분류를 대사한다
      default: 당기 분개 행에서 금액 단위 표본을 뽑아 증빙과 금액 · 일자 · 거래처를 대사한다
  매출 분석:
    kind: procedure
    procedure: 월별 · 거래처별 매출과 매출총이익률, 환입 · 에누리, 결산일 전후 매출, 부가세 과세표준 대사를 분석한다
  거래처별 증감:
    kind: procedure
    procedure: 거래처별 전기말 · 증가 · 감소 · 당기말을 분개장과 명세서로 대사하고 조회 회신액과 비교한다
  차입금 약정:
    kind: procedure
    procedure: 차입금 약정 명세(대주 · 만기 · 약정액 · 이율 · 담보)를 약정서와 조회 회신으로 확인한다
  이자 재계산:
    kind: procedure
    procedure: 차입처별 적수와 약정 이율로 이자비용을 재계산해 장부 이자와 비교한다
  감가상각 재계산:
    kind: procedure
    procedure: 자산별 취득가액 · 내용연수 · 상각방법으로 당기 감가상각비를 재계산해 장부와 비교한다
  상각 재계산:
    kind: procedure
    procedure: 무형자산별 취득가액 · 내용연수로 당기 상각비를 재계산해 장부와 비교한다
  부외부채 검토:
    kind: procedure
    procedure: 결산일 뒤 지급 전표 가운데 당기에 귀속될 비용 · 자산이 있는지 증빙으로 확인한다
  재고실사:
    kind: procedure
    procedure: 재고실사에 입회해 품목별 장부 수량과 실사 수량을 대사하고 타처보관 재고를 확인한다
  금융기관별 잔액:
    kind: procedure
    procedure: 금융기관별 예금 잔액을 잔액증명과 은행조회 회신으로 대사한다
  자본 변동:
    kind: procedure
    procedure: 자본 계정의 당기 변동 행 전부를 의사록 · 등기부 · 주금납입증명과 대조한다
  변동 전수:
    kind: procedure
    procedure: 당기 변동 행 전부를 증빙과 대조한다
  Cut-off:
    kind: procedure
    procedure: 결산일 앞뒤 기간의 매출 전표를 금액이 큰 순서로 뽑아 증빙과 인도일로 귀속 연도를 확인한다
  월별 변동:
    kind: procedure
    procedure: 판매비와관리비 세목별 월 금액을 분개장에서 모아 Lead 와 대사하고 월평균보다 크게 늘어난 달의 사유를 확인한다
  기말 후 출금 검토:
    kind: procedure
    procedure: 결산일 뒤 출금 전표를 상대계정으로 구분하고 기준 금액 이상인 건의 증빙과 귀속 기간을 확인해 계상하지 않은 부채와 우발부채를 찾는다
  충당부채 변동:
    kind: procedure
    procedure: 충당부채 계정별 기초 · 전입 · 사용 · 환입 · 기말을 분개장으로 모아 Lead 와 대사하고 사용 건을 증빙과 대조한다
  자본변동표:
    kind: procedure
    procedure: 자본 계정별 기초 · 증자 · 배당 · 당기순이익 · 그 밖의 변동 · 기말을 모아 Lead 와 대사하고 자본금을 등기사항과 대사한다
  변동내역:
    kind: procedure
    procedure:
      G: 유형자산 계정별 전기말 · 취득 · 처분 · 상각 · 당기말을 고정자산대장으로 모아 Lead 와 대사한다
      H: 무형자산 계정별 전기말 · 취득 · 처분 · 상각 · 당기말을 고정자산대장으로 모아 Lead 와 대사한다
      default: 계정별 전기말 · 취득 · 처분 · 상각 · 당기말을 고정자산대장으로 모아 Lead 와 대사한다
  손실충당금 검토:
    kind: procedure
    procedure: 연령 구간별 채권 합계를 채권 잔액과 대사하고 구간별 적립율로 충당금을 재계산해 회사 계상액과 비교한다
  진행기준 매출:
    kind: procedure
    procedure: 계약별 계약금액 · 총예정원가 · 누적발생원가로 진행률과 누적 · 당기 수익, 계약자산(부채)을 재계산해 회사 인식액과 비교하고 손실 예상 계약을 확인한다
  Roll-Rate:
    kind: procedure
    procedure: 기준일별 연령분석표로 구간 전이율과 누적 대손율을 계산해 결산일 잔액의 충당금을 재계산하고 회사 계상액과 비교한다
  주석:
    kind: procedure
    procedure: 조서의 확정 금액을 회사가 제시한 주석 금액과 대사하고 공시사항을 검토한다
  매출 요약:
    kind: summary
