# 계정 매핑 사전 (R3, 2026-10-05). audit/analysis 가 읽는다.
#
# 시산표 계정 → accounts id(분석 규칙이 부르는 이름) → 4000 영역 · 구분(section) · 표시과목 기본값
# → 전기 재무제표 과목 이름 맞춤. 표시과목은 회사제시 시산표의 표시과목 열이 먼저다. 이 파일의 label 은 그 열이 없을 때만 쓴다.
#
# 매핑 순서(결정적)
#   1. 계정명(공백 · 괄호를 지운 이름)이 names 의 정규식에 맞는 id. 둘 이상이면 codes 에 계정코드 앞 3글자가 있는 쪽
#   2. 이름이 안 맞으면 codes(더존 계정코드 앞 3글자)
#   3. 그래도 없으면 id 없음. section 은 코드 범위로 정하고 area 는 비운다(분석.json unmapped 에 남기고 회계사 확인을 받는다)
#   names 는 위에서부터 본다. 매출원가처럼 다른 이름을 품는 이름은 앞에 둔다.
#
# 전기 과목 이름 맞춤
#   전기 재무제표 과목은 당기 표시과목과 이름 · 묶음이 다를 수 있다(예: 전기 '예수금·부가세예수금·미지급법인세' 한 줄).
#   과목 이름을 '·' 와 ',' 로 나눈 낱말마다 (가) 당기 표시과목, (나) 계정명, (다) 아래 label_aliases 의 같은 뜻 이름 중
#   하나와 같으면 그 계정에 잇는다. 이어진 당기 과목과 전기 과목을 한 비교 줄로 묶는다(2120A · 8100B 전기 열).
#   subtotals 의 과목은 합계 줄이라 계정에 잇지 않고 엔진 합계와 따로 대사한다.
#
# 영역(area): 4000 계정별 조서 번호의 영문 부분. folder_standard.yaml 의 4000 조서 목록과 같다. CL 은 우발부채 · 약정사항(주석)

areas:
  A: 현금및현금성자산
  B: 유가증권
  C: 매출채권
  D: 기타유동자산
  E: 재고자산
  G: 유형자산
  H: 무형자산
  AA: 매입채무
  BBDD: 차입금
  CC: 기타유동부채
  EE: 급여
  FF: 충당부채
  GG: 자본
  P: 매출
  Q: 매출원가
  R: 판매비와관리비
  T: 법인세
  CF: 현금흐름표
  CL: 우발부채·약정사항

# 더존 계정코드 앞 3글자 범위로 정하는 구분(매핑이 안 된 계정용)
code_sections:
  - {from: 101, to: 250, section: 자산}
  - {from: 251, to: 330, section: 부채}
  - {from: 331, to: 400, section: 자본}
  - {from: 401, to: 450, section: 수익}
  - {from: 451, to: 900, section: 비용}
  - {from: 901, to: 930, section: 수익}
  - {from: 931, to: 999, section: 비용}

# 이름 · 코드로 매핑되지 않은 계정을 코드 범위로 잇는다(R8, 2026-10-06). 회사가 지은 매출 계정 이름(예: '○○국내매출')을
# 매출로 보는 단계다. 근거: 더존 표준 계정체계 매출 401~430(reader 의 매출액 사실과 같은 범위). 이름에 '원가' 가 있으면 잇지 않는다
code_ranges:
  - {from: 401, to: 430, id: revenue, not_names: ['원가']}

# 표시과목 열이 없는 시산표의 재무제표 표시과목(R8, 2026-10-06). 보고(8810 · 8800)와 조서(3650A · 4000 영역)가 쓴다.
# 위 accounts 의 label 은 분석 비교 줄(2120A)용 큰 묶음(기타유동자산 · 판매비와관리비 등)이라 재무제표 과목으로는 너무 굵다.
# 그래서 일반기업회계기준 제2장 표시 과목 이름으로 계정을 묶는 규칙만 여기 따로 둔다. 맞는 규칙이 없으면 계정명이 표시과목이다.
#   근거: 현금및현금성자산 · 매출채권 · 단기투자자산(단기예금) 실2.25 · 실2.26, 자본금 보통주 · 우선주 구분 2.36,
#        급여(임원급여 · 급료 · 임금 · 제수당 포함) · 세금과공과 · 무형자산상각비 실2.47, 매입채무(외상매입금 · 지급어음),
#        당기법인세자산(선납세금) · 당기법인세부채(미지급법인세) 제22장 법인세 표시 과목, 미처분이익잉여금 · 미처리결손금 2.33 이익잉여금(결손금)
#   names 는 공백 · 괄호를 지운 계정명에 대한 정규식이다. only_with: 그 이름의 계정이 시산표에 함께 있을 때만 적용
#   보조계정: 이름이 '부모계정_꼬리'(예: 부가세대급금_JP)이고 부모 계정이 시산표에 있으면 부모 계정의 표시과목을 쓴다
display_lines:
  - {line: 현금및현금성자산, names: ['^현금$', '보통예금', '당좌예금', '^제예금$', '외화예금', '^현금성자산$']}
  - {line: 단기금융상품, names: ['^정기예금$', '^정기적금$', '^정기예\.?적금$', '^정기예적금$']}
  - {line: 매출채권, names: ['^외상매출금$', '^받을어음$']}
  - {line: 당기법인세자산, names: ['^선납세금$']}
  - {line: 매입채무, names: ['^외상매입금$', '^지급어음$']}
  - {line: 당기법인세부채, names: ['^미지급법인세$']}
  - {line: 보통주자본금, names: ['^자본금$'], only_with: 우선주자본금}
  - {line: 미처분이익잉여금, names: ['^이월이익잉여금$', '^미처분이익잉여금$']}
  - {line: 미처리결손금, names: ['^이월결손금$', '^미처리결손금$']}
  - {line: 급여, names: ['^직원급여$', '^임원급여$', '^상여금$', '^급료', '^제수당$', '^급여$']}
  - {line: 세금과공과, names: ['^세금과공과']}
  - {line: 무형자산상각비, names: ['^무형고정자산상각', '^무형자산상각']}

# 같은 뜻의 과목 이름(전기 재무제표와 당기 표시과목을 맞출 때만 쓴다)
label_aliases:
  - [매출액, 매출, 수익]
  - [금융원가, 금융비용, 이자비용]
  - [당기법인세부채, 미지급법인세]
  - [자본잉여금, 주식발행초과금]
  - [현금및현금성자산, 현금및현금등가물]
  - [판매비와관리비, 판매관리비, 판관비]
  - [법인세비용, 법인세등]
  - [선수금, 계약부채]

# 전기 재무제표의 합계 줄. 계정에 잇지 않는다
subtotals: [자산총계, 부채총계, 자본총계, 부채와자본총계, 부채및자본총계, 매출총이익, 영업이익, 영업손실,
            법인세비용차감전순이익, 법인세차감전순이익, 법인세비용차감전순손실, 법인세차감전순손실, 당기순이익, 당기순손실,
            유동자산, 비유동자산, 유동부채, 비유동부채]

