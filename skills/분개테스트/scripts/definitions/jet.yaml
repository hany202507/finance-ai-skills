# 결산조정 전표 유형(R9 묶음 B3, 2026-10-06). 3600-JET 「결산조정 전표」 시트가 쓴다. 시험(걸림)이 아니라 분류표다.
# 샘플 진단 §6.2: 사람 조서는 결산조정 전표를 유형(미수수익 · 선급비용 반대분개, 감가상각, 대손, 퇴직급여, 외화환산, 원가결산)으로 나눠 본다.
# 계정 묶음(closing_accounts): ranges(더존 코드 앞 세 자리) · names(계정명에 든 낱말) · exact(계정명 전체) 가운데 하나라도 맞으면 그 묶음이다.
# 유형(closing_types): pairs 는 [차변 묶음, 대변 묶음]. either 가 참이면 반대 방향(반대분개 · 환입)도 같은 유형이다.
#   lines 는 그 묶음 계정이 한 줄이라도 있으면 그 유형이다. 위에서부터 처음 맞는 유형 하나만 붙인다.
closing_accounts:
  accrued_income: {names: [미수수익]}
  income: {names: [이자수익, 배당금수익, 임대료수익, 수입수수료]}
  prepaid: {names: [선급비용]}
  expense: {ranges: [[801, 899], [931, 960]]}
  depreciation: {names: [감가상각비, 무형자산상각비, 상각비]}
  accumulated: {names: [감가상각누계액, 상각누계액]}
  intangibles: {ranges: [[226, 240]]}
  bad_debt: {names: [대손상각비, 대손충당금환입]}
  allowance: {names: [대손충당금]}
  retirement: {names: [퇴직급여]}
  retirement_provision: {names: [퇴직급여충당부채, 퇴직연금운용자산, 퇴직보험예치금]}
  fx: {names: [외화환산이익, 외화환산손실]}
  cogs: {ranges: [[451, 470]], names: [매출원가]}
  inventory: {ranges: [[146, 175]], exact: [재고자산, 상품, 제품, 원재료, 부재료, 재공품, 저장품, 반제품]}
  mfg_cost: {ranges: [[501, 799]]}
closing_types:
  - {id: depreciation, title: 감가상각 · 무형자산상각, pairs: [[depreciation, accumulated], [depreciation, intangibles]]}
  - {id: accrued_income, title: 미수수익 계상 · 반대분개, pairs: [[accrued_income, income]], either: true}
  - {id: prepaid, title: 선급비용 계상 · 반대분개, pairs: [[prepaid, expense]], either: true}
  - {id: bad_debt, title: 대손충당금 설정 · 환입, pairs: [[bad_debt, allowance]], either: true}
  - {id: retirement, title: 퇴직급여충당부채 설정, pairs: [[retirement, retirement_provision]], either: true}
  - {id: fx, title: 외화환산, lines: [fx]}
  - {id: cost_close, title: 원가결산(매출원가 · 재고 · 제조원가 대체), pairs: [[cogs, inventory], [inventory, mfg_cost], [cogs, mfg_cost]], either: true}
# 결산월: 결산일이 든 달. 유형표는 당기 전체와 결산월을 따로 센다
# 전표 출처: 분개장에 아래 열이 있으면 그 값별로 전표를 세고, manual_values 낱말이 든 값은 수기로 본다(없으면 자동)
source_columns: [입력구분, 전표구분, 입력방법, 작성구분]
manual_values: [수기, 수동, 조정, 결산]
