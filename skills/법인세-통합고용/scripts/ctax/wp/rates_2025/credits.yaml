    basis: 조세특례제한법 제29조의8 제1항 제1호 (중견기업 800만원)
    grade: ★★★
  youth_general:
    value: 4000000
    basis: 조세특례제한법 제29조의8 제1항 제1호 (그 밖의 내국인 400만원)
    grade: ★★★
  other_sme_capital:
    value: 8500000
    basis: 조세특례제한법 제29조의8 제1항 제2호 가목 (청년등 외 상시근로자 증가 인원 × 중소기업 수도권 850만원)
    grade: ★★★
