      2025.12.23> 제34조
    grade: ★★★
  youth_sme_capital:
    value: 14500000
    basis: 조세특례제한법 제29조의8 제1항 제1호 (청년등상시근로자 증가 인원 × 중소기업 1,450만원)
    grade: ★★★
  youth_sme_local:
    value: 15500000
    basis: 조세특례제한법 제29조의8 제1항 제1호 (중소기업으로서 수도권 밖의 지역에서 증가한 경우 1,550만원)
    grade: ★★★
  youth_mid:
