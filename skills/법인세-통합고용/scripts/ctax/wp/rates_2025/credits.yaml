    basis: 조세특례제한법 제29조의8 제1항 제2호 나목 (중소기업 수도권 밖 950만원)
    grade: ★★★
  other_mid:
    value: 4500000
    basis: 조세특례제한법 제29조의8 제1항 제2호 (중견기업 450만원)
    grade: ★★★
  other_general:
    value: 0
    basis: 조세특례제한법 제29조의8 제1항 제2호 (그 밖의 내국인 0원)
    grade: ★★★
  cap:
    value: 청년등 · 청년등 외 증가 인원은 각각 전체 상시근로자 증가 인원 수가 한도, 전체가 늘지 않았으면 공제 없음
    basis: 조세특례제한법 제29조의8 제1항 본문 · 제1호 · 제2호 괄호, 별지 제10호의9서식(1) 작성방법 5
    grade: ★★★
  headcount:
    value: 2025년 1월 1일 이후 개시 과세연도를 최초 공제연도로 하면 근로자별 (근무개월 수 ÷ 과세연도 개월 수, 100분의 1 미만
      버림)의 합, 그 전 과세연도 증가분의 2 · 3차 연도 판정은 매월 말 현재 상시근로자 수의 합 ÷ 과세연도 개월 수. 급여대장으로 세는
      것은 ctax employ(ctax/employ/rules.yaml)
    basis: 조세특례제한법 시행령 제26조의8 제2항 (제23조 제10항 상시근로자) · 제3항 (청년등상시근로자) · 제6항 (계산식, 대통령령
      제36127호로 제11조의2 제8항 준용) · 부칙 <대통령령 제36127호, 2026.2.27> 제11조 제1항, 별지 제10호의10서식
      작성방법 1
    grade: ★★★
  followup:
    value: 증가한 해와 그 뒤 1년(중소 · 중견기업 2년) 같은 금액. 최초 공제 연도보다 전체 상시근로자가 줄면 그해부터 끊기고, 청년등만
      줄면 그해부터 청년등 몫(제1항 제1호)이 끊김
    basis: 조세특례제한법 제29조의8 제1항 본문 · 제3항, 추가 납부세액은 시행령 제26조의8 제4항
    grade: ★★★
