count:
  per_worker:
    value: "근로자별 (근무개월 수 ÷ 과세연도 개월 수)의 합. 2025 과세연도 신고까지는 사람마다 100분의 1 미만을 버린 뒤 더하고, 2026 과세연도 신고부터는 더한 뒤 버린다(sum_floor_from). 매월 말 현재 근무하고 있으면 그 달을 근무개월 수에 넣는다. 청년등 외 = 상시 - 청년등"
    basis: "조세특례제한법 시행령 제26조의8 제6항 · 제11조의2 제8항(대통령령 제36127호), 부칙 제11조 제1항(2025년 1월 1일 이후 개시 과세연도를 최초 공제연도로 신청하는 경우부터), 별지 제10호의10서식 ② · ⑨ · ⑩ 과 작성방법 1 · 12 ~ 15"
    grade: "★★★"
  month_end:
    value: "매월 말 현재 상시근로자 수의 합 ÷ 과세연도 개월 수, 100분의 1 미만 버림"
    basis: "조세특례제한법 시행령 제26조의8 제6항(2025-12-31 시점 시행 판). 2024년 12월 31일이 속하는 과세연도까지를 최초 공제연도로 하는 공제(당기의 2 · 3차 연도 판정)에 쓴다. 부칙 <법률 제21223호, 2025.12.23> 제34조 · 부칙 <대통령령 제35999호, 2025.12.31> 제2조는 2024 · 2025 과세연도에 증가한 경우 그 해와 이후 1년(중소 · 중견 2년) 안의 세액공제를 종전 규정으로 정하고, 2026-10-12 회계사도 같게 확인했다. 2025년을 최초 공제연도로 한 공제의 2 · 3차 연도(2026 · 2027 과세연도)는 근로자별로 센다(부칙 제36127호 제11조 제1항 「최초 공제연도」 기준, 2026-10-15 회계사 확인)"
    grade: "★★★"
  sum_floor_from:
    value: "2026-01-01"
    basis: "조세특례제한법 시행령 제11조의2 제8항 제1호 가목 · 나목(대통령령 제36342호, 2026.5.22 개정: 상시근로자별 계산한 수의 합에서 100분의 1 미만을 버린다. 개정 전은 「계산한 수(100분의 1 미만 버림)의 합」), 제26조의8 제6항 준용, 부칙 <대통령령 제36342호> 제2조 제2항(제26조의8 제6항으로 준용되는 경우 2026년 1월 1일 이후 개시하는 과세연도의 과세표준신고부터), 별지 제10호의10서식(2026.5.22) 작성방법 1 · 7 · 13. 현행 조문은 TaxDoctor · korean-law 같은 판, 개정 전 조문은 korean-law(2026-05-21 시점 판)로 읽었다. 부칙이 신고 시점으로 정해 그 신고의 직전 · 직전전 인원과 기존공제 2차 연도 판정 인원(근로자별)에도 쓴다(이 부분은 해석, ★★☆). 월말 합 방식은 원래 합계에서 버리므로 바뀌지 않는다"
    grade: "★★★"
  unpaid_month:
