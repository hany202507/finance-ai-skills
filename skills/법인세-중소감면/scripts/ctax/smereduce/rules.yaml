    basis: "조세특례제한법 제127조 제5항"
    grade: "★★★"
  split:
    value: "세액감면 사업과 그 밖의 사업을 구분경리하고 그 밖의 사업에 공제가 적용되면 감면과 공제는 중복지원이 아니다"
    basis: "조세특례제한법 제127조 제10항"
    grade: "★★★"

