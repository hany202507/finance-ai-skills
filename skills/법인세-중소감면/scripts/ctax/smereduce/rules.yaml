amount:
  formula:
    value: "감면 대상세액 = 산출세액 × min(1, 감면소득 ÷ 과세표준) × 감면율. 원 미만 버림"
    basis: "조세특례제한법 제7조 제1항(해당 사업장에서 발생한 소득에 대한 법인세 × 감면 비율), 법인세법 제59조 제2항(산출세액 × 감면소득이 과세표준에서 차지하는 비율, 100분의 100 한도). 원 미만 버림은 엔진 규칙"
    grade: "★★★"
  reduced_income:
    value: "감면소득 = 각 사업연도 소득금액 - 감면 제외 소득 - 공제액등 배분액. 공제액등(이월결손금 · 비과세 · 소득공제)이 감면사업에서 생겼으면 전액, 그 밖의 사업이면 0, 불분명하면 소득금액 비례 안분(공제액등 전액을 넘지 않는다)"
    basis: "법인세법 시행령 제96조 제1호 · 제2호(두 곳 원문). 안분액이 공제액등을 넘지 않게 자르는 것은 감면 제외 소득이 음수일 때를 막는 엔진 규칙. 감면 제외 소득(영업외 이자 · 배당 · 임대료 · 처분손익과 감면 업종이 아닌 사업 소득)을 사람이 넣는 것은 조서 20 과 같다(국세청 법인46012-1560, 서면2팀-707)"
    grade: "★★☆"

min_tax:
  rate_sme:
    value: 0.07
    basis: "조세특례제한법 제132조 제1항(중소기업 100분의 7. 100분의 8 · 9 는 처음 중소기업에 해당하지 않게 된 뒤의 율), 시행령 제2조 제2항(유예기간 중에는 중소기업으로 본다). 제7조 감면을 받는 법인은 중소기업이라 7% 를 넘는 율을 넣으면 입력 오류로 멈춘다"
    grade: "★★★"
  cut:
    value: "최저한세로 감면하지 않은 금액은 min(⑦, 감면한도) - ⑨, 한도로 감면하지 않은 금액은 ⑦ - min(⑦, 감면한도)로 셈해 확인 줄에 쓴다. 서식 ⑧ 은 ⑦ 과 최저한세 여지 중 적은 금액으로 두어 ⑨ = min(⑧, 한도)가 실제 감면세액과 같게 한다"
    basis: "별지 제2호서식 작성방법 3(⑦ 은 최저한세액 적용 전의 감면세액) · 4(⑧ 은 ⑦ 에서 최저한세액 적용에 따른 감면 배제세액을 뺀 금액) · 5(⑨ 는 ⑧ 과 감면한도 중 적은 금액). 작성방법은 배제세액을 한도 적용 전후 어느 금액으로 셀지 정하지 않아 ⑦ 이 한도와 최저한세 여지를 함께 넘을 때 ⑧ 에 적을 값은 회계사 확인 전"
    grade: "★★☆"
  target:
    value: "제7조 감면은 최저한세 적용대상이다(세액감면신청서 112 줄)"
    basis: "조세특례제한법 제132조 제1항 제4호(제7조에 따른 법인세의 감면). 단서 가목 ~ 라목에 제7조는 없다"
    grade: "★★★"
  order:
    value: "최저한세 여지에서 회사 시트 「먼저 적용할 다른 최저한세 대상 감면 · 공제」 를 먼저 빼고 남은 여지 안에서 중소기업특별세액감면을 받는다. 같은 해 통합고용세액공제는 감면 뒤 남은 여지에서 받고 넘는 금액은 이월한다"
    basis: "법인세법 제59조 제1항(감면 → 이월공제 안 되는 공제 → 이월공제 되는 공제 순), 조세특례제한법 제132조 제1항, 제144조(최저한세로 공제받지 못한 세액공제 이월). 감면은 이월되지 않으므로 감면을 먼저 받는 것을 기본값으로 둔 것은 엔진 규칙이다. 회계사 확인 전"
    grade: "★★☆"

